<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Painel de Metas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: página branca, linhas finas e tipografia como estrutura; blocos de cor sólida nos indicadores; cantos quase retos; tema único, sempre claro. */
:root{
  --bg:#ffffff; --fg:#111827; --fg2:#4b5563; --fg3:#6b7280; --line:#e5e7eb; --soft:#f3f4f6; --soft2:#e5e7eb;
  --blue:#2563eb; --green:#15803d; --purple:#6d28d9; --orange:#c2410c; --teal:#0f766e; --indigo:#4338ca; --red:#b91c1c; --pink:#be185d; --slate:#334155; --gold:#f59e0b;
  --good:#15803d; --bad:#b91c1c; --good-t:#dcfce7; --bad-t:#fee2e2; --warn-t:#fef3c7; --blue-t:#eff6ff;
  --m-REG:#2a78d6; --m-POR:#eb6834; --m-LIN:#4a3aa7; --m-TI:#1baf7a; --m-CP:#e87ba4; --m-ADM:#eda100; --m-CON:#008300; --m-ASR:#e34948; --m-ING:#2f9bb5;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --r:4px; --gut:clamp(16px,3.2vw,36px);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:22px 56px}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}

/* cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
h1{margin:2px 0 0;font:800 clamp(40px,7vw,64px)/.9 var(--display);letter-spacing:.03em;text-transform:uppercase}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.sw .note{max-width:220px;line-height:1.25;text-align:right}
.switch{position:relative;width:44px;height:24px;border-radius:3px;background:#cbd5e1;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:2px;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.5;cursor:default}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.seg{display:flex;gap:clamp(14px,2.6vw,30px);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:12px 2px 11px;font-size:15px;font-weight:600;color:var(--fg3);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.seg button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.bd{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px}

/* topo da semana */
.hero{padding-block:22px 4px}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:8px}
.nav{width:36px;height:36px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;color:var(--fg)}
.nav:disabled{opacity:.3;cursor:default}
.wk-t{font:800 30px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding-inline:6px}
.wk-d{font-size:14px;color:var(--fg2);padding-inline:6px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:3px;font-size:12px;font-weight:700;background:var(--soft);color:var(--fg2);white-space:nowrap}
.pill.blue{background:var(--blue);color:#fff} .pill.green{background:var(--good-t);color:var(--good)}
.hero-main{display:flex;align-items:stretch;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:20px}
.big{display:flex;align-items:baseline;gap:10px;color:var(--blue)}
.big .bn{font:800 clamp(76px,13vw,128px)/.82 var(--display)}
.big small{font-size:15px;font-weight:600;color:var(--fg2)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{border:2px solid var(--c);border-radius:var(--r);padding:9px 14px 10px;min-width:150px;display:flex;flex-direction:column}
.st span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.st b{font:800 34px/1.05 var(--display);letter-spacing:.02em;color:var(--c);margin-top:2px}
.st small{font-size:12px;color:var(--fg2)}

/* barra de progresso gamificada */
.xp{position:relative;margin-top:22px;padding-top:26px}
.xp-flag{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--fg);white-space:nowrap;text-align:center}
.xp-flag::after{content:"";display:block;margin:2px auto 0;border:5px solid transparent;border-top-color:var(--fg);border-bottom:0}
.xp-track{position:relative;height:34px;border:3px solid var(--fg);background:var(--soft);border-radius:4px}
.xp-fill{height:100%;position:relative;background:repeating-linear-gradient(-45deg,var(--blue) 0 10px,#3b82f6 10px 20px);background-size:28px 28px;animation:stripes 1.1s linear infinite;transition:width .5s ease-out}
.xp-fill.done{background:repeating-linear-gradient(-45deg,var(--green) 0 10px,#16a34a 10px 20px);background-size:28px 28px}
.xp-pct{position:absolute;top:50%;transform:translateY(-50%);font:800 20px/1 var(--display);letter-spacing:.04em;color:#fff;right:8px}
.xp-pct.out{right:auto;left:calc(100% + 8px);color:var(--fg)}
.xp-tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(17,24,39,.28);z-index:2}
.xp-ms{position:relative;height:28px;margin-top:10px}
.ms{position:absolute;top:0;transform:translateX(-50%);min-width:38px;padding:2px 6px;border:2px solid var(--fg3);color:var(--fg3);font-size:11px;font-weight:700;text-align:center;border-radius:3px;background:var(--bg)}
.ms.last{transform:translateX(-100%)}
.ms.on{background:var(--gold);border-color:var(--gold);color:#111827}
@keyframes stripes{to{background-position:28px 0}}
.next{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.next .l{font-size:11.5px;font-weight:700;color:var(--fg3);letter-spacing:.08em;text-transform:uppercase}
.next .t{font-size:16px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next .grow{min-width:0;flex:1}

/* indicadores: blocos de cor sólida */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}
.kpi{border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:152px;background:var(--k);color:#fff;text-align:left}
.kpi .lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.kpi .num{font-size:clamp(30px,3.8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.kpi .num small{font-size:.42em;font-weight:500;letter-spacing:0;margin-left:4px;color:rgba(255,255,255,.9)}
.kpi .sub{font-size:13px;color:rgba(255,255,255,.92);line-height:1.3}
.kpi .viz{margin-top:auto;padding-top:12px;display:flex;align-items:flex-end;min-height:36px}
.kpi.blue{--k:var(--blue)} .kpi.green{--k:var(--green)} .kpi.purple{--k:var(--purple)} .kpi.orange{--k:var(--orange)}
.kpi.teal{--k:var(--teal)} .kpi.indigo{--k:var(--indigo)} .kpi.pink{--k:var(--pink)} .kpi.red{--k:var(--red)} .kpi.slate{--k:var(--slate)}
.sbars{display:flex;align-items:flex-end;gap:3px;height:34px;width:100%}
.sbars span{flex:1;background:#fff;min-height:3px}
.sbars span.z{background:rgba(255,255,255,.28)}
.spark{position:relative;width:100%;height:34px}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.spark .pt{position:absolute;width:9px;height:9px;background:#fff;transform:translate(-50%,-50%)}
.bar2{height:8px;background:rgba(255,255,255,.3);width:100%}.bar2 i{display:block;height:100%;background:#fff}
.plan .bar2{background:var(--soft2)} .plan .bar2 i{background:var(--k)}
.steps{display:flex;gap:3px}.steps i{width:10px;height:10px;border:2px solid var(--fg3);border-radius:2px}.steps i.d{background:var(--green);border-color:var(--green)}

/* seções e listas */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
h3{margin:0;font-size:15px;font-weight:700}
.chip{padding:6px 12px;border-radius:var(--r);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dt{width:18px;height:18px;border-radius:2px;border:2px solid var(--c,var(--fg3));background:transparent;flex:none}
.dt.d{background:var(--c,var(--fg3))} .dt.p{background:linear-gradient(90deg,var(--c,var(--fg3)) 50%,transparent 50%)}
.banner{margin-top:14px;padding:10px 12px;border-left:4px solid var(--orange);background:var(--warn-t);font-size:13.5px;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.grp{min-width:0}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding-bottom:8px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between}
.list{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:12px 2px;cursor:pointer;border-bottom:1px solid var(--line);min-width:0}
.row:hover{background:var(--soft)} .row:active{background:var(--soft2)}
.chk{width:24px;height:24px;border-radius:4px;border:2px solid #9ca3af;flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s}
.chk svg{width:14px;height:14px;opacity:0;stroke:#fff}
.row.done .chk{background:var(--green);border-color:var(--green)} .row.done .chk svg{opacity:1}
.row.part .chk{border-color:var(--orange);background:linear-gradient(90deg,var(--orange) 50%,transparent 50%)}
.rt{min-width:0;flex:1}
.rt .t{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.done .rt .t{color:var(--fg3);font-weight:500}
.rt .s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);margin-top:3px}
.rt .ls{margin-top:5px;font-size:12.5px;color:var(--fg2);display:flex;gap:7px;align-items:baseline;min-width:0}
.rt .ls b{flex:none;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--soft);color:var(--fg2);padding:1px 6px;border-radius:2px}
.rt .ls span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.tag i{width:9px;height:9px;border-radius:1px;background:var(--c,var(--fg3))} .tag.ring i{background:transparent;border:2px solid var(--c,var(--fg3))}
.rb{display:inline-block;padding:1px 7px;border-radius:2px;background:var(--blue-t);color:var(--blue);font-size:11.5px;font-weight:700}
.late{color:var(--bad);font-weight:700}
.res{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.res small{display:block;font-size:11.5px;font-weight:500;color:var(--fg2);margin-top:2px}
.sc{display:inline-block;padding:2px 7px;border-radius:3px;font-size:12px;font-weight:700}
.sc.hi{background:var(--good-t);color:var(--good)} .sc.mid{background:var(--warn-t);color:#92400e} .sc.lo{background:var(--bad-t);color:var(--bad)} .sc.na{background:var(--soft);color:var(--fg3)}
.empty{padding:18px 2px;color:var(--fg2);font-size:14px;border-bottom:1px solid var(--line)}
.lead{font-size:14px;color:var(--fg2);max-width:70ch;margin:0 0 4px}

/* cards de gráficos */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--fg2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:1px;background:var(--c)}
.chart{width:100%;min-height:60px} .chart svg{display:block;overflow:visible}
.chart text{font:11px var(--font);fill:var(--fg3)} .chart .em{fill:var(--fg);font-weight:700;font-size:12px}
.hb{display:flex;flex-direction:column;gap:11px}
.hb-r{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb-l{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}.hb-l i{width:9px;height:9px;border-radius:1px;flex:none;background:var(--c)}
.hb-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--soft);position:relative}
.hb-t i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.hb-v{font-weight:700;min-width:44px;text-align:right}.hb-v small{font-weight:500;color:var(--fg3);margin-left:4px}
.stk{display:flex;height:14px;gap:2px;margin:4px 0 10px}.stk i{display:block;height:100%;background:var(--c)}
.heat{display:grid;grid-template-columns:124px repeat(var(--n),minmax(0,1fr));gap:2px;align-items:center;font-size:11px}
.heat .h{color:var(--fg3);text-align:center;font-weight:600}
.heat .y{font-size:12.5px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:6px;min-width:0}.heat .y i{width:9px;height:9px;border-radius:1px;background:var(--c);flex:none}
.heat .y span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:26px;border-radius:2px;background:var(--soft);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--fg)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.hot{color:#fff}

/* matérias */
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.mat{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.mat-h{display:block;width:100%;text-align:left;padding:16px;border-top:4px solid var(--c)}
.mat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mat-n{font-size:16px;font-weight:700;min-width:0}
.mat-st{display:flex;gap:22px;margin-top:12px}.mat-st b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}.mat-st span{font-size:12px;color:var(--fg2)}
.cv{height:6px;background:var(--soft);margin-top:14px}.cv i{display:block;height:100%;background:var(--c)}
.mat-b{border-top:1px solid var(--line)}
.as{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.as:hover{background:var(--soft)} .as+.as{border-top:1px solid var(--line)}
.as .t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:550}
.as .w{font-size:12px;color:var(--fg3);font-weight:700;width:28px;flex:none}
.chev{display:inline-block;transition:transform .15s}.open .chev{transform:rotate(90deg)}

/* plano */
.plan{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.pr{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:13px 8px;cursor:pointer;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.pr:hover{background:var(--soft)} .pr.cur{background:var(--blue-t);box-shadow:inset 4px 0 0 var(--blue)}
.pr .w{font-weight:700;font-size:16px}.pr .d{font-size:13px;color:var(--fg2)}.pr .d small{display:block;color:var(--fg3);font-size:11.5px}
.pr .pg{min-width:0}.pr .pg .bar2{margin-bottom:5px}.pr .pg span{font-size:12px;color:var(--fg2)}
.pr .a{text-align:right;min-width:52px}

/* ficha da meta */
.ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain;border-top:6px solid var(--blue)}
.sh-k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.sh-t{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.sh-m{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.sh-p{font-size:14px;color:var(--fg2);margin:10px 0 0}
.box{margin-top:14px;border:2px solid var(--fg);border-radius:var(--r);padding:10px 12px}
.box b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:3px}
.box p{margin:0;font-size:14.5px;font-weight:600}
.box small{display:block;margin-top:4px;font-size:12px;color:var(--fg3)}
.tp{margin:4px 0 0;padding-left:18px;font-size:14px;font-weight:500}.tp li{margin:3px 0}
.gd{margin:12px 0 0;padding:0 0 0 20px;font-size:14px;color:var(--fg)}.gd li{margin:5px 0;padding-left:4px}
.f{border-top:2px solid var(--fg);margin-top:16px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;min-height:54px;border-bottom:1px solid var(--line)}
.fr label,.fr .fl{font-weight:600;font-size:15px}.fr .fl small{display:block;font-weight:500;font-size:12px;color:var(--fg2)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:var(--r);background:var(--soft);font-size:20px;line-height:1;display:grid;place-items:center}
.step button:active{background:var(--soft2)}
.step input,.num-in{width:70px;text-align:center;font:inherit;font-weight:700;font-size:17px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--fg);padding:4px 0;border-radius:0;-moz-appearance:textfield}
.step input:focus,.num-in:focus{outline:none;border-bottom-color:var(--blue)}
.step input::-webkit-inner-spin-button,.num-in::-webkit-inner-spin-button{display:none}
.live{margin-top:16px;display:flex;gap:10px}
.live div{flex:1;background:var(--soft);border-radius:var(--r);padding:10px 12px}.live b{display:block;font-size:20px}.live span{font-size:12px;color:var(--fg2)}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:16px;font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--red);margin-top:4px;font-weight:600;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:3px;max-width:240px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.soon{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;margin-top:14px}
.soon h2{font:800 32px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.soon p{max-width:52ch;margin:10px auto 0;color:var(--fg2)}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.7}}
@media (min-width:700px){.ov{align-items:center}.sheet{border-top-width:0;border-left:6px solid var(--blue)}}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.mats{grid-template-columns:minmax(0,1fr)}.stats{width:100%}.st{flex:1;min-width:0}}
@media (max-height:480px) and (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{min-height:130px}.ov{align-items:center}}
@media (max-width:560px){.sw .note{display:none}.hb-r{grid-template-columns:100px minmax(0,1fr) auto}.pr{grid-template-columns:40px minmax(0,1fr) auto}.pr .pg{grid-column:1/-1;grid-row:2}.heat{grid-template-columns:34px repeat(var(--n),minmax(0,1fr))}.heat .y span{display:none}.cell{font-size:0;height:22px}.kpi{min-height:140px;padding:14px}.st b{font-size:28px}}
@media (min-width:561px){.heat .y .sh{display:none}}
@media (max-width:560px){.heat .y .sh{display:inline}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      out[m.id+"~R"+st]={r:1,dt:ymd(dd),min:RV.d,c:ok,e:tot-ok,b:0};prev=ymd(dd);
    }

}

}

/* ---------- agregação ---------- */
function agg(){
  const T=today(),p=P(),cw=curWeek();
  const a={tot:{c:0,e:0,b:0,min:0,metas:0,done:0},mat:{},wk:WK.map(()=>({plan:0,real:0,c:0,e:0,b:0,n:0,done:0})),day:{},heat:{},content:{n:0,done:0},tipo:{},cw,revDone:0};
  SUBJ.forEach(k=>{a.mat[k]={c:0,e:0,b:0,min:0,plan:0,blocks:0,done:0};a.heat[k]=WK.map(()=>({c:0,e:0,b:0}))});
  const addT=(g,v)=>{a.tipo[g]=(a.tipo[g]||0)+v};
  for(const m of ALL){
    const w=a.wk[m.wi],pm=planMin(m),done=isDone(m),mr=minReal(m),it=itemsOf(m);
    w.plan+=pm;w.n++;if(done)w.done++;w.real+=mr;w.c+=it.c;w.e+=it.e;w.b+=it.b;
    a.tot.c+=it.c;a.tot.e+=it.e;a.tot.b+=it.b;a.tot.min+=mr;a.tot.metas++;if(done)a.tot.done++;
    addT(m.t==="teoria_questoes"?"Teoria e questões":m.t==="ingles"?"Inglês":grp(m)==="aval"?"Simulado e discursiva":grp(m)==="dom"?"Domingo":"Questões e reforço",mr);
    const pr=p[m.id];if(pr&&pr.dt&&mr)a.day[pr.dt]=(a.day[pr.dt]||0)+mr;
    if(SUBJ.includes(m.k)){
      const s=a.mat[m.k];s.plan+=pm;s.min+=mr;s.c+=it.c;s.e+=it.e;s.b+=it.b;
      const h=a.heat[m.k][m.wi];h.c+=it.c;h.e+=it.e;h.b+=it.b;
      if(m.t==="teoria_questoes"){s.blocks++;if(done)s.done++}
    }
    if(m.t==="teoria_questoes"){a.content.n++;if(done)a.content.done++}
  }
  for(const id in p){
    const i=id.indexOf("~R");if(i<0)continue;
    const b=BY[id.slice(0,i)];if(!b)continue;
    const doc=p[id],mr=doc.min!=null?doc.min:(doc.r?RV.d:0),c=doc.c||0,e=doc.e||0,bb=doc.b||0;
    const wi=doc.dt?weekOf(doc.dt):b.wi,w=a.wk[wi];
    w.real+=mr;w.c+=c;w.e+=e;w.b+=bb;
    a.tot.c+=c;a.tot.e+=e;a.tot.b+=bb;a.tot.min+=mr;addT("Revisões",mr);
    if(doc.dt&&mr)a.day[doc.dt]=(a.day[doc.dt]||0)+mr;
    if((doc.r||0)>=1)a.revDone++;
    if(SUBJ.includes(b.k)){const s=a.mat[b.k];s.min+=mr;s.c+=c;s.e+=e;s.b+=bb;const h=a.heat[b.k][wi];h.c+=c;h.e+=e;h.b+=bb}
  }
  let planned=0;
  for(let i=0;i<WK.length;i++){const n=WK[i].m.length;if(i<cw)planned+=n;else if(i===cw){const di=dday(T,pd(WK[i].i));planned+=di<0?0:Math.min(n,Math.floor(n*(di+1)/7))}}
  a.planned=planned;
  return a;
}

  const hm=`<div class="heat" style="--n:${WK.length}"><div></div>${WK.map((w,i)=>`<div class="h">${i+1}</div>`).join("")}${SUBJ.map(k=>`<div class="y" style="--c:var(--m-${k})"><i></i><span>${SHORT[k]}</span><span class="sh">${k}</span></div>${A.heat[k].map((c,i)=>{const r=rate(c),nn=c.c+c.e+c.b;if(r==null)return `<div class="cell ${i===cw?"cur":""}" data-tip="${SHORT[k]} · semana ${i+1}: sem questões"></div>`;const al=.12+.88*Math.pow(r,1.3);return `<div class="cell ${al>.5?"hot":""} ${i===cw?"cur":""}" style="background:rgba(37,99,235,${al.toFixed(2)})" data-tip="${SHORT[k]} · semana ${i+1}: ${pc(r)} em ${nn} itens">${Math.round(r*100)}</div>`}).join("")}`).join("")}</div>`;
  return `
  <section class="sec" style="margin-top:20px"><div class="grid2">
    <div class="card"><div class="card-h"><div><h3>Horas líquidas por semana</h3><p>Realizado contra o planejado (inclui revisões)</p></div><div class="legend"><span style="--c:var(--blue)"><i></i>Real</span><span style="--c:var(--soft2)"><i></i>Plano</span></div></div><div class="chart" data-kind="weekHours"></div></div>
    <div class="card"><div class="card-h"><div><h3>Horas acumuladas</h3><p>Distância do plano até hoje</p></div><div class="legend"><span style="--c:var(--blue)"><i></i>Real</span><span style="--c:var(--fg3)"><i></i>Plano</span></div></div><div class="chart" data-kind="cumHours"></div></div>
    <div class="card"><div class="card-h"><div><h3>Acertos por semana</h3><p>Certos ÷ itens respondidos, sem desconto por erro</p></div></div><div class="chart" data-kind="accWeek"></div></div>
    <div class="card"><div class="card-h"><div><h3>Horas por dia</h3><p>Últimos 14 dias</p></div></div><div class="chart" data-kind="dayHours"></div></div>
    <div class="card"><div class="card-h"><div><h3>Acertos por matéria</h3><p>Maior para menor</p></div></div>${n?`<div class="stk" aria-hidden="true"><i style="--c:var(--good);width:${tot.c/n*100}%" data-tip="Certos ${tot.c}"></i><i style="--c:var(--bad);width:${tot.e/n*100}%" data-tip="Errados ${tot.e}"></i><i style="--c:var(--fg3);width:${tot.b/n*100}%" data-tip="Brancos ${tot.b}"></i></div><div class="legend" style="margin-bottom:12px"><span style="--c:var(--good)"><i></i>Certos ${pc(tot.c/n)}</span><span style="--c:var(--bad)"><i></i>Errados ${pc(tot.e/n)}</span><span style="--c:var(--fg3)"><i></i>Brancos ${pc(tot.b/n)}</span></div>`:""}${barsHtml(accRows)}</div>
    <div class="card"><div class="card-h"><div><h3>Horas por matéria</h3><p>Líquidas e total planejado</p></div></div>${barsHtml(hRows)}</div>
    <div class="card"><div class="card-h"><div><h3>Cobertura do edital</h3><p>Assuntos novos vistos, sem revisões, simulados ou reforços</p></div></div>${barsHtml(cRows)}</div>
    <div class="card"><div class="card-h"><div><h3>Onde o tempo foi</h3><p>Horas líquidas por tipo de atividade</p></div></div>${tot.min?barsHtml(tRows):'<div class="empty">Sem horas registradas.</div>'}</div>
    <div class="card wide"><div class="card-h"><div><h3>Mapa de acertos</h3><p>Matéria por semana. Quanto mais forte o azul, maior o acerto.</p></div><div class="legend"><span style="--c:rgba(37,99,235,.2)"><i></i>0%</span><span style="--c:rgba(37,99,235,1)"><i></i>100%</span></div></div>${hm}</div>
  </div></section>`;
}

/* ---------- gráficos SVG ---------- */
const NS=(w,h,aria)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}">`;
function cols(el,bars,o){
  const w=el.clientWidth||320,h=o.h||190,pl=34,pr=4,pt=10,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=bars.length,st=iw/n,bw=Math.min(26,st*.64);
  const mx=o.max,Y=v=>pt+ih-ih*Math.min(v,mx)/mx;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  const rr=(x,y,w_,h_)=>`M${x},${y+h_}V${y}H${x+w_}V${y+h_}Z`;
  bars.forEach((b,i)=>{
    const x=pl+st*i+(st-bw)/2;
    if(b.g!=null&&b.g>0)s+=`<path d="${rr(x,Y(b.g),bw,ih-(Y(b.g)-pt))}" fill="var(--soft2)"/>`;
    if(b.v>0)s+=`<path d="${rr(x,Y(b.v),bw,ih-(Y(b.v)-pt))}" fill="${b.c||"var(--blue)"}"/>`;
    s+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle" ${b.hi?'class="em"':""}>${b.l}</text>`;
    s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(b.t)}"/>`;
  });
  s+=`<line x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--soft2)" stroke-width="1"/></svg>`;
  el.innerHTML=s;
}
function lines(el,labels,series,o){
  const w=el.clientWidth||320,h=o.h||190,pl=34,pr=14,pt=14,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=labels.length,st=iw/n;
  const X=i=>pl+st*(i+.5),Y=v=>pt+ih-ih*Math.max(0,Math.min(v,o.max))/o.max;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  labels.forEach((l,i)=>{s+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle" ${o.hi===i?'class="em"':""}>${l}</text>`});
  series.forEach(se=>{
    let d="",open=false,last=null,first=null;
    se.vals.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);open=true;last=i;if(first==null)first=i});
    if(!d)return;
    if(se.fill&&last!=null)s+=`<path d="${d} L${X(last)} ${pt+ih} L${X(first)} ${pt+ih}Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.5}" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 5"':""}/>`;
    if(se.dots)se.vals.forEach((v,i)=>{if(v!=null)s+=`<rect x="${X(i)-3.5}" y="${Y(v)-3.5}" width="7" height="7" fill="${se.color}" stroke="var(--bg)" stroke-width="2"/>`});
    if(last!=null&&se.end){s+=`<rect x="${X(last)-5}" y="${Y(se.vals[last])-5}" width="10" height="10" fill="${se.color}" stroke="var(--bg)" stroke-width="2.5"/><text class="em" x="${Math.min(X(last),w-pr-12)}" y="${Y(se.vals[last])-12}" text-anchor="middle">${se.end(se.vals[last])}</text>`}
  });
  labels.forEach((l,i)=>{s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(o.tip(i))}"/>`});
  s+="</svg>";el.innerHTML=s;
}
function drawCharts(){
  document.querySelectorAll(".chart").forEach(el=>{
    const k=el.dataset.kind,cw=A.cw,T=today();
    if(k==="weekHours"){
      const bars=WK.map((w,i)=>{const x=A.wk[i];return {l:i+1,v:i<=cw?x.real/60:0,g:x.plan/60,hi:i===sel,t:`Semana ${i+1}: ${fmtH(x.real)} líquidas de ${fmtH(x.plan)} planejadas`}});
      cols(el,bars,{max:45,ticks:[0,15,30,45],tf:t=>t+"h",aria:"Horas líquidas por semana"});
    }else if(k==="cumHours"){
      let p=0,r=0;const plan=[],real=[];
      WK.forEach((w,i)=>{p+=A.wk[i].plan;plan.push(p/60);r+=A.wk[i].real;real.push(i<=cw?r/60:null)});
      const mx=Math.max(100,Math.ceil(Math.max(p,r)/60/100)*100);
      lines(el,WK.map((w,i)=>i+1),[{vals:plan,color:"var(--fg3)",dash:true,w:2},{vals:real,color:"var(--blue)",fill:true,end:v=>fmtH(v*60)}],{max:mx,ticks:[0,mx/2,mx],tf:t=>t+"h",hi:sel,aria:"Horas acumuladas contra o plano",tip:i=>`Até a semana ${i+1}: plano ${fmtH(plan[i]*60)}${real[i]!=null?` · real ${fmtH(real[i]*60)}`:""}`});
    }else if(k==="accWeek"){
      const v=WK.map((w,i)=>{const r=rate(A.wk[i]);return r==null?null:r*100});
      lines(el,WK.map((w,i)=>i+1),[{vals:v,color:"var(--green)",fill:true,dots:true,end:x=>Math.round(x)+"%"}],{max:100,ticks:[0,25,50,75,100],tf:t=>t+"%",hi:sel,aria:"Acertos por semana",tip:i=>{const x=A.wk[i],n=x.c+x.e+x.b;return n?`Semana ${i+1}: ${pc(rate(x))} em ${n} itens`:`Semana ${i+1}: sem questões`}});
    }else if(k==="dayHours"){
      const bars=[];for(let i=13;i>=0;i--){const d=addDays(T,-i),key=ymd(d),v=(A.day[key]||0)/60;bars.push({l:d.getDate(),v,hi:i===0,t:`${fmtDay(key)}: ${fmtH(v*60)}`})}
      const m=Math.max(6,Math.ceil(Math.max(...bars.map(b=>b.v))));
      cols(el,bars,{max:m,ticks:[0,m/2,m],tf:t=>t+"h",aria:"Horas por dia"});
    }else if(k==="sims"){
      const acc=SIMS.map(m=>{const it=itemsOf(m),r=isDone(m)?rate(it):null;return r==null?null:r*100});
      const nl=SIMS.map(m=>{const it=itemsOf(m),r=isDone(m)?net(it):null;return r==null?null:r*100});
      lines(el,SIMS.map((m,i)=>i+1),[{vals:acc,color:"var(--green)",dots:true,end:x=>Math.round(x)+"%"},{vals:nl,color:"var(--purple)",dots:true}],{max:100,ticks:[0,25,50,75,100],tf:t=>t+"%",aria:"Evolução dos simulados",tip:i=>{const it=itemsOf(SIMS[i]);return isDone(SIMS[i])?`Simulado ${i+1}: acerto ${pc(rate(it))}, líquida ${pc(net(it))}`:`Simulado ${i+1}: pendente`}});
    }
  });
}

/* ---------- ficha da meta ---------- */
let sheetId=null,draft=null;
function openSheet(id){
  const m=getM(id);if(!m)return;sheetId=id;
  const p=P()[id]||{};draft={r:p.r||0,c:p.c||0,e:p.e||0,b:p.b||0,min:p.min!=null?p.min:null,dt:p.dt||null,nc:p.nc!=null?p.nc:null,ne:p.ne!=null?p.ne:null,tl:p.tl!=null?p.tl:null};
  const ro=demo,r=rp(m),items=hasItems(m),isD=m.t==="discursiva";
  const fld=(k,l,sub)=>`<div class="fr"><div class="fl">${l}${sub?`<small>${sub}</small>`:""}</div><div class="step"><button data-s="${k}" data-d="-1" aria-label="Menos ${l}" ${ro?"disabled":""}>−</button><input type="number" inputmode="numeric" min="0" id="f-${k}" data-f="${k}" value="${draft[k]||0}" ${ro?"disabled":""}><button data-s="${k}" data-d="1" aria-label="Mais ${l}" ${ro?"disabled":""}>+</button></div></div>`;
  const dfld=(k,l,sub,step)=>`<div class="fr"><div class="fl">${l}<small>${sub}</small></div><input class="num-in" type="number" inputmode="decimal" step="${step}" min="0" id="f-${k}" data-f="${k}" value="${draft[k]==null?"":draft[k]}" ${ro?"disabled":""}></div>`;
  const kick=m.rv?RVTXT[m.step].t:(TIPO[m.t]||"Meta");
  const rvInfo=m.rv?(()=>{const r_=RL.find(x=>x.id===id);return r_?`<p class="sh-p">${r_.done?`Feita em ${fmtDay(r_.doc.dt)}.`:`Prevista para ${fmtDay(r_.due)}.`} Assunto concluído em ${fmtDay(P()[m.base.id].dt)}.</p>`:""})():"";
  $("#sheet").innerHTML=`<div class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Registrar meta">
    <div class="sh-k">${esc(kick)}</div>
    <h2 class="sh-t">${esc(m.a)}</h2>
    <div class="sh-m">${SUBJ.includes(m.k)?`<span class="pill">${tagHtml(m)}</span>`:""}<span class="pill">${fmtH(planMin(m))}</span><span class="pill">Semana ${m.wi+1}</span>${m.e&&!m.rv?`<span class="pill">Edital: ${esc(m.e)}</span>`:""}</div>
    ${rvInfo}
    ${m.ls?`<div class="box"><b>Lei seca sugerida</b><p>${esc(m.ls)}</p><small>Confira a numeração no texto oficial atualizado.</small></div>`:""}
    ${m.tp?`<div class="box"><b>${m.rv?"O que revisar":"O que estudar"}</b><ul class="tp">${m.tp.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${m.w?`<p class="sh-p">${esc(m.w)}</p>`:""}
    ${m.g?`<ol class="gd">${m.g.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
    ${m.ft?`<p class="sh-p"><b>Fonte:</b> ${esc(m.ft)}</p>`:""}
    <div class="f">
      ${r>1?fld("r","Repetições feitas",`de ${r}`):`<div class="fr"><div class="fl">Concluída</div><button class="switch" role="switch" id="f-done" aria-checked="${draft.r>=1}" ${ro?"disabled":""}></button></div>`}
      <div class="fr"><div class="fl">Minutos líquidos<small>planejado ${planMin(m)} min</small></div><div class="step"><button data-s="min" data-d="-5" ${ro?"disabled":""} aria-label="Menos 5 minutos">−</button><input type="number" inputmode="numeric" min="0" id="f-min" data-f="min" placeholder="${planMin(m)}" value="${draft.min==null?"":draft.min}" ${ro?"disabled":""}><button data-s="min" data-d="5" ${ro?"disabled":""} aria-label="Mais 5 minutos">+</button></div></div>
    </div>
    ${items?`<div class="f">${fld("c","Certos",m.i?`alvo cerca de ${m.i} itens`:"")}${fld("e","Errados")}${fld("b","Brancos")}</div>
    <div class="live"><div><b id="lv-a">–</b><span>acertos</span></div><div><b id="lv-l">–</b><span>nota líquida</span></div><div><b id="lv-n">0</b><span>itens</span></div></div>`:""}
    ${isD?`<div class="f">${dfld("nc","NC","nota de conteúdo","0.1")}${dfld("ne","NE","número de erros de português","1")}${dfld("tl","TL","total de linhas escritas","1")}</div><div class="live"><div><b id="lv-d">–</b><span>nota (NC − 2·NE÷TL)</span></div></div>`:""}
    ${ro?`<button class="btn" disabled>Desligue os dados de exemplo para registrar</button>`:`<button class="btn" data-act="save">Salvar</button>${P()[id]?`<button class="btn ghost" data-act="clear">Limpar registro</button>`:""}`}
  </div></div>`;
  liveUpd();
}
function liveUpd(){
  const a=$("#lv-a");
  if(a){const n=draft.c+draft.e+draft.b;a.textContent=n?Math.round(draft.c/n*100)+"%":"–";$("#lv-l").textContent=n?Math.round((draft.c-draft.e)/n*100)+"%":"–";$("#lv-n").textContent=n}
  const d=$("#lv-d");if(d)d.textContent=draft.tl?f1((draft.nc||0)-2*(draft.ne||0)/draft.tl):"–";
}
function closeSheet(){sheetId=null;$("#sheet").innerHTML=""}
function sheetSave(){
  const m=getM(sheetId);if(!m)return;
  const r=rp(m),done=r===1?($("#f-done").getAttribute("aria-checked")==="true"?1:0):Math.min(r,draft.r);
  const n=draft.c+draft.e+draft.b,hasD=draft.nc!=null||draft.ne!=null||draft.tl!=null;
  if(!done&&!n&&draft.min==null&&!hasD){save(sheetId,null);closeSheet();return}
  const doc={r:done};
  if(n){doc.c=draft.c;doc.e=draft.e;doc.b=draft.b}
  if(draft.nc!=null)doc.nc=draft.nc;if(draft.ne!=null)doc.ne=draft.ne;if(draft.tl!=null)doc.tl=draft.tl;
  doc.min=draft.min!=null?draft.min:(done?Math.round(planMin(m)*done/r):0);
  doc.dt=draft.dt||ymd(new Date());
  save(sheetId,doc);closeSheet();
}
function toggle(id){
  if(demo)return openSheet(id);
  const m=getM(id),p=real[id];if(!m)return;
  if(isDone(m)){const d={...p,r:0};if(!(d.c||d.e||d.b)&&!d.min&&d.nc==null&&d.tl==null){save(id,null)}else{save(id,d)}return}
  save(id,{...(p||{}),r:rp(m),min:p&&p.min!=null&&p.min>0?p.min:planMin(m),dt:(p&&p.dt)||ymd(new Date())});
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]");
  if(s&&sheetId){const k=s.dataset.s,d=+s.dataset.d,inp=$("#f-"+k);let v=(draft[k]==null?(k==="min"?planMin(getM(sheetId)):0):draft[k])+d;v=Math.max(0,v);if(k==="r")v=Math.min(rp(getM(sheetId)),v);draft[k]=v;inp.value=v;liveUpd();return}
  const sw=e.target.closest("#f-done");
  if(sw&&!sw.disabled){sw.setAttribute("aria-checked",sw.getAttribute("aria-checked")==="true"?"false":"true");return}
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const a=t.dataset.act;
  if(a==="close"){if(e.target===t)closeSheet();return}
  if(a==="toggle"){e.stopPropagation();toggle(t.dataset.id);return}
  if(a==="open"){openSheet(t.dataset.id);return}
  if(a==="tab"){tab=t.dataset.v;render();window.scrollTo(0,0);return}
  if(a==="wk"){sel=Math.max(0,Math.min(WK.length-1,sel+ +t.dataset.d));render();return}
  if(a==="cur"){sel=curWeek();render();return}
  if(a==="only"){onlyPend=!onlyPend;render();return}
  if(a==="plan"){sel=+t.dataset.i;tab="semana";render();window.scrollTo(0,0);return}
  if(a==="mat"){const k=t.dataset.k;openMat[k]=!openMat[k];render();return}
  if(a==="demo"){demo=!demo;demoChosen=demo;LS.set("painel-demo",demo?"1":"0");if(demo&&!Object.keys(DEMO).length)DEMO=genDemo();sel=curWeek();render();return}
  if(a==="save"){sheetSave();return}
  if(a==="clear"){save(sheetId,null);closeSheet();return}
});
document.addEventListener("input",e=>{
  const i=e.target.closest("[data-f]");if(!i)return;
  const k=i.dataset.f,v=i.value.replace(",",".");
  if(k==="nc")draft.nc=v===""?null:Math.max(0,parseFloat(v)||0);
  else if(k==="ne"||k==="tl")draft[k]=v===""?null:Math.max(0,parseInt(v,10)||0);
  else draft[k]=i.value===""?(k==="min"?null:0):Math.max(0,parseInt(i.value,10)||0);
  liveUpd();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheetId)closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("row")){e.preventDefault();openSheet(e.target.dataset.id)}
});
const tip=$("#tip");let tipT=null;
function showTip(t,x,y){tip.textContent=t.dataset.tip;if(!t.dataset.tip){return}tip.classList.add("on");const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";tip.style.top=Math.max(8,y-h-14)+"px"}
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType==="mouse")showTip(t,e.clientX,e.clientY);else if(e.pointerType==="mouse")tip.classList.remove("on")});
document.addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType!=="mouse"){showTip(t,e.clientX,e.clientY);clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove("on"),2200)}});
let rz=null;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>A&&drawCharts(),120)});
addEventListener("orientationchange",()=>setTimeout(()=>A&&drawCharts(),250));

/* ---------- início ---------- */
loadLocal();autoDemo();
sel=curWeek();
render();
initDb();
})();
</script>
