<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087a40"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Metas"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3"><link rel="shortcut icon" href="favicon.ico?v=3"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script><script src="firebase-config.js"></script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Painel de Metas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: página branca, linhas finas e tipografia como estrutura; blocos de cor sólida nos indicadores; cantos quase retos; tema único, sempre claro. */
:root{
  --bg:#ffffff; --fg:#111827; --fg2:#4b5563; --fg3:#6b7280; --line:#ece6df; --soft:#f6f2ed; --soft2:#ebe3da;
  --blue:#087a40; --green:#0b7a3c; --purple:#1557b6; --orange:#b57f00; --teal:#0b7a6b; --indigo:#1f6fc2; --red:#b42318; --pink:#3d7a1a; --slate:#1d3b5c; --gold:#ffd21a; --amber:#c58f00;
  --good:#0b7a3c; --bad:#b42318; --good-t:#dcfce7; --bad-t:#fee2e2; --warn-t:#fef3c7; --blue-t:#e6f5ec;
  --m-REG:#2a78d6; --m-POR:#eb6834; --m-LIN:#4a3aa7; --m-TI:#1baf7a; --m-CP:#e87ba4; --m-ADM:#eda100; --m-CON:#008300; --m-ASR:#e34948; --m-ING:#2f9bb5;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Nunito","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --r:14px; --gut:clamp(16px,3.2vw,36px);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:22px 56px}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}

/* cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:20px 66px 18px 22px;margin-bottom:14px;border-radius:26px;background:linear-gradient(115deg,#d9f1e2 0%,#fff3b8 48%,#d6e8fb 100%)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.top .eyebrow{color:#33503f}
h1{margin:2px 0 0;font:900 clamp(25px,6.6vw,54px)/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(95deg,#0a5c3a 0%,#087a40 45%,#1557b6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mgap{height:54px}
.splash{min-height:70vh;display:grid;place-items:center}.splash i{width:30px;height:30px;border-radius:50%;border:4px solid #d9efe2;border-top-color:#0b7a3c;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sw:empty{display:none}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.sw .note{max-width:220px;line-height:1.25;text-align:right}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:#cbd5e1;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.5;cursor:default}

/* menu lateral */
.mbtn{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,calc(env(safe-area-inset-right,0px) + 14px));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);box-shadow:0 2px 12px rgba(10,60,35,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mbtn svg{width:20px;height:20px;fill:#0a5c3a}
.mbtn .mb{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.dov{position:fixed;inset:0;z-index:60;background:rgba(10,40,25,.42);animation:fade .15s}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(320px,86vw);background:var(--bg);border-radius:0 28px 28px 0;box-shadow:12px 0 40px rgba(10,40,25,.2);display:flex;flex-direction:column;animation:slidein .2s ease-out;overflow:auto;padding-bottom:20px}
.drawer .dh{padding:max(22px,env(safe-area-inset-top,0px)) 22px 18px;background:linear-gradient(160deg,#0a8f4b 0%,#14a653 30%,#ffd21a 62%,#2f8be0 86%,#1557b6 100%);color:#fff}
.drawer .dh b{display:block;font:900 22px/1.1 var(--display);text-transform:uppercase;text-shadow:0 2px 8px rgba(0,60,30,.3)}
.drawer .dh span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.95;text-shadow:0 1px 6px rgba(0,60,30,.35)}
.drawer nav{padding:12px 12px 0;display:flex;flex-direction:column;gap:2px}
.drawer nav button{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:13px 16px;border-radius:16px;font-size:16px;font-weight:600;color:var(--fg2)}
.drawer nav button:hover{background:var(--soft)}
.drawer nav button[aria-selected="true"]{background:#e3f4ea;color:#0a5c3a;font-weight:800}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
/* abas */
.tabs{display:none}
.seg{display:flex;gap:clamp(14px,2.4vw,28px);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:12px 2px 11px;font-size:15px;font-weight:600;color:var(--fg3);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.seg button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.bd{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:inline-grid;place-items:center;padding:0 5px}

/* topo da semana */
.hero{padding-block:22px 4px}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:8px}
.nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;color:var(--fg)}
.nav:disabled{opacity:.3;cursor:default}
.wk-t{font:900 26px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;padding-inline:6px}
.wk-d{font-size:14px;color:var(--fg2);padding-inline:6px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--fg2);white-space:nowrap}
.pill.blue{background:var(--blue);color:#fff} .pill.green{background:var(--good-t);color:var(--good)} .pill.warn{background:var(--warn-t);color:#92400e}
.hero-main{display:flex;align-items:stretch;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:20px}
.big{display:flex;align-items:baseline;gap:10px;color:var(--green)}
.big .bn{font:900 clamp(70px,12vw,112px)/.85 var(--display)}
.big small{font-size:15px;font-weight:600;color:var(--fg2)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{border:2px solid var(--c);border-radius:16px;padding:10px 16px 11px;min-width:150px;display:flex;flex-direction:column}
.st span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.st b{font:900 32px/1.1 var(--display);color:var(--c);margin-top:2px}
.st small{font-size:12px;color:var(--fg2)}

/* barra de progresso gamificada */
.xp{position:relative;margin-top:22px;padding-top:26px}
.xp-flag{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--fg);white-space:nowrap;text-align:center}
.xp-flag::after{content:"";display:block;margin:2px auto 0;border:5px solid transparent;border-top-color:var(--fg);border-bottom:0}
.xp-track{position:relative;height:30px;background:var(--soft2);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;position:relative;border-radius:99px;background:repeating-linear-gradient(-45deg,#16a34a 0 10px,#22c55e 10px 20px);background-size:28px 28px;animation:stripes 1.1s linear infinite;transition:width .5s ease-out}
.xp-fill.done{background:repeating-linear-gradient(-45deg,#15803d 0 10px,#16a34a 10px 20px);background-size:28px 28px}
.xp-pct{text-shadow:0 1px 2px rgba(0,0,0,.25);position:absolute;top:50%;transform:translateY(-50%);font:900 17px/1 var(--display);color:#fff;right:8px}
.xp-pct.out{right:auto;left:calc(100% + 10px);color:var(--fg);text-shadow:none}
.xp-tick{position:absolute;top:6px;bottom:6px;width:2px;border-radius:2px;background:rgba(17,24,39,.14);z-index:2}
.xp-ms{position:relative;height:28px;margin-top:10px}
.ms{position:absolute;top:0;transform:translateX(-50%);min-width:38px;padding:2px 6px;border:2px solid var(--soft2);color:var(--fg3);font-size:11px;font-weight:700;text-align:center;border-radius:99px;background:var(--bg)}
.ms.last{transform:translateX(-100%)}
.ms.on{background:var(--gold);border-color:var(--gold);color:#111827}
.xp-cap{margin:8px 0 0;font-size:13px;color:var(--fg2)}
@keyframes stripes{to{background-position:28px 0}}
.next{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:linear-gradient(120deg,#ffdcae 0%,#ffe9c8 100%);border:1.5px solid #f2a33a;cursor:pointer;text-align:left;width:100%}
.next .muted{color:#6b3a05}
.next .l{font-size:11.5px;font-weight:700;color:#8a4300;letter-spacing:.08em;text-transform:uppercase}
.next .t{font-size:16px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next .grow{min-width:0;flex:1}

/* indicadores: blocos de cor sólida */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}
.cd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:16px;background:linear-gradient(135deg,#ffd21a,#ffe36b);color:#14301f;box-shadow:0 6px 16px rgba(20,48,31,.22),0 2px 0 rgba(255,255,255,.5) inset;animation:cdf 4s ease-in-out infinite}.cd-n{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}.cd-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.cd-t b{font-size:12px;line-height:1.15}.cd-t span{font-size:11.5px;opacity:.85}.cd-b{display:block;height:5px;border-radius:9px;background:rgba(20,48,31,.18);margin-top:5px;overflow:hidden}.cd-b u{display:block;height:100%;background:#14301f;border-radius:9px}@keyframes cdf{50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){.cd{animation:none}}
.kpi.sea{--k:#0b5e8a}
.pfnav{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:10px 60px 10px 0;margin-top:14px;background:var(--bg);scrollbar-width:none}.pfnav::-webkit-scrollbar{display:none}.pfnav .chip{flex:none}
.pfh{margin:40px 0 14px;scroll-margin-top:64px}.pfh h2{font-size:26px;margin:0;letter-spacing:-.01em}.pfh p{margin:4px 0 0;font-size:14px;color:var(--fg2)}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:thin}.hs .kpi{flex:0 0 184px;scroll-snap-align:start;min-height:150px}
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.ic{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px 16px;background:var(--bg)}.ic b{display:block;font-size:15px}.ic p{margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg2)}.ic.bad{--c:var(--bad)}.ic.warn{--c:var(--orange)}.ic.info{--c:var(--blue)}.ic.good{--c:var(--good)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;-webkit-overflow-scrolling:touch}.mtb{border-collapse:collapse;width:100%;min-width:660px;font-size:13.5px}.mtb th,.mtb td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}.mtb th:first-child,.mtb td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);z-index:1}.mtb th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2)}.mtb tr.tt td{font-weight:800;border-bottom:0;background:var(--soft)}.mtb tr.tt td:first-child{background:var(--soft)}
.fzr{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px;font-size:13.5px;color:var(--fg2)}.fzr .clk b{font-variant-numeric:tabular-nums;color:var(--fg)}.fzb{display:inline-flex;gap:6px}.fzb .chip{padding:6px 12px;font-weight:800}
@media (max-width:560px){.ins{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:8px}.ic{flex:0 0 84%;scroll-snap-align:start}}
.hero-head>div:last-child{flex-basis:100%}.hero-head .cd{margin-left:auto;flex:none}
@media (max-width:560px){.hero-head{flex-wrap:wrap;gap:10px 8px}.hero-head .nav{width:30px;height:30px;font-size:17px}.hero-head .wk{gap:4px}.hero-head .wk-t{font-size:21px;padding-inline:2px}.hero-head .wk-d{padding-inline:2px;font-size:13px}.hero-head .cd{padding:6px 10px;gap:7px}.hero-head .cd-n{font-size:24px}.hero-head .cd-t b{font-size:10.5px;max-width:52px}.hero-head .cd-t span{display:none}}
.gl{margin-top:8px}.gl-b{position:relative;display:flex;height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}.gl-b i{display:block;height:100%}.gl-b u{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.gl-t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2);margin-top:4px}.gl-t b{color:var(--fg)}.gl .gs{font-weight:700;color:var(--amber)}.gl.ok .gs{color:var(--good)}.gl-n{font-size:12.5px;font-weight:700;color:var(--fg);margin-bottom:5px}
.gl-f .gl-b{height:12px;margin-top:10px}.gl-f.ok{background:var(--good-t)}.gl-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.gl-s div{text-align:center}.gl-s b{display:block;font:900 20px/1.1 var(--display);text-transform:none;letter-spacing:0;color:var(--fg);margin:0}.gl-s span{font-size:11px;color:var(--fg2)}.gl-n2{font-weight:500;font-size:13px;color:var(--fg2);margin:10px 0 0;line-height:1.45}
.qpal+.gl,.ak-bar+.fzr+.gl{margin:6px 0 8px}

.bbnav{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:12px 62px 12px 0;margin:14px 0 0;background:linear-gradient(var(--bg) 82%,transparent);scrollbar-width:none;scroll-snap-type:x proximity}.bbnav::-webkit-scrollbar{display:none}
.bbt{flex:none;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;color:var(--fg2);scroll-snap-align:center;transition:background .15s,color .15s,border-color .15s}.bbt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.bbt em{font-style:normal;font-size:12px;min-width:22px;padding:2px 7px;border-radius:99px;background:var(--soft2);color:var(--fg2);text-align:center}
.bbt.on{background:var(--fg);border-color:var(--fg);color:#fff;box-shadow:0 6px 16px rgba(17,24,39,.22)}.bbt.on em{background:rgba(255,255,255,.22);color:#fff}
.bbhd{margin:18px 0 14px}.bbhd h3{margin:0;font-size:24px;letter-spacing:-.01em}.bbhd p{margin:3px 0 0;font-size:14px;color:var(--fg2)}
.bbfil{margin-top:4px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 8px}.bbcnt{font-size:15px;color:var(--fg2)}.bbcnt b{font:900 22px/1 var(--display);color:var(--fg)}
.bbtools{display:flex;align-items:center;gap:8px}.bbseg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}.bbseg button{padding:7px 14px;font-weight:700;font-size:13px;color:var(--fg2)}.bbseg button[aria-pressed="true"]{background:var(--fg);color:#fff}
.bbar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);font-size:22px;line-height:1;display:grid;place-items:center;color:var(--fg)}
.bbprog{height:5px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-bottom:12px}.bbprog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .2s}
.bbcar{position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;margin:0 -2px;scrollbar-width:none;overscroll-behavior-x:contain;outline:none}.bbcar::-webkit-scrollbar{display:none}.bbcar .bbcard{flex:0 0 88%;scroll-snap-align:center}
.bbstack{display:flex;flex-direction:column;gap:12px}
.bbcard{display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--line);border-top:6px solid var(--c);border-radius:22px;padding:16px 18px 14px;background:var(--bg);box-shadow:0 10px 28px rgba(17,24,39,.07)}
.bbcard header{display:flex;align-items:center;gap:10px}.bbno{font:900 26px/1 var(--display);color:var(--c)}.bbno small{font:700 13px var(--font);color:var(--fg3);margin-left:1px}.bbtg{display:flex;flex-direction:column;gap:3px;min-width:0}.bbas{font-size:13px;font-weight:700;color:var(--fg);line-height:1.3}
.bbmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bbst{font-size:12px;color:var(--fg3)}.rb.bbbad{background:var(--bad-t);color:var(--bad)}.rb.bbgood{background:var(--good-t);color:var(--good)}
.bbtxt{background:var(--soft);border-radius:16px;padding:14px 16px;flex:1}.bbtxt h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}.bbtxt p{margin:0;font-size:16.5px;line-height:1.6;font-weight:500;color:var(--fg);white-space:pre-wrap}
.bbnt{min-height:54px;font:14px/1.45 var(--font)}.bbcard footer{display:flex;flex-wrap:wrap;gap:8px}
.bbpills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.bbpills::-webkit-scrollbar{display:none}.bbpills .chip{flex:none}.bbpills .chip.bbon{background:var(--fg);border-color:var(--fg);color:#fff}
.bbfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.bbf{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg);box-shadow:0 4px 14px rgba(17,24,39,.05)}.bbf-th{display:block;width:100%;aspect-ratio:16/10;background:var(--soft);overflow:hidden}.bbf-th img{width:100%;height:100%;object-fit:cover;display:block}

.bbf-b{display:flex;flex-direction:column;gap:2px;padding:10px 12px 4px;min-width:0}.bbf-b b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bbf-b span{font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bbf-a{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 12px}.bbf-a .chip{padding:6px 12px;font-size:12.5px}

/* seções e listas */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
h3{margin:0;font-size:15px;font-weight:700}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dt{width:20px;height:20px;border-radius:7px;border:2px solid var(--c,var(--fg3));background:transparent;flex:none}

.list{margin:0;padding:0;list-style:none}

.row.done .chk{background:var(--green);border-color:var(--green)} .row.done .chk svg{opacity:1}
.row.part .chk{border-color:var(--orange);background:linear-gradient(90deg,var(--orange) 50%,transparent 50%)}
.rt{min-width:0;flex:1}
.rt .t{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.done .rt .t{color:var(--fg3);font-weight:500}
.rt .s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);margin-top:3px}
.rt .ls{margin-top:5px;font-size:12.5px;color:var(--fg2);display:flex;gap:7px;align-items:baseline;min-width:0}

.rt .ls span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--fg3))} .tag.ring i{background:transparent;border:2px solid var(--c,var(--fg3))}
.rb{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--blue-t);color:var(--blue);font-size:11.5px;font-weight:700}
.rb.mv{background:var(--warn-t);color:#92400e}

/* cards de gráficos */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* matérias */
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}

.mat-b{border-top:1px solid var(--line)}

.pr{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:13px 12px;border-radius:14px;cursor:pointer;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.pr:hover{background:var(--soft)} .pr.cur{background:var(--blue-t)}
.pr .w{font-weight:700;font-size:16px}.pr .d{font-size:13px;color:var(--fg2)}.pr .d small{display:block;color:var(--fg3);font-size:11.5px}

/* importação */

const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const STOP=new Set("de da do das dos com para por uma que the and em no na nos nas ao aos ou um sao ser como mais sobre entre".split(" "));
const toks=s=>norm(s).split(" ").filter(w=>w.length>2&&!STOP.has(w));
const ALIAS={REG:["processo legislativo","regimento","regimentos","regimento interno","regimento comum"],LIN:["linguistica"],POR:["portugues","lingua portuguesa"],ADM:["administrativo","administracao publica","direito administrativo"],CON:["constitucional","direito constitucional"],CP:["ciencia politica"],TI:["tecnologia da informacao","informatica","ti e dados","ti"],ASR:["reconhecimento de fala","transcricao","inteligencia artificial","asr","fala e ia"],ING:["ingles","lingua inglesa"]};
function subjectMatch(name){
  const n=norm(name);if(!n)return "";
  let best="",bl=0;
  for(const k of SUBJ){for(const a of ALIAS[k]){const hit=a.length<=3?n===a:(n.includes(a)||a.includes(n)&&n.length>3);if(hit&&a.length>bl){best=k;bl=a.length}}}
  if(best)return best;
  const t=new Set(toks(name));let sc=0;
  for(const k of SUBJ){const o=toks(MAT[k].n+" "+SHORT[k]).filter(w=>t.has(w)).length;if(o>sc){sc=o;best=k}}
  return best;
}
const candidates=k=>ALL.filter(m=>m.k===k&&(m.t==="teoria_questoes"||m.t==="ingles"));
function metaRank(k,text){
  const q=toks(text),nq=norm(text);
  return candidates(k).map(m=>{
    const hay=new Set(toks(m.a+" "+(m.tp||[]).join(" ")));
    const ov=q.length?q.filter(w=>hay.has(w)).length/q.length:0;
    const sub=nq&&norm(m.a).includes(nq)?1:0;
    return {m,score:Math.max(ov,sub)};
  }).sort((a,b)=>b.score-a.score||a.m.wi-b.m.wi);
}

function parseSheet(aoa,name){

    }

/* arquivos (gabaritos e imagens): guardados em pedaços no banco, sem plano pago */
const FCH=700000;
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(new Error("Não consegui ler o arquivo."));r.readAsDataURL(b)});
const b64Blob=(parts,mime)=>new Blob(parts.map(p=>{const bin=atob(p),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}),{type:mime});
function imgCompress(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{
      const mk=mx=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c};
      const big=mk(1800),th=mk(180);
      big.toBlob(b=>{URL.revokeObjectURL(u);if(!b)return rej(new Error("Não consegui ler a imagem."));res({blob:b,th:th.toDataURL("image/jpeg",.6).split(",")[1]})},"image/jpeg",.82);
    }catch(e){rej(e)}};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Não consegui ler a imagem. Envie em JPG, PNG ou PDF."))};
    im.src=u;
  });
}
async function fileSave(file,scope){
  let blob=file,mime=file.type||"application/octet-stream",th="";
  if(/^image\//.test(mime)){const r=await imgCompress(file);blob=r.blob;th=r.th;mime="image/jpeg"}
  if(blob.size>10*1024*1024)throw new Error("O arquivo passa de 10 MB. Reduza ou divida e envie de novo.");
  const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const meta={nome:file.name||"arquivo",tipo:mime,tam:blob.size,esc:scope,th,cr:ymd(new Date())};
  if(fb.on&&fb.fcol){
    const b64=await blobB64(blob),n=Math.max(1,Math.ceil(b64.length/FCH));meta.n=n;
    try{
      for(let i=0;i<n;i+=3)await Promise.all(Array.from({length:Math.min(3,n-i)},(_,j)=>fb.pcol.doc(id+"_"+(i+j)).set({d:b64.slice((i+j)*FCH,(i+j+1)*FCH)})));
      await fb.fcol.doc(id).set(meta);
    }catch(e){for(let i=0;i<n;i++)fb.pcol.doc(id+"_"+i).delete().catch(()=>{});throw new Error("Não consegui enviar o arquivo. Tente de novo.")}
  }else{LOCALF[id]=blob;meta.n=0}
  FILES[id]=meta;return id;
}
async function fileBlob(id){
  const m=FILES[id];if(!m)throw new Error("Arquivo não encontrado.");
  if(!(fb.on&&fb.pcol)){if(LOCALF[id])return LOCALF[id];throw new Error("Arquivo não disponível neste aparelho.")}
  const parts=[];for(let i=0;i<m.n;i++){const d=await fb.pcol.doc(id+"_"+i).get();if(!d.exists)throw new Error("Faltam partes do arquivo.");parts.push(d.data().d)}
  return b64Blob(parts,m.tipo);
}
function fileDel(id){
  const m=FILES[id];delete FILES[id];delete LOCALF[id];
  if(fb.on&&fb.fcol){for(let i=0;i<((m&&m.n)||0);i++)fb.pcol.doc(id+"_"+i).delete().catch(()=>{});fb.fcol.doc(id).delete().catch(()=>{})}
}
const fmtB=n=>n>1048576?(n/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(n/1024))+" KB";
async function fileOpen(id){

const fileList=(ids,kind,idx)=>(ids&&ids.length)?`<div class="files">${ids.map(f=>{const m=FILES[f];return `<div class="frow">${m&&m.th?`<img class="th" alt="" src="data:image/jpeg;base64,${m.th}">`:`<span class="th doc">PDF</span>`}<div class="fn"><b>${esc(m?m.nome:"arquivo")}</b><span>${m?fmtB(m.tam):""}</span></div><button class="chip" data-act="sm-fopen" data-f="${f}">Abrir</button><button class="chip" data-act="sm-fdel" data-f="${f}" data-k="${kind}" data-i="${idx==null?"":idx}">Excluir</button></div>`}).join("")}</div>`:"";

/* leitura da análise por assunto (texto colado ou planilha) */
function parseAnaliseText(t){
  const rows=[],errs=[];
  String(t).split(/\r?\n/).forEach((raw,i)=>{
    const ln=raw.trim();if(!ln||/^```/.test(ln)||ln.charAt(0)==="#")return;
    const p=ln.split("|").map(z=>z.trim());
    if(p.length<5){errs.push(`Linha ${i+1}: faltam campos. Use Matéria | Assunto | Certos | Errados | Brancos | Motivo.`);return}
    const c=toN(p[2]),e=toN(p[3]),b=toN(p[4]);
    if(!(c+e+b)){errs.push(`Linha ${i+1}: nenhum item contado.`);return}
    rows.push({mat:p[0],ass:p[1],c,e,b,mot:normMot(p[5]||"")});
  });
  return {rows,errs};
}
const SMH={mat:["materia","disciplina"],ass:["assunto","topico","tema"],c:["certas","certos","acertos","acerto"],e:["erradas","errados","erros","erro"],b:["brancas","brancos","em branco","branco"],mot:["motivo","causa","tipo de erro"]};
function parseAnaliseSheet(aoa){
  let hi=-1,cm={};
  for(let r=0;r<Math.min(aoa.length,10)&&hi<0;r++){const m={};aoa[r].forEach((h,ci)=>{const n=norm(h);for(const k in SMH){if(m[k]==null&&SMH[k].includes(n))m[k]=ci}});if(m.mat!=null&&m.ass!=null&&(m.c!=null||m.e!=null)){hi=r;cm=m}}
  if(hi<0)return {rows:[],errs:["Não encontrei os cabeçalhos. A planilha precisa ter Matéria, Assunto, Certos, Errados e Brancos."]};
  const rows=[],errs=[];
  for(let r=hi+1;r<aoa.length;r++){const row=aoa[r],g=k=>cm[k]!=null?row[cm[k]]:"";const c=toN(g("c")),e=toN(g("e")),b=toN(g("b"));if(!(c+e+b))continue;rows.push({mat:String(g("mat")).trim(),ass:String(g("ass")).trim(),c,e,b,mot:normMot(String(g("mot")))})}
  return {rows,errs};
}
function smAnaPrepare(res,name){
  sm.ana.errs=res.errs.slice(0,10);sm.ana.name=name;sm.err="";sm.msg="";
  sm.ana.rows=res.rows.map(r=>{const k=subjectMatch(r.mat),rk=k?metaRank(k,r.ass):[];return {...r,k,mid:rk[0]&&rk[0].score>=.4?rk[0].m.id:""}});
  if(!sm.ana.rows.length&&!sm.ana.errs.length)sm.err="Não encontrei nenhuma linha de análise.";
}
function smAnaFile(file){
  const csv=/\.(csv|txt|tsv)$/i.test(file.name),rd=new FileReader();
  rd.onload=ev=>{
    try{
      if(/\.txt$/i.test(file.name))smAnaPrepare(parseAnaliseText(String(ev.target.result)),file.name);
      else{
        if(!window.XLSX)throw new Error("Não consegui carregar o leitor de planilhas. Recarregue a página.");
        const wb=csv?XLSX.read(String(ev.target.result).replace(/^﻿/,""),{type:"string"}):XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        smAnaPrepare(parseAnaliseSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})),file.name);
      }
    }catch(er){sm.ana.rows=[];sm.err=er.message||"Não consegui ler o arquivo."}
    render();
  };
  if(csv||/\.txt$/i.test(file.name))rd.readAsText(file,"UTF-8");else rd.readAsArrayBuffer(file);
}

const sb={om:"az",oa:"menor",open:{},busca:""};
const strip=t=>String(t||"").replace(/\(.*?\)/g,"");
const sbKey=(k,mid,t)=>k+"|"+(mid||"t:"+norm(strip(t)));
function subTree(){
  const T={};
  const node=(k,mid,t)=>{const m=T[k]||(T[k]={k,as:{}});const key=sbKey(k,mid,t);return m.as[key]||(m.as[key]={key,mid,nome:mid&&BY[mid]?BY[mid].a:"",c:0,e:0,b:0,subs:{}})};
  for(const id in P()){
    if(id.slice(0,4)!=="imp-")continue;
    const d=P()[id];
    (d.rows||[]).forEach(r=>{if(!r.k||!SUBJ.includes(r.k))return;const a=node(r.k,r.mid,r.ass);if(!a.nome&&r.ass)a.nome=r.ass;a.c+=r.c||0;a.e+=r.e||0;a.b+=r.b||0});
    (d.subs||[]).forEach(s=>{if(!s.k||!SUBJ.includes(s.k))return;const a=node(s.k,s.mid,s.p);if(!a.nome)a.nome=strip(s.p).trim()||s.p;const sk=norm(s.s),x=a.subs[sk]||(a.subs[sk]={nome:s.s,v:[]});x.v.push({dt:s.dt||d.dt||"",pc:s.pc})});
  }
  const bk={};
  qbList().forEach(q=>{if(!q.sb||!SUBJ.includes(q.k)||(q.ok+q.er)<1)return;const key=q.k+"|"+(q.mid||norm(strip(q.as)))+"|"+norm(q.sb);const x=bk[key]||(bk[key]={q,ok:0,er:0,lt:""});x.ok+=q.ok;x.er+=q.er;if((q.lt||"")>x.lt)x.lt=q.lt||""});
  Object.values(bk).forEach(x=>{const q=x.q,a=node(q.k,q.mid,q.as);if(!a.nome)a.nome=strip(q.as).trim()||SHORT[q.k];const sk=norm(q.sb),y=a.subs[sk]||(a.subs[sk]={nome:q.sb,v:[]});y.v.push({dt:x.lt,pc:x.ok/(x.ok+x.er),ct:{ok:x.ok,er:x.er}})});
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const out=[];
  for(const k in T){
    const as=Object.values(T[k].as).filter(a=>Object.keys(a.subs).length).map(a=>{
      const subs=Object.values(a.subs).map(x=>{x.v.sort((p,q)=>p.dt<q.dt?-1:p.dt>q.dt?1:0);const last=x.v[x.v.length-1],prev=x.v.length>1?x.v[x.v.length-2]:null;return {nome:x.nome,pc:last.pc,dt:last.dt,n:x.v.length,avg:mean(x.v.map(z=>z.pc)),delta:prev?last.pc-prev.pc:null,ct:last.ct}});
      const n=a.c+a.e+a.b,pc=n?a.c/n:mean(subs.map(z=>z.pc));
      return {...a,subs,n,pc,hasN:!!n,nsub:subs.length};
    });
    if(!as.length)continue;
    const cnt=as.filter(a=>a.hasN),tn=cnt.reduce((z,a)=>({c:z.c+a.c,e:z.e+a.e,b:z.b+a.b}),{c:0,e:0,b:0});
    out.push({k,as,n:tot_(tn),pc:cnt.length?rate(tn):mean(as.map(a=>a.pc)),nsub:as.reduce((z,a)=>z+a.nsub,0)});
  }
  return out;
}

const fzI=()=>{const v=parseInt(LS.get("painel-fz"),10);return isFinite(v)&&v>=0&&v<FZS.length?v:1};
const fzTools=()=>`<span class="fzb"><button class="chip" data-act="fz" data-d="-1" aria-label="Diminuir a letra">A−</button><button class="chip" data-act="fz" data-d="1" aria-label="Aumentar a letra">A+</button></span>`;
function fzStep(d){const i=Math.max(0,Math.min(FZS.length-1,fzI()+d));LS.set("painel-fz",String(i));document.querySelectorAll(".ak-card").forEach(e=>{e.style.zoom=FZS[i]})}

const dfTag=df=>df?`<span class="rb df-${df}">${DFN[df]}</span>`:"";
const qbTag=k=>SUBJ.includes(k)?`<span class="tag" style="--c:var(--m-${k})"><i></i>${SHORT[k]}</span>`:"";
function qbOpts(q,st,id){
  const d=qd(id);
  return q.o.map((tx,i)=>{const L=LTR[i],isG=q.g===L,isR=st&&st.resp===L;
    const cls=["qopt",st?(isG?"ok":isR?"bad":""):(d.sel===L?"sel":""),!st&&d.strike[i]?"strk":""].join(" ");
    return `<div class="qrow"><button class="${cls}" ${st?"disabled":`data-act="qb-sel" data-v="${L}"`}><span class="lt">${L}</span><span class="tx">${esc(tx)}</span></button>${st?"":`<button class="qx" data-act="qb-strike" data-i="${i}" aria-label="${d.strike[i]?"Desfazer o risco":"Riscar"} da alternativa ${L}">${d.strike[i]?"↺":"✕"}</button>`}</div>`}).join("");
}
function qbSession(){
  const id=qb.queue[qb.i],q=QS[id];
  if(!q){qb.view="home";return qbHome()}
  const tot=qb.queue.length,a=qb.sans[id],S=qbSum(),answered=tot-S.pend,d=qd(id);
  const gTxt=q.t==="CE"?(q.g==="C"?"Certo":"Errado"):q.g;
  const head=`<div class="ak-top"><button class="chip" data-act="qb-quit">Sair</button><span>${qb.i+1} de ${tot} · ${answered} ${answered===1?"respondida":"respondidas"}</span><button class="chip" data-act="qb-fin">Finalizar</button></div><div class="ak-bar"><i style="width:${answered/tot*100}%"></i></div>
  <div class="fzr"><span class="clk" title="Tempo líquido nesta sessão">⏱ <b id="qb-clk">${fmtClock(qt.sess)}</b></span>${fzTools()}</div>
  ${goalHtml(BY[q.mid],"bank")}
  <div class="qpal" role="group" aria-label="Ir para a questão">${qb.queue.map((x,i)=>{const r=qb.sans[x];return `<button class="qpd ${r?r.res:""} ${i===qb.i?"cur":""}" data-act="qb-go" data-i="${i}" aria-label="Questão ${i+1}${r?(r.res==="ok"?", certa":r.res==="er"?", errada":", em branco"):", sem resposta"}" ${i===qb.i?'aria-current="true"':""}>${i+1}</button>`}).join("")}</div>`;
  const conf=qb.confirm?`<div class="msg" style="background:var(--warn-t);margin-bottom:12px"><b>Faltam ${S.pend} ${S.pend===1?"questão sem resposta":"questões sem resposta"}.</b><br>Elas não serão contadas e continuam como não resolvidas no banco.<div class="bar-act" style="margin-top:10px"><button class="btn" style="padding:10px 18px" data-act="qb-fincont">Voltar para responder</button><button class="btn alt" style="padding:10px 18px" data-act="qb-finok">Finalizar assim mesmo</button></div></div>`:"";
  const metaL=`<div class="ak-meta">${qbTag(q.k)}<span class="rb">${q.t==="CE"?"Certo ou Errado":"Múltipla escolha"}</span>${dfTag(q.df)}${q.cad?`<span class="rb" style="background:var(--soft);color:var(--fg2)">${esc(q.cad)}</span>`:""}</div>`;
  let ans="";
  if(!a){
    ans=q.t==="CE"?`<div class="ak-btns two"><button class="gbtn g3" data-act="qb-ans" data-v="C">Certo</button><button class="gbtn g1" data-act="qb-ans" data-v="E">Errado</button></div>`
      :`<div style="margin-top:6px">${qbOpts(q,null,id)}</div><div class="bar-act"><button class="btn" data-act="qb-ans" data-v="${d.sel}" ${d.sel?"":"disabled"}>Confirmar resposta</button></div>`;
    ans+=`<div style="margin-top:12px;text-align:center"><button class="link" data-act="qb-blank">Marcar esta questão como em branco</button></div>`;
  }else{
    const ok=a.res==="ok";
    ans=`<div class="qres ${a.res}">${ok?"Você acertou":a.res==="bl"?"Em branco":"Você errou"}<small>Gabarito: ${gTxt}${!ok&&a.resp?` · sua resposta: ${q.t==="CE"?(a.resp==="C"?"Certo":"Errado"):a.resp}`:""}</small></div>
    ${q.t==="ME"?`<div style="margin-top:8px">${qbOpts(q,a,id)}</div>`:""}
    <div class="box" style="margin-top:14px"><b>Gabarito comentado</b><p style="font-weight:500">${q.c?esc(q.c):"Esta questão não veio com comentário."}</p></div>
    <label class="lbl" for="qb-nt" style="margin-top:14px">Meu comentário</label>
    <textarea class="in" id="qb-nt" style="min-height:80px;font-family:var(--font)" placeholder="Anote o que errou, uma pegadinha, uma dúvida">${esc(q.nt||"")}</textarea>
    <div class="bar-act"><button class="chip" data-act="qb-fav" data-id="${id}" aria-pressed="${!!q.fav}">${q.fav?"★ Bizu (favorita)":"☆ Favoritar como bizu"}</button></div>`;
  }
  const last=qb.i+1>=tot;
  const nav=`<div class="qnav"><button class="btn alt" data-act="qb-prev" ${qb.i?"":"disabled"}>‹ Anterior</button><button class="btn ${a?"":"alt"}" data-act="qb-next">${last?"Finalizar":"Próxima ›"}</button></div>`;
  return `<section class="sec" style="margin-top:20px">${head}${conf}<div class="ak-card" style="align-items:stretch;zoom:${FZS[fzI()]}">${metaL}${q.as||q.sb?`<div class="muted" style="font-size:13px">${esc([q.as,q.sb].filter(Boolean).join(" · "))}</div>`:""}<div class="ak-q" style="font-weight:600">${esc(q.e)}</div>${ans}</div>${nav}</section>`;
}
function qbRepGroups(list){
  const g={};
  list.forEach(q=>{const nm=q.sb||"Sem subtópico",x=g[nm]||(g[nm]={nome:nm,sb:q.sb||"__none",ok:0,er:0,bl:0,n:0,feitas:0,k:q.k,mid:q.mid||""});x.n++;x.ok+=q.ok;x.er+=q.er;x.bl+=q.bl;if(q.ok+q.er+q.bl>0)x.feitas++});
  return Object.values(g).map(x=>({...x,r:(x.ok+x.er)?x.ok/(x.ok+x.er):null}));
}
function qbReport(list,titulo,ro){
  const G=qbRepGroups(list),tot=list.length,feitas=list.filter(q=>q.ok+q.er+q.bl>0).length;
  const ok=list.reduce((z,q)=>z+q.ok,0),er=list.reduce((z,q)=>z+q.er,0),comp=feitas===tot&&tot>0;
  const lv=r=>r>=.75?"bem":r>=.6?"reg":"mal";
  const bem=G.filter(x=>x.r!=null&&lv(x.r)==="bem").sort((a,b)=>b.r-a.r),reg=G.filter(x=>x.r!=null&&lv(x.r)==="reg").sort((a,b)=>a.r-b.r),mal=G.filter(x=>x.r!=null&&lv(x.r)==="mal").sort((a,b)=>a.r-b.r),nd=G.filter(x=>x.r==null);
  const li=x=>`<li class="sbs" style="padding-left:0"><span class="sbn">${esc(x.nome)}</span>${sbBar(x.r)}${sbPc(x.r)}<small>${x.ok} certas · ${x.er} erradas · ${x.feitas} de ${x.n} ${x.n===1?"questão resolvida":"questões resolvidas"}${ro?"":` · <button class="link" data-act="qb-sub" data-k="${x.k}" data-mid="${esc(x.mid)}" data-sb="${esc(x.sb)}" data-m="${x.er?"erradas":x.feitas<x.n?"novas":"todas"}">${x.er?"Refazer as erradas":x.feitas<x.n?"Resolver as que faltam":"Treinar de novo"}</button>`}</small></li>`;
  const sec=(t,sub,arr,cls)=>arr.length?`<div class="rps ${cls}"><h4>${t}</h4><p class="muted">${sub}</p><ul class="sbl" style="padding:0;border:0">${arr.map(li).join("")}</ul></div>`:"";
  const pior=mal[0]||reg[0];
  return `<div class="box rep"><b>${esc(titulo)}</b>
    <p class="rph">${feitas} de ${tot} ${tot===1?"questão resolvida":"questões resolvidas"} · acerto ${ok+er?pc(ok/(ok+er)):"–"} <span class="pill ${comp?"green":"warn"}">${comp?"Concluído":"Em andamento"}</span></p>
    ${pior?`<p class="muted" style="font-size:13.5px;margin:4px 0 0">Prioridade para estudar: <b style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--fg);display:inline;margin:0">${esc(pior.nome)}</b> (${pc(pior.r)}).</p>`:""}
    ${sec("Onde você está mal","Abaixo de 60% de acerto",mal,"mal")}${sec("O que melhorar","De 60% a 74%",reg,"reg")}${sec("Onde você está bem","75% ou mais",bem,"bem")}${sec("Ainda sem resposta","Nenhuma questão resolvida neste subtópico",nd,"nd")}
    ${G.length===1&&G[0].sb==="__none"?`<p class="muted" style="font-size:12.5px;margin:10px 0 0">Estas questões não têm subtópico. Peça ao Claude para classificar as próximas e o relatório separa o que está bem do que está mal.</p>`:""}</div>`;
}
function qbDone(){
  const s=qbSum(),n=s.ok+s.er+s.bl;
  return `<section class="sec" style="margin-top:20px"><div class="ak-card" style="align-items:flex-start"><div class="eyebrow">Sessão concluída</div><div class="ak-q">${s.ok} ${s.ok===1?"acerto":"acertos"} em ${n} ${n===1?"questão respondida":"questões respondidas"}</div>
    <div class="kpis" style="width:100%;margin:6px 0 0"><div class="kpi green"><div class="lab">Acerto</div><div class="num">${n?Math.round(s.ok/n*100):0}%</div><div class="sub">${s.ok} certas</div></div><div class="kpi red"><div class="lab">Erros</div><div class="num">${s.er}</div><div class="sub">${s.bl} em branco</div></div><div class="kpi blue"><div class="lab">Nota líquida</div><div class="num">${s.ok-s.er}</div><div class="sub">certos menos errados</div></div><div class="kpi teal"><div class="lab">Tempo líquido</div><div class="num">${fmtH(qt.sess)}</div><div class="sub">${n?Math.round(qt.sess/n)+" s por questão":"sem respostas"}</div></div></div>
    ${s.pend?`<p class="muted" style="font-size:13.5px;margin:6px 0 0">${s.pend} ${s.pend===1?"questão ficou sem resposta":"questões ficaram sem resposta"}. Elas não foram contadas e continuam como não resolvidas.</p>`:""}
    <div class="bar-act">${s.pend?`<button class="btn" data-act="qb-back">Voltar e responder as ${s.pend}</button>`:""}${s.errs.length?`<button class="btn ${s.pend?"alt":""}" data-act="qb-redo">Refazer as ${s.errs.length} erradas</button>`:""}<button class="btn alt" data-act="qb-quit">Voltar ao banco</button></div>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Tudo o que você respondeu já foi somado às suas estatísticas de matéria, assunto, meta e semana.</p></div>${(()=>{const qs=qb.queue.map(id=>({id,...QS[id]})).filter(q=>q.e),mids=[...new Set(qs.map(q=>q.mid))],meta=mids.length===1&&mids[0]&&BY[mids[0]]?BY[mids[0]]:null;
      if(meta){const all=qbList().filter(q=>q.mid===meta.id);return `<div style="margin-top:14px">${goalHtml(meta,"full")}${qbReport(all,"Relatório da meta: "+meta.a)}<div class="bar-act"><button class="btn alt" data-act="open" data-id="${meta.id}">Abrir a meta</button></div></div>`}
      return `<div style="margin-top:14px">${qbReport(qs,"Relatório da sessão por subtópico")}</div>`})()}</section>`;
}
function qbFilters(withStatus,key){key=key||"st";
  const all=qbList(),mats=SUBJ.filter(k=>all.some(q=>q.k===k));
  const mids=[...new Map(all.filter(q=>(!qb.mat||q.k===qb.mat)&&q.mid&&BY[q.mid]).map(q=>[q.mid,BY[q.mid].a])).entries()];
  const cads=[...new Set(all.filter(q=>(!qb.mat||q.k===qb.mat)&&(!qb.mid||q.mid===qb.mid)).map(q=>q.cad).filter(Boolean))].sort();
  const sbs=[...new Set(all.filter(q=>(!qb.mat||q.k===qb.mat)&&(!qb.mid||q.mid===qb.mid)).map(q=>q.sb).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));
  const o=(v,c,l)=>`<option value="${esc(v)}" ${v===c?"selected":""}>${esc(l)}</option>`;
  return `<div class="qfil"><div><label class="lbl" for="qf-mat">Matéria</label><select id="qf-mat" data-qbf="mat">${o("",qb.mat,"Todas")}${mats.map(k=>o(k,qb.mat,SHORT[k])).join("")}</select></div>
    <div><label class="lbl" for="qf-mid">Assunto</label><select id="qf-mid" data-qbf="mid">${o("",qb.mid,"Todos")}${mids.map(([id,a])=>o(id,qb.mid,a.length>60?a.slice(0,58)+"…":a)).join("")}</select></div>
    <div><label class="lbl" for="qf-sb">Subtópico</label><select id="qf-sb" data-qbf="sb">${o("",qb.sb,"Todos")}${sbs.map(c=>o(c,qb.sb,c.length>50?c.slice(0,48)+"…":c)).join("")}${all.some(q=>!q.sb)?o("__none",qb.sb,"Sem subtópico"):""}</select></div>
    <div><label class="lbl" for="qf-cad">Caderno</label><select id="qf-cad" data-qbf="cad">${o("",qb.cad,"Todos")}${cads.map(c=>o(c,qb.cad,c)).join("")}</select></div>
    <div><label class="lbl" for="qf-df">Dificuldade</label><select id="qf-df" data-qbf="df">${o("",qb.df,"Todas")}${o("facil",qb.df,"Fácil")}${o("medio",qb.df,"Média")}${o("dificil",qb.df,"Difícil")}</select></div>
    <div><label class="lbl" for="qf-tipo">Tipo</label><select id="qf-tipo" data-qbf="tipo">${o("",qb.tipo,"Todos")}${o("CE",qb.tipo,"Certo ou Errado")}${o("ME",qb.tipo,"Múltipla escolha")}</select></div>
    ${withStatus?`<div><label class="lbl" for="qf-${key}">Situação</label><select id="qf-${key}" data-qbf="${key}">${QST.map(([v,l])=>o(v,qb[key],l)).join("")}</select></div>`:""}</div>`;
}
function qbHome(){
  const all=qbList(),n=all.length;
  if(!n)return `<section class="sec" style="margin-top:20px"><h2>Banco de questões</h2><p class="lead">Aqui você resolve questões inéditas, com gabarito comentado, de Certo ou Errado e de múltipla escolha. Peça as questões ao Claude e adicione. Tudo o que você resolver entra sozinho nas estatísticas.</p><div class="bar-act"><button class="btn" data-act="qb-view" data-v="add">Adicionar questões</button></div></section>`;
  const feitas=all.reduce((z,q)=>z+q.ok+q.er+q.bl,0),ok=all.reduce((z,q)=>z+q.ok,0),er=all.reduce((z,q)=>z+q.er,0);
  const fav=all.filter(q=>q.fav).length,wrong=all.filter(q=>q.last==="er").length,novas=all.filter(q=>!(q.ok+q.er+q.bl)).length;
  const cnt=qbFilter(true,"st").length;
  const byK={};all.forEach(q=>{const x=byK[q.k]||(byK[q.k]={ok:0,er:0,n:0});x.ok+=q.ok;x.er+=q.er;x.n++});
  const kRows=SUBJ.filter(k=>byK[k]&&byK[k].ok+byK[k].er>0).map(k=>{const x=byK[k],r=x.ok/(x.ok+x.er);return {l:SHORT[k],c:`var(--m-${k})`,f:r,v:pc(r),s:x.ok+x.er+" respostas",tip:`${SHORT[k]}: ${x.ok} certas e ${x.er} erradas no banco`,r}}).sort((a,b)=>a.r-b.r);
  const byD={};all.forEach(q=>{if(!q.df||q.ok+q.er<1)return;const x=byD[q.df]||(byD[q.df]={ok:0,er:0});x.ok+=q.ok;x.er+=q.er});
  const dRows=['facil','medio','dificil'].filter(k=>byD[k]).map(k=>{const x=byD[k],r=x.ok/(x.ok+x.er);return {l:DFN[k],c:k==='facil'?'var(--green)':k==='medio'?'#e0a800':'var(--red)',f:r,v:pc(r),s:x.ok+x.er+' respostas',tip:`${DFN[k]}: ${x.ok} certas e ${x.er} erradas`}});
  const byA={};all.forEach(q=>{if(q.ok+q.er<1)return;const key=q.k+"|"+(q.mid||norm(q.as));const x=byA[key]||(byA[key]={nome:q.mid&&BY[q.mid]?BY[q.mid].a:(q.as||SHORT[q.k]),k:q.k,ok:0,er:0});x.ok+=q.ok;x.er+=q.er});
  const weak=Object.values(byA).filter(x=>x.ok+x.er>=3).map(x=>({...x,r:x.ok/(x.ok+x.er)})).sort((a,b)=>a.r-b.r).slice(0,6);
  return `<section class="sec" style="margin-top:20px"><h2>Banco de questões</h2>
    <p class="lead">Resolva questões inéditas com gabarito comentado. Cada resposta soma sozinha nas estatísticas de matéria, assunto, meta e semana.</p>
    ${qb.msg?`<div class="msg">${esc(qb.msg)}</div>`:""}${qb.err?`<div class="msg err">${esc(qb.err)}</div>`:""}
    <div class="kpis" style="margin-top:16px">
      <div class="kpi blue"><div class="lab">No banco</div><div class="num">${n}</div><div class="sub">${novas} ainda não resolvidas</div></div>
      <div class="kpi green"><div class="lab">Acerto no banco</div><div class="num">${ok+er?pc(ok/(ok+er)):"–"}</div><div class="sub">${feitas} ${feitas===1?"resposta":"respostas"}</div></div>
      <div class="kpi orange"><div class="lab">Para revisar</div><div class="num">${wrong}</div><div class="sub">erradas na última vez</div></div>
      <div class="kpi purple"><div class="lab">Favoritas</div><div class="num">${fav}</div><div class="sub">marcadas com estrela</div></div>
    </div></section>
  <section class="sec"><div class="sec-h"><h2>Montar uma sessão</h2></div>
    ${qbFilters(true,"st")}
    <div class="qfil" style="margin-top:10px"><div><label class="lbl" for="qf-n">Quantas questões</label><select id="qf-n" data-qbf="n">${["10","20","30","50","todas"].map(v=>`<option value="${v}" ${qb.n===v?"selected":""}>${v==="todas"?"Todas do filtro":v}</option>`).join("")}</select></div>
      <div><label class="lbl" for="qf-ord">Ordem</label><select id="qf-ord" data-qbf="ord"><option value="aleatoria" ${qb.ord==="aleatoria"?"selected":""}>Aleatória</option><option value="cadastro" ${qb.ord==="cadastro"?"selected":""}>Ordem em que foram adicionadas</option><option value="dificuldade" ${qb.ord==="dificuldade"?"selected":""}>Da mais fácil para a mais difícil</option></select></div></div>
    <p class="muted" style="font-size:13px;margin:10px 2px 0">Por padrão aparecem só as questões que você ainda não resolveu. Troque a situação para refazer as que errou, as que acertou ou as favoritas.</p>
    <div class="bar-act"><button class="btn" data-act="qb-start" ${cnt?"":"disabled"}>Começar${cnt?` (${Math.min(cnt,qb.n==="todas"?cnt:+qb.n)} de ${cnt})`:""}</button><button class="btn alt" data-act="qb-view" data-v="lista">Ver todas as questões</button></div></section>
  ${kRows.length||weak.length||dRows.length?`<section class="sec"><div class="grid2">${dRows.length?`<div class="card"><div class="card-h"><div><h3>Acerto por dificuldade</h3><p>Só as questões do banco</p></div></div>${barsHtml(dRows)}</div>`:""}${kRows.length?`<div class="card"><div class="card-h"><div><h3>Acerto por matéria</h3><p>Só as questões do banco</p></div></div>${barsHtml(kRows)}</div>`:""}
    ${weak.length?`<div class="card"><div class="card-h"><div><h3>Assuntos mais fracos</h3><p>Menor acerto, com ao menos 3 respostas</p></div></div><ul class="list">${weak.map(x=>`<li class="row" style="cursor:default"><div class="rt"><div class="t">${esc(x.nome)}</div><div class="s">${qbTag(x.k)}<span>${x.ok} certas · ${x.er} erradas</span></div></div><div class="res"><span class="sc ${scCls(x.r)}">${pc(x.r)}</span></div></li>`).join("")}</ul></div>`:""}</div></section>`:""}`;
}
function qbAddBox(){
  const gs=qb.groups.length;

  const asOpts=g=>g.k?`<option value="">Sem assunto (conta só na matéria)</option>`+metaRank(g.k,g.ass).map(x=>`<option value="${x.m.id}" ${x.m.id===g.mid?"selected":""}>S${x.m.wi+1} · ${esc(x.m.a.length>60?x.m.a.slice(0,58)+"…":x.m.a)}</option>`).join(""):`<option value="">Escolha a matéria primeiro</option>`;

function qbClick(a,t,e){
  if(a==="qb-view"){qb.view=t.dataset.v;qb.msg="";qb.err="";render();window.scrollTo(0,0);return true}
  if(a==="qb-start"){qbStart();return true}
  if(a==="qb-add"){closeSheet();tab="questoes";menu=false;qb.view="add";render();window.scrollTo(0,0);return true}
  if(a==="bz-redo"){const sq=norm(bib.bq),ids=qbList().filter(q=>q.er>0&&(!bib.bk||q.k===bib.bk)&&(!bib.ba||bzKey(q)===bib.ba)&&(!bib.bs||(bib.bs==="ativo"?q.last==="er":q.last!=="er"))&&(!sq||norm((q.c||"")+" "+(q.nt||"")).includes(sq))).map(q=>q.id);if(ids.length){tab="questoes";menu=false;qb.mat=qb.mid=qb.sb="";qbStart(ids)}return true}
  if(a==="qb-one"){tab="questoes";menu=false;qbStart([t.dataset.id]);return true}
  if(a==="qb-sub"){
    qb.mat=t.dataset.k;qb.mid=t.dataset.mid||"";qb.cad="";qb.tipo="";qb.df="";qb.q="";qb.n="todas";qb.sb=t.dataset.sb;
    const lst=qbList().filter(q=>q.k===qb.mat&&(!qb.mid||q.mid===qb.mid)&&(qb.sb==="__none"?!q.sb:q.sb===qb.sb)),mode=t.dataset.m||"todas";
    qb.st=lst.some(q=>qbStat(q,mode))?mode:"todas";
    closeSheet();tab="questoes";menu=false;qbStart();return true}
  if(a==="qb-meta"){
    const m=BY[t.dataset.id];if(!m)return true;
    const cad=t.dataset.cad||"",mode=t.dataset.m||"novas",all=qbList().filter(q=>q.mid===m.id&&(!cad||q.cad===cad));
    qb.mat=m.k;qb.mid=m.id;qb.cad=cad;qb.sb="";qb.tipo="";qb.df="";qb.q="";qb.n="todas";qb.st=all.some(q=>qbStat(q,mode))?mode:"todas";
    qb.rvNext=t.dataset.rv||"";if(qb.rvNext)qb.ord="aleatoria";
    closeSheet();tab="questoes";menu=false;qbStart();return true}
  if(a==="qb-quit"){qb.view="home";qb.confirm=false;render();window.scrollTo(0,0);return true}
  if(a==="qb-sel"){const id=qb.queue[qb.i];if(id&&!qb.sans[id]){qd(id).sel=t.dataset.v;render()}return true}
  if(a==="qb-strike"){const id=qb.queue[qb.i],d=qd(id),i=t.dataset.i;d.strike[i]=!d.strike[i];if(d.strike[i]&&d.sel===LTR[+i])d.sel="";render();return true}
  if(a==="qb-ans"){qbAnswer(t.dataset.v);return true}
  if(a==="qb-blank"){qbAnswer("");return true}
  if(a==="qb-prev"){qbGo(qb.i-1);return true}
  if(a==="qb-next"){if(qb.i+1>=qb.queue.length)qbFinish();else qbGo(qb.i+1);return true}
  if(a==="qb-go"){qbGo(+t.dataset.i);return true}
  if(a==="qb-fin"){qbFinish();return true}
  if(a==="qb-finok"){qbFinish(true);return true}
  if(a==="qb-fincont"){qb.confirm=false;const i=qb.queue.findIndex(id=>!qb.sans[id]);if(i>=0)qbGo(i);else render();return true}
  if(a==="qb-back"){qb.view="session";const i=qb.queue.findIndex(id=>!qb.sans[id]);qb.i=i>=0?i:0;render();window.scrollTo(0,0);return true}
  if(a==="qb-redo"){const ids=qbSum().errs;qbStart(ids);return true}
  if(a==="qb-fav"){const q=QS[t.dataset.id];if(q)qbPatch(t.dataset.id,{fav:q.fav?0:1});render();return true}
  if(a==="qb-open"){qb.open[t.dataset.id]=!qb.open[t.dataset.id];render();return true}
  if(a==="qb-more"){qb.more+=50;render();return true}
  if(a==="qb-delask"){qb.ask=t.dataset.id;render();return true}
  if(a==="qb-delno"){qb.ask="";render();return true}
  if(a==="qb-delok"){qsWrite([[t.dataset.id,null]]);qb.ask="";qb.msg="Questão excluída.";render();return true}
  if(a==="qb-read"){const ta=$("#qb-paste");qb.paste=ta?ta.value:qb.paste;qbPrepare(parseQText(qb.paste),"texto colado");render();return true}
  if(a==="qb-import"){qbImport();return true}
  if(a==="qb-cancel"){qb.groups=[];qb.items=[];qb.errs=[];qb.err="";qb.paste="";render();return true}
  if(a==="qb-copy"){(async()=>{try{await navigator.clipboard.writeText(QBINSTR);qb.copied=true}catch(er){const ta=$("#qb-instr");if(ta){ta.focus();ta.select()}qb.copied=false}render()})();return true}
  return false;
}
function qbChange(e){
  const t=e.target;
  const bz=t.closest&&t.closest("[data-bzf]");
  if(bz){const k=bz.dataset.bzf;bib[k]=bz.value;bib.ci=0;if(k==="bk")bib.ba="";render();return true}
  const f=t.closest&&t.closest("[data-qbf]");
  if(f){const k=f.dataset.qbf;qb[k]=f.value;if(k==="mat"){qb.mid="";qb.cad="";qb.sb=""}if(k==="mid"){qb.cad="";qb.sb=""}qb.err="";qb.more=50;render();return true}
  const g=t.closest&&t.closest("[data-qbg]");
  if(g){const gr=qb.groups[+g.dataset.i];if(gr){if(g.dataset.qbg==="k"){gr.k=g.value;const rk=gr.k?metaRank(gr.k,gr.ass):[];gr.mid=rk[0]&&rk[0].score>=.4?rk[0].m.id:""}else gr.mid=g.value;render()}return true}
  if(t.id==="qb-file"&&t.files&&t.files[0]){qb.msg="";qbReadFile(t.files[0]);return true}
  if(t.id==="qb-nt"){const id=qb.queue[qb.i];if(id)qbPatch(id,{nt:t.value.trim()});return true}
  if(t.dataset&&t.dataset.qn){qbPatch(t.dataset.qn,{nt:t.value.trim()});return true}
  return false;
}

async function bibUpload(files){

function metaGroups(pred){
  const by={};
  for(const id in real){
    const m=BY[id],d=real[id];if(!m||!pred(d))continue;
    (by[m.k]||(by[m.k]=[])).push({m,d});
  }
  const ord=k=>SUBJ.includes(k)?SUBJ.indexOf(k):99;
  return Object.keys(by).sort((a,b)=>ord(a)-ord(b)).map(k=>({k,items:by[k].sort((a,b)=>a.m.wi-b.m.wi||a.m.o-b.m.o)}));
}

const bzKey=q=>q.mid||"t:"+norm(strip(q.as));
const bzNome=q=>q.mid&&BY[q.mid]?BY[q.mid].a:(strip(q.as).trim()||"Sem assunto");
function bbCard(q,mode,i,tot){

"3. Tipos: P = pergunta e resposta; L = lacuna, com a parte escondida entre {{ e }}; CE = afirmação para marcar Certo ou Errado como na prova (resposta C ou E, e a explicação no quarto campo). Campos: P | pergunta | resposta | fonte | subtópico ; L | texto com {{lacuna}} | (vazio) | fonte | subtópico ; CE | afirmação | C ou E | explicação | subtópico.",
"4. O campo fonte ou explicação traz o artigo, a lei ou a justificativa em uma frase curta. Pode ficar vazio, mas nunca invente.",
"5. Quantidade: no mínimo 80 cartões por meta, a não ser que eu peça outra quantidade. Cubra TODO o conteúdo da meta ou da aula, sem deixar nenhum tópico do assunto sem cartão.",
"6. Classificação por subtópico: todo cartão deve pertencer a um subtópico do assunto. Use a linha \"# Subtópico: nome\" antes de cada grupo (vale até a próxima) ou preencha o último campo da linha. Use de 4 a 10 subtópicos por assunto, com o nome como aparece no edital ou no material, e sempre os mesmos nomes dos pedidos de questões do mesmo assunto. É isso que me mostra exatamente em que ponto do assunto eu esqueço. Subtópicos mais cobrados em prova ganham mais cartões.",
"7. Ordem pedagógica: do básico ao complexo, com cada conceito antes do que depende dele (definição antes de exceção, regra antes de pegadinha). Agrupe por subtópico.",
"8. Mistura de tipos: cerca de 45% CE no estilo Cebraspe, 30% lacuna e 25% pergunta e resposta.",
"9. Cartões atômicos: um único fato por cartão, sem depender de outro cartão. Verso com no máximo 25 palavras. Não copie artigos inteiros: extraia a ideia que cai em prova.",
"10. Use lacuna (L) para prazos, quóruns, números, competências e listas. Em listas, faça um cartão por item, não um cartão com a lista toda.",
"11. Faça cartões de contraste para o que se confunde (por exemplo, quem decide x quem aprova, prazo de uma casa x prazo da outra), com a diferença clara na resposta.",
"12. Nos CE, imite as pegadinhas da banca: troca de órgão, prazo, quórum ou competência, e palavras como sempre, nunca, apenas e exclusivamente. Equilibre as respostas C e E.",
"13. Quando houver um jeito fácil de lembrar (mnemônico, associação), escreva na explicação, começando por \"Dica:\".",
"14. Baseie os cartões no conteúdo do edital e, se eu enviar um resumo ou texto, apenas nele. Não invente artigos de lei, números, autores nem citações. Se não tiver certeza de um dado, não faça o cartão sobre ele.",
"15. Sem cartões repetidos ou quase iguais. Entregue tudo em um arquivo .txt."
].join("\n");
const hstr=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)};
const cardId=(k,f)=>{const n=norm(f);return "c"+hstr(k+"|"+n)+hstr(n.split("").reverse().join(""))};
const T0=()=>ymd(today());
const AKNOV=()=>+(LS.get("painel-novos")||20)||20;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ivTxt=d=>d<=0?"hoje":d===1?"1 dia":d<30?d+" dias":d<365?Math.round(d/30)+" meses":"1 ano";

function cardsWrite(list){

}

/* leitura do baralho (texto colado ou planilha) */
function mkCard(mat,ass,bar,tipoRaw,f,v,x,ref,sb){
  const t0=String(tipoRaw||"").toUpperCase().replace(/[^A-Z]/g,"");
  const t=t0==="P"||t0==="PERGUNTA"?"P":t0==="L"||t0==="LACUNA"?"L":(t0==="CE"||t0==="C"||t0==="VF"||t0==="CERTOERRADO")?"CE":"";
  if(!t)return {err:`${ref}: tipo "${String(tipoRaw||"").slice(0,12)}" não reconhecido. Use P, L ou CE.`};
  f=String(f||"").trim();v=String(v||"").trim();x=String(x||"").trim();
  if(!f)return {err:`${ref}: falta o texto do cartão.`};
  if(t==="P"&&!v)return {err:`${ref}: falta a resposta.`};
  if(t==="L"&&!/\{\{[^}]+\}\}/.test(f))return {err:`${ref}: a lacuna precisa estar entre {{ e }}.`};
  if(t==="CE"){const a=norm(v).charAt(0);if(a==="c")v="C";else if(a==="e")v="E";else return {err:`${ref}: a resposta de Certo ou Errado deve ser C ou E.`}}
  return {card:{mat,ass,bar,t,f,v,x,sb:String(sb||"").trim()}};
}
function parseDeckText(text){
  const cards=[],errs=[];let mat="",ass="",bar="",sb="";
  String(text).split(/\r?\n/).forEach((raw,i)=>{
    const ln=raw.trim();if(!ln||/^```/.test(ln))return;
    const m=/^#\s*(mat[eé]ria|assunto|baralho|subt[oó]pico)\s*:\s*(.*)$/i.exec(ln);
    if(m){const k=norm(m[1]);if(k.indexOf("mat")===0)mat=m[2].trim();else if(k==="assunto")ass=m[2].trim();else if(k.indexOf("subt")===0)sb=m[2].trim();else bar=m[2].trim();return}
    if(ln.charAt(0)==="#")return;
    const p=ln.split("|").map(z=>z.trim());
    const r=mkCard(mat,ass,bar,p[0],p[1],p[2],p[3],"Linha "+(i+1),p[4]||sb);
    if(r.err)errs.push(r.err);else cards.push(r.card);
  });
  return {cards,errs};
}
const AKH={mat:["materia","disciplina"],ass:["assunto","topico","tema"],bar:["baralho","deck"],t:["tipo"],f:["frente","pergunta","front"],v:["verso","resposta","back"],x:["explicacao","fonte","extra","comentario"],sb:["subtopico","subtopicos"]};
function parseDeckSheet(aoa){
  let hi=-1,cm={};
  for(let r=0;r<Math.min(aoa.length,10)&&hi<0;r++){const m={};aoa[r].forEach((h,ci)=>{const n=norm(h);for(const k in AKH){if(m[k]==null&&AKH[k].includes(n))m[k]=ci}});if(m.f!=null&&m.t!=null){hi=r;cm=m}}
  if(hi<0)return {cards:[],errs:["Não encontrei os cabeçalhos. A planilha precisa ter as colunas Tipo e Frente (e, se quiser, Matéria, Assunto, Baralho, Verso e Explicação)."]};
  const cards=[],errs=[];
  for(let r=hi+1;r<aoa.length;r++){const row=aoa[r],g=k=>cm[k]!=null?row[cm[k]]:"";if(!String(g("f")).trim()&&!String(g("t")).trim())continue;
    const x=mkCard(String(g("mat")||"").trim(),String(g("ass")||"").trim(),String(g("bar")||"").trim(),g("t"),g("f"),g("v"),g("x"),"Linha "+(r+1),g("sb"));
    if(x.err)errs.push(x.err);else cards.push(x.card)}
  return {cards,errs};
}
function akPrepare(res,name){
  ak.errs=res.errs.slice(0,12);ak.err="";ak.msg="";ak.name=name;
  const gm={},groups=[];
  res.cards.forEach(c=>{const key=norm(c.mat)+"|"+norm(c.ass)+"|"+norm(c.bar);let g=gm[key];if(!g){const k=subjectMatch(c.mat),rk=k?metaRank(k,c.ass):[];g=gm[key]={mat:c.mat,ass:c.ass,bar:c.bar,k,mid:rk[0]&&rk[0].score>=.4?rk[0].m.id:"",n:0};groups.push(g)}g.n++;c.g=groups.indexOf(g)});
  ak.groups=groups;ak.cards=res.cards;
  if(!res.cards.length&&!ak.errs.length)ak.err="Não encontrei nenhum cartão no texto.";
}
function akReadText(){const ta=$("#ak-paste");ak.paste=ta?ta.value:ak.paste;akPrepare(parseDeckText(ak.paste),"texto colado");render()}
function akReadFile(file){
  const isCsv=/\.(csv|txt|tsv)$/i.test(file.name),rd=new FileReader();
  rd.onload=ev=>{
    try{
      if(/\.(txt)$/i.test(file.name)){akPrepare(parseDeckText(String(ev.target.result)),file.name)}
      else{
        if(!window.XLSX)throw new Error("Não consegui carregar o leitor de planilhas. Recarregue a página.");
        const wb=isCsv?XLSX.read(String(ev.target.result).replace(/^﻿/,""),{type:"string"}):XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        akPrepare(parseDeckSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})),file.name);
      }
    }catch(er){ak.groups=[];ak.cards=[];ak.errs=[];ak.err=er.message||"Não consegui ler o arquivo."}
    render();
  };
  if(isCsv||/\.txt$/i.test(file.name))rd.readAsText(file,"UTF-8");else rd.readAsArrayBuffer(file);
}
function akImport(){
  const list=[],seen=new Set();let skipped=0,dup=0;
  ak.cards.forEach(c=>{
    const g=ak.groups[c.g];if(!g||!g.k){skipped++;return}
    const id=cardId(g.k,c.f);if(CARDS[id]||seen.has(id)){dup++;return}seen.add(id);
    const nm=g.bar||g.ass||SHORT[g.k];
    list.push([id,{k:g.k,mid:g.mid||"",as:g.ass||"",b:nm,sb:c.sb||"",t:c.t,f:c.f,v:c.v,x:c.x,cr:T0(),reps:0,ivl:0,ez:2.5,lap:0,ok:0,er:0,due:"",ult:"",last:0}]);
  });
  if(list.length)cardsWrite(list);
  ak.msg=`Importei ${list.length} ${list.length===1?"cartão":"cartões"}.${dup?` ${dup} já existiam e foram ignorados.`:""}${skipped?` ${skipped} ficaram de fora por falta de matéria.`:""}`;
  ak.groups=[];ak.cards=[];ak.errs=[];ak.paste="";ak.err="";render();
}

/* repetição espaçada (tipo Anki): Errei, Difícil, Bom, Fácil */
function srsApply(c,g){
  const T=today(),maxI=Math.max(1,dday(EXAM,T)-1);
  if(g===1){c.lap=(c.lap||0)+1;c.er=(c.er||0)+1;c.ez=Math.max(1.3,(c.ez||2.5)-.2);c.ivl=0;c.reps=Math.max(c.reps||0,1);c.due=ymd(T)}
  else{
    c.ok=(c.ok||0)+1;
    if(!c.ivl){c.ivl=g===4?4:1}
    else if(g===2){c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*1.2));c.ez=Math.max(1.3,c.ez-.15)}
    else if(g===3){c.ivl=c.reps<=1?Math.max(3,c.ivl+1):Math.max(c.ivl+1,Math.round(c.ivl*c.ez))}
    else{c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*c.ez*1.3));c.ez=c.ez+.15}
    c.ivl=Math.min(c.ivl,maxI);c.reps=(c.reps||0)+1;c.due=ymd(addDays(T,c.ivl));
  }
  c.ult=ymd(T);c.last=g;return c;
}
const srsPreview=(c,g)=>g===1?"hoje":ivTxt(srsApply({...c},g).ivl);

function akPool(){return Object.entries(CARDS).map(([id,c])=>({id,...c})).filter(c=>(!ak.mat||c.k===ak.mat)&&(!ak.mid||c.mid===ak.mid)&&(!ak.bar||c.b===ak.bar)&&(!ak.tipo||c.t===ak.tipo)&&(!ak.sb||c.sb===ak.sb))}
function akBuild(m){
  const T=T0(),p=akPool();
  if(m==="hoje"){const v=p.filter(c=>c.ult&&c.due<=T),nv=Math.max(0,AKNOV()-((REVD[T]||{}).nv||0));return [...shuf(v),...shuf(p.filter(c=>!c.ult)).slice(0,nv)]}
  if(m==="erros")return p.filter(c=>c.ult&&(c.lap>0||c.last===1)).sort((a,b)=>b.lap-a.lap).slice(0,40);
  if(m==="acertos")return shuf(p.filter(c=>c.ult&&c.last>=3)).slice(0,30);
  if(m==="dificeis")return p.filter(c=>c.ult&&(c.ez<2.2||c.lap>=2)).sort((a,b)=>a.ez-b.ez).slice(0,40);
  if(m==="novos")return shuf(p.filter(c=>!c.ult)).slice(0,AKNOV());
  if(m==="aleatorio")return shuf(p).slice(0,25);
  return shuf(p).slice(0,100);
}
function akMetaInfo(mid){
  const T=T0(),cs=Object.values(CARDS).filter(c=>c.mid===mid),nvHoje=Math.max(0,AKNOV()-((REVD[T]||{}).nv||0));
  const due=cs.filter(c=>c.ult&&c.due<=T).length,nov=cs.filter(c=>!c.ult).length,err=cs.filter(c=>c.ult&&(c.lap>0||c.last===1)).length;
  return {n:cs.length,due,nov,err,hoje:due+Math.min(nov,nvHoje)};
}
function akChip(mid){

}

function akStart(){

  ak.err="";ak.msg="";ak.rv=ak.rvNext||"";ak.rvNext="";ak.queue=q.map(c=>c.id);ak.i=0;qt.asess=0;qt.acq={};qt.act=Date.now();ak.rev=false;ak.pick="";ak.ses={n:0,ok:0,er:0};ak.view="session";render();window.scrollTo(0,0);

const lacF=t=>esc(t).replace(/\{\{(?:c\d+::)?([^}]*?)(?:::[^}]*)?\}\}/g,'<span class="blank">[…]</span>');
const lacV=t=>esc(t).replace(/\{\{(?:c\d+::)?([^}]*?)(?:::[^}]*)?\}\}/g,'<mark>$1</mark>');

function akStats(){
  const T=T0(),o={n:0,due:0,nov:0,ok:0,er:0,dueDay:Array(14).fill(0),est:{novo:0,apr:0,jov:0,mad:0},byK:{},byA:{},byB:{},byS:{}};
  Object.entries(CARDS).forEach(([id,c])=>{

    const kk=o.byK[c.k]||(o.byK[c.k]={n:0,ok:0,er:0,lap:0});kk.n++;kk.ok+=c.ok||0;kk.er+=c.er||0;kk.lap+=c.lap||0;
    const ak_=c.mid||("t:"+norm(c.as||c.b||""));const aa=o.byA[ak_]||(o.byA[ak_]={mid:c.mid,k:c.k,nome:c.mid&&BY[c.mid]?BY[c.mid].a:(c.as||c.b||"Sem assunto"),n:0,ok:0,er:0,lap:0});aa.n++;aa.ok+=c.ok||0;aa.er+=c.er||0;aa.lap+=c.lap||0;
    if(c.sb){const sk=(c.mid||norm(c.as||""))+"|"+norm(c.sb),ss=o.byS[sk]||(o.byS[sk]={k:c.k,mid:c.mid,sb:c.sb,ass:c.mid&&BY[c.mid]?BY[c.mid].a:(c.as||""),n:0,ok:0,er:0,lap:0});ss.n++;ss.ok+=c.ok||0;ss.er+=c.er||0;ss.lap+=c.lap||0}

let AKS=null;

  }

function barsHtml(rows){return `<div class="hb">${rows.map(r=>`<div class="hb-r" data-tip="${esc(r.tip||"")}"><div class="hb-l" style="--c:${r.c}"><i></i><span>${esc(r.l)}</span></div><div class="hb-t" style="--c:${r.c}"><i style="width:${Math.max(0,Math.min(100,r.f*100))}%"></i></div><div class="hb-v">${r.v}${r.s?`<small>${r.s}</small>`:""}</div></div>`).join("")}</div>`}
const tmDay=d=>(A.tm.q.day[d]||0)+(A.tm.k.day[d]||0);
const tmWkT=i=>(A.tm.q.wk[i]||0)+(A.tm.k.wk[i]||0);
const tmTot=()=>A.tm.q.tot+A.tm.k.tot;
const tmRv=id=>((A.tm.q.rv[id]||{}).s||0)+(A.tm.k.rv[id]||0);
const tmMeta=id=>{const q=A.tm.q.meta[id],k=A.tm.k.meta[id];return {q:q?q.s:0,k:k||0,n:q?q.n:0}};
const hhSum=()=>A.tm.q.hh.reduce((z,x)=>({c:z.c+x.c,e:z.e+x.e,b:z.b+x.b}),{c:0,e:0,b:0});

const NS=(w,h,aria)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}">`;
function cols(el,bars,o){
  const w=el.clientWidth||320,h=o.h||190,pl=38,pr=4,pt=10,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=bars.length,st=iw/n,bw=Math.min(26,st*.64);
  const mx=o.max,Y=v=>pt+ih-ih*Math.min(v,mx)/mx;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  const rr=(x,y,w_,h_)=>{const r=Math.min(5,w_/2,h_);return `M${x},${y+h_}V${y+r}Q${x},${y} ${x+r},${y}H${x+w_-r}Q${x+w_},${y} ${x+w_},${y+r}V${y+h_}Z`};
  bars.forEach((b,i)=>{
    const x=pl+st*i+(st-bw)/2;
    if(b.g!=null&&b.g>0)s+=`<path d="${rr(x,Y(b.g),bw,ih-(Y(b.g)-pt))}" fill="var(--soft2)"/>`;
    if(b.v>0)s+=`<path d="${rr(x,Y(b.v),bw,ih-(Y(b.v)-pt))}" fill="${b.c||"var(--blue)"}"/>`;
    s+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle" ${b.hi?'class="em"':""}>${b.l}</text>`;
    s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(b.t)}"/>`;
  });
  s+=`<line x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--soft2)" stroke-width="1"/></svg>`;
  el.innerHTML=s;
}
function lines(el,labels,series,o){
  const w=el.clientWidth||320,h=o.h||190,pl=38,pr=14,pt=14,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=labels.length,st=iw/n;
  const X=i=>pl+st*(i+.5),Y=v=>pt+ih-ih*Math.max(0,Math.min(v,o.max))/o.max;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  labels.forEach((l,i)=>{s+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle" ${o.hi===i?'class="em"':""}>${l}</text>`});
  series.forEach(se=>{
    let d="",open=false,last=null,first=null;
    se.vals.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);open=true;last=i;if(first==null)first=i});
    if(!d)return;
    if(se.fill&&last!=null)s+=`<path d="${d} L${X(last)} ${pt+ih} L${X(first)} ${pt+ih}Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 5"':""}/>`;
    if(se.dots)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${se.color}" stroke="var(--bg)" stroke-width="2"/>`});
    if(last!=null&&se.end){s+=`<circle cx="${X(last)}" cy="${Y(se.vals[last])}" r="5.5" fill="${se.color}" stroke="var(--bg)" stroke-width="2.5"/><text class="em" x="${Math.min(X(last),w-pr-12)}" y="${Y(se.vals[last])-12}" text-anchor="middle">${se.end(se.vals[last])}</text>`}
  });
  labels.forEach((l,i)=>{s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(o.tip(i))}"/>`});
  s+="</svg>";el.innerHTML=s;
}

      const m=Math.max(2,Math.ceil(Math.max(...bars.map(b=>b.v))/2)*2);

const weekMetas=i=>ALL.filter(m=>!hid(m)&&ew(m)===i);

}

const fmtH=s=>{s=Math.round(s||0);if(s<=0)return "0 min";if(s<60)return "<1 min";const m=Math.round(s/60);return m<60?m+" min":Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")};
const fmtClock=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,z=n=>String(n).padStart(2,"0");return (h?h+":"+z(m):m)+":"+z(x)};

  }else if(n){

    rows.push(li("Estude pelas questões do banco",`${n} ${n===1?"questão":"questões"} desta meta: ${nNov} ${nNov===1?"nova":"novas"}, ${nErr} para refazer`,btns));
  }else if(m.t==="questoes"){
    /* bloco geral: sem sugestão de teoria */
  }else if(!p.lk&&(m.k==="LIN"||m.k==="ASR")){

  if(a.slice(0,3)==="nt-"&&ntClick(a,t))return;
  if(a==="upd"){reloadApp();return}
  if(a==="modo"){LS.set("painel-modo",t.dataset.v);if(demo)render();else cfgSave({modo:t.dataset.v});return}
  if(a==="tema"){LS.set("painel-tema",t.dataset.v);if(demo)render();else cfgSave({tema:t.dataset.v});return}
  if(a==="fz"){fzStep(+t.dataset.d);return}
  if(a==="pf-go"){const e=document.getElementById("pf-"+t.dataset.v);if(e)e.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(a==="ak-go"){closeSheet();tab="ankis";menu=false;ak.view="home";render();window.scrollTo(0,0);return}
  if(a==="ak-meta"){
    const m=BY[t.dataset.id];if(!m)return;
    ak.mat=m.k;ak.mid=m.id;ak.bar="";ak.tipo="";ak.sb="";ak.modo=t.dataset.m||"hoje";ak.rvNext=t.dataset.rv||"";
    closeSheet();tab="ankis";menu=false;ak.view="home";akStart();return}
  if(a==="ak-sub"){const m=BY[t.dataset.mid];ak.mat=t.dataset.k;ak.mid=m?m.id:"";ak.bar="";ak.tipo="";ak.sb=t.dataset.sb;ak.modo="tudo";ak.rvNext="";tab="ankis";menu=false;ak.view="home";akStart();ak.sb="";return}
  if(a==="ak-modo"){ak.modo=t.dataset.m;ak.err="";render();return}
  if(a==="ak-start"){akStart();return}
  if(a==="ak-quit"){ak.view="home";render();window.scrollTo(0,0);return}
  if(a==="ak-show"){ak.rev=true;render();return}
  if(a==="ak-pick"){ak.pick=t.dataset.v;ak.rev=true;render();return}
  if(a==="ak-grade"){akAnswer(+t.dataset.g);return}
  if(a==="ak-read"){akReadText();return}
  if(a==="ak-import"){akImport();return}
  if(a==="ak-cancel"){ak.groups=[];ak.cards=[];ak.errs=[];ak.err="";ak.paste="";render();return}
  if(a==="ak-copy"){akCopy();return}
  if(a==="ak-deck"){ak.bar=t.dataset.b;ak.mat="";ak.mid="";ak.tipo="";ak.modo="hoje";akStart();return}
  if(a==="ak-weak"){const m=BY[t.dataset.mid];ak.mid=t.dataset.mid;ak.mat=m?m.k:"";ak.bar="";ak.tipo="";ak.modo="tudo";akStart();return}
  if(a==="ak-delask"){ak.ask=t.dataset.b;render();return}
  if(a==="ak-delno"){ak.ask="";render();return}
  if(a==="ak-delok"){const b=t.dataset.b;cardsWrite(Object.entries(CARDS).filter(([id,c])=>c.b===b).map(([id])=>[id,null]));ak.ask="";if(ak.bar===b)ak.bar="";ak.msg=`Excluí o baralho "${b}".`;render();return}
  if(a==="bkask"){fb.bkAsk=t.dataset.d;fb.bkMsg="";render();return}
  if(a==="bkno"){fb.bkAsk="";render();return}
  if(a==="bkgo"){restoreAuto(t.dataset.d);return}
  if(a==="backup"){exportBackup();return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="qb-paste"){qb.paste=e.target.value;return}
  if(e.target.id==="bz-q"){bib.bq=e.target.value;bib.ci=0;const pos=e.target.selectionStart;render();const n=document.getElementById("bz-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(e.target.id==="qb-q"){qb.q=e.target.value;qb.more=50;const pos=e.target.selectionStart;render();const n=document.getElementById("qb-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(e.target.id==="sb-q"){sb.busca=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("sb-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(e.target.id==="sm-ana-paste"){sm.ana.paste=e.target.value;return}
  if(e.target.id==="ak-paste"){ak.paste=e.target.value;return}
  const i=e.target.closest("[data-f]");if(!i)return;
  const k=i.dataset.f,v=i.value.replace(",",".");
  if(k==="nc")draft.nc=v===""?null:Math.max(0,parseFloat(v)||0);
  else if(k==="ne"||k==="tl")draft[k]=v===""?null:Math.max(0,parseInt(v,10)||0);
  else draft[k]=i.value===""?0:Math.max(0,parseInt(i.value,10)||0);
  liveUpd();
});
document.addEventListener("change",e=>{
  if(qbChange(e))return;
  if(ntChange(e))return;
  if(mtChange(e))return;
  if(e.target.id==="sb-om"){sb.om=e.target.value;render();return}
  if(e.target.id==="sb-oa"){sb.oa=e.target.value;render();return}
  if(smChange(e))return;
  const akf=e.target.closest("#ak-file");
  if(akf&&akf.files&&akf.files[0]){ak.msg="";akReadFile(akf.files[0]);return}
  const aks=e.target.closest("[data-ak]");
  if(aks){const k=aks.dataset.ak;
    if(k==="nov"){LS.set("painel-novos",aks.value);render();return}
    ak[k]=aks.value;if(k==="mat")ak.mid="";ak.err="";render();return}
  const akg=e.target.closest("[data-akg]");
  if(akg){const g=ak.groups[+akg.dataset.i];if(g){if(akg.dataset.akg==="k"){g.k=akg.value;const rk=g.k?metaRank(g.k,g.ass):[];g.mid=rk[0]&&rk[0].score>=.4?rk[0].m.id:""}else g.mid=akg.value;render()}return}
  const bk=e.target.closest("#bk-file");
  if(bk&&bk.files&&bk.files[0]){restoreBackup(bk.files[0]);return}
  const f=e.target.closest("#imp-file");
  if(f&&f.files&&f.files[0]){imp.err="";imp.msg="";readFile(f.files[0]);return}
  const sl=e.target.closest("[data-imp]");
  if(sl){const r=imp.rows[+sl.dataset.i];if(!r)return;
    if(sl.dataset.imp==="k"){r.k=sl.value;const rk=r.k?metaRank(r.k,r.ass):[];r.mid=rk[0]&&rk[0].score>=.4?rk[0].m.id:""}
    else r.mid=sl.value;
    render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("lg-")===0){e.preventDefault();if(e.target.id.indexOf("lg-new")===0)doSetPass();else doLogin();return}
  if(e.key==="Escape"&&menu){menu=false;render();return}
  if(e.key==="Escape"&&sheetId)closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("row")){e.preventDefault();openSheet(e.target.dataset.id)}
});
const tip=$("#tip");let tipT=null;
function showTip(t,x,y){tip.textContent=t.dataset.tip;if(!t.dataset.tip){return}tip.classList.add("on");const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";tip.style.top=Math.max(8,y-h-14)+"px"}
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType==="mouse")showTip(t,e.clientX,e.clientY);else if(e.pointerType==="mouse")tip.classList.remove("on")});
document.addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType!=="mouse"){showTip(t,e.clientX,e.clientY);clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove("on"),2200)}});

/* ---------- atualização do aplicativo ---------- */
const upd={novo:false,busy:false};
const buildTxt=()=>{try{const d=new Date(BUILD);return isNaN(d)?"":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
function reloadApp(){upd.busy=true;try{sessionStorage.setItem("painel-recarregou","1")}catch(e){}location.replace(location.pathname+"?v="+Date.now())}
async function checkUpd(){
  if(!/^https?:$/.test(location.protocol)||upd.novo)return;
  try{const r=await fetch(location.pathname,{cache:"no-store"});if(!r.ok)return;const t=await r.text(),m=/const BUILD="([^"]+)"/.exec(t);
    if(m&&m[1]&&BUILD.length>10&&m[1]!==BUILD){upd.novo=true;render()}}catch(e){}
}
setTimeout(checkUpd,4000);setInterval(checkUpd,600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpd()});
if(location.search.indexOf("v=")>=0)try{history.replaceState(null,"",location.pathname)}catch(e){}
/* puxar para baixo para atualizar */
(function(){
  let y0=null,dy=0,el=null;
  const free=()=>window.scrollY<=0&&!menu&&!sheetId&&!(qb&&qb.view==="session"&&tab==="questoes")&&!(ak&&ak.view==="session"&&tab==="ankis");
  const mk=()=>{if(!el){el=document.createElement("div");el.id="ptr";el.innerHTML='<span></span><b>Puxe para atualizar</b>';document.body.appendChild(el)}return el};
  document.addEventListener("touchstart",e=>{y0=(e.touches.length===1&&free())?e.touches[0].clientY:null;dy=0},{passive:true});
  document.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy<=0){if(el)el.style.transform="translateY(-100%)";return}
    const p=mk(),k=Math.min(1,dy/90);p.style.transform=`translateY(${Math.min(dy,110)-100}%)`;p.style.opacity=String(.3+k*.7);p.classList.toggle("go",dy>=90);p.querySelector("b").textContent=dy>=90?"Solte para atualizar":"Puxe para atualizar"},{passive:true});
  document.addEventListener("touchend",()=>{if(y0==null)return;const go=dy>=90;y0=null;if(el){el.style.transform="translateY(-100%)";el.style.opacity="0"}if(go){mk().querySelector("b").textContent="Atualizando…";reloadApp()}});
})();
