<title>Painel de Metas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: página branca, linhas finas e tipografia como estrutura; blocos de cor sólida nos indicadores; cantos quase retos; tema único, sempre claro. */
:root{
  --bg:#ffffff; --fg:#111827; --fg2:#4b5563; --fg3:#6b7280; --line:#e5e7eb; --soft:#f3f4f6; --soft2:#e5e7eb;
  --blue:#2563eb; --green:#15803d; --purple:#6d28d9; --orange:#c2410c; --teal:#0f766e; --indigo:#4338ca; --red:#b91c1c; --pink:#be185d; --slate:#334155; --gold:#f59e0b;
  --good:#15803d; --bad:#b91c1c; --good-t:#dcfce7; --bad-t:#fee2e2; --warn-t:#fef3c7; --blue-t:#eff6ff;
  --m-REG:#2a78d6; --m-POR:#eb6834; --m-LIN:#4a3aa7; --m-TI:#1baf7a; --m-CP:#e87ba4; --m-ADM:#eda100; --m-CON:#008300; --m-ASR:#e34948; --m-ING:#2f9bb5;
  --font:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Nunito","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --r:14px; --gut:clamp(16px,3.2vw,36px);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut);padding-block:22px 56px}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}

/* cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
h1{margin:2px 0 0;font:900 clamp(34px,6vw,54px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg2)}
.sw .note{max-width:220px;line-height:1.25;text-align:right}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:#cbd5e1;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.5;cursor:default}

/* abas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.seg{display:flex;gap:clamp(14px,2.4vw,28px);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:12px 2px 11px;font-size:15px;font-weight:600;color:var(--fg3);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.seg button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.bd{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:99px;display:inline-grid;place-items:center;padding:0 5px}

/* topo da semana */
.hero{padding-block:22px 4px}
.hero-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:8px}
.nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;color:var(--fg)}
.nav:disabled{opacity:.3;cursor:default}
.wk-t{font:900 26px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;padding-inline:6px}
.wk-d{font-size:14px;color:var(--fg2);padding-inline:6px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--fg2);white-space:nowrap}
.pill.blue{background:var(--blue);color:#fff} .pill.green{background:var(--good-t);color:var(--good)} .pill.warn{background:var(--warn-t);color:#92400e}
.hero-main{display:flex;align-items:stretch;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:20px}
.big{display:flex;align-items:baseline;gap:10px;color:var(--green)}
.big .bn{font:900 clamp(70px,12vw,112px)/.85 var(--display)}
.big small{font-size:15px;font-weight:600;color:var(--fg2)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.st{border:2px solid var(--c);border-radius:16px;padding:10px 16px 11px;min-width:150px;display:flex;flex-direction:column}
.st span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.st b{font:900 32px/1.1 var(--display);color:var(--c);margin-top:2px}
.st small{font-size:12px;color:var(--fg2)}

/* barra de progresso gamificada */
.xp{position:relative;margin-top:22px;padding-top:26px}
.xp-flag{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--fg);white-space:nowrap;text-align:center}
.xp-flag::after{content:"";display:block;margin:2px auto 0;border:5px solid transparent;border-top-color:var(--fg);border-bottom:0}
.xp-track{position:relative;height:30px;background:var(--soft2);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;position:relative;border-radius:99px;background:repeating-linear-gradient(-45deg,#16a34a 0 10px,#22c55e 10px 20px);background-size:28px 28px;animation:stripes 1.1s linear infinite;transition:width .5s ease-out}
.xp-fill.done{background:repeating-linear-gradient(-45deg,#15803d 0 10px,#16a34a 10px 20px);background-size:28px 28px}
.xp-pct{text-shadow:0 1px 2px rgba(0,0,0,.25);position:absolute;top:50%;transform:translateY(-50%);font:900 17px/1 var(--display);color:#fff;right:8px}
.xp-pct.out{right:auto;left:calc(100% + 10px);color:var(--fg);text-shadow:none}
.xp-tick{position:absolute;top:6px;bottom:6px;width:2px;border-radius:2px;background:rgba(17,24,39,.14);z-index:2}
.xp-ms{position:relative;height:28px;margin-top:10px}
.ms{position:absolute;top:0;transform:translateX(-50%);min-width:38px;padding:2px 6px;border:2px solid var(--soft2);color:var(--fg3);font-size:11px;font-weight:700;text-align:center;border-radius:99px;background:var(--bg)}
.ms.last{transform:translateX(-100%)}
.ms.on{background:var(--gold);border-color:var(--gold);color:#111827}
.xp-cap{margin:8px 0 0;font-size:13px;color:var(--fg2)}
@keyframes stripes{to{background-position:28px 0}}
.next{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:var(--soft);cursor:pointer;text-align:left;width:100%}
.next .l{font-size:11.5px;font-weight:700;color:var(--fg3);letter-spacing:.08em;text-transform:uppercase}
.next .t{font-size:16px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next .grow{min-width:0;flex:1}

/* indicadores: blocos de cor sólida */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}
.kpi{border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:152px;background:var(--k);color:#fff;text-align:left}
.kpi .lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.kpi .num{font-size:clamp(30px,3.8vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.kpi .num small{font-size:.42em;font-weight:500;letter-spacing:0;margin-left:4px;color:rgba(255,255,255,.9)}
.kpi .sub{font-size:13px;color:rgba(255,255,255,.92);line-height:1.3}
.kpi .viz{margin-top:auto;padding-top:12px;display:flex;align-items:flex-end;min-height:36px}
.kpi.blue{--k:var(--blue)} .kpi.green{--k:var(--green)} .kpi.purple{--k:var(--purple)} .kpi.orange{--k:var(--orange)}
.kpi.teal{--k:var(--teal)} .kpi.indigo{--k:var(--indigo)} .kpi.pink{--k:var(--pink)} .kpi.red{--k:var(--red)} .kpi.slate{--k:var(--slate)}
.sbars{display:flex;align-items:flex-end;gap:3px;height:34px;width:100%}
.sbars span{flex:1;background:#fff;min-height:3px;border-radius:4px 4px 0 0}
.sbars span.z{background:rgba(255,255,255,.28)}
.spark{position:relative;width:100%;height:34px}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.spark .pt{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.bar2{height:8px;background:rgba(255,255,255,.3);width:100%;border-radius:99px;overflow:hidden}.bar2 i{display:block;height:100%;background:#fff;border-radius:99px}
.plan .bar2{background:var(--soft2)} .plan .bar2 i{background:var(--k)}
.steps{display:flex;gap:3px}.steps i{width:10px;height:10px;border:2px solid var(--fg3);border-radius:50%}.steps i.d{background:var(--green);border-color:var(--green)}

/* seções e listas */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
h3{margin:0;font-size:15px;font-weight:700}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dt{width:20px;height:20px;border-radius:7px;border:2px solid var(--c,var(--fg3));background:transparent;flex:none}
.dt.d{background:var(--c,var(--fg3))} .dt.p{background:linear-gradient(90deg,var(--c,var(--fg3)) 50%,transparent 50%)}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--warn-t);font-size:13.5px;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
.grp{min-width:0}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);padding-bottom:8px;border-bottom:2px solid var(--fg);display:flex;justify-content:space-between}
.list{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:12px;cursor:pointer;border-bottom:1px solid var(--line);min-width:0}
.row:hover{background:var(--soft)} .row:active{background:var(--soft2)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid #9ca3af;flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s}
.chk svg{width:14px;height:14px;opacity:0;stroke:#fff}
.row.done .chk{background:var(--green);border-color:var(--green)} .row.done .chk svg{opacity:1}
.row.part .chk{border-color:var(--orange);background:linear-gradient(90deg,var(--orange) 50%,transparent 50%)}
.rt{min-width:0;flex:1}
.rt .t{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.done .rt .t{color:var(--fg3);font-weight:500}
.rt .s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg2);margin-top:3px}
.rt .ls{margin-top:5px;font-size:12.5px;color:var(--fg2);display:flex;gap:7px;align-items:baseline;min-width:0}
.rt .ls b{flex:none;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--soft);color:var(--fg2);padding:2px 8px;border-radius:99px}
.rt .ls span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--fg3))} .tag.ring i{background:transparent;border:2px solid var(--c,var(--fg3))}
.rb{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--blue-t);color:var(--blue);font-size:11.5px;font-weight:700}
.rb.mv{background:var(--warn-t);color:#92400e}
.late{color:var(--bad);font-weight:700}
.res{font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
.res small{display:block;font-size:11.5px;font-weight:500;color:var(--fg2);margin-top:2px}
.sc{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.sc.hi{background:var(--good-t);color:var(--good)} .sc.mid{background:var(--warn-t);color:#92400e} .sc.lo{background:var(--bad-t);color:var(--bad)} .sc.na{background:var(--soft);color:var(--fg3)}
.empty{padding:18px 2px;color:var(--fg2);font-size:14px;border-bottom:1px solid var(--line)}
.lead{font-size:14px;color:var(--fg2);max-width:70ch;margin:0 0 4px}

/* cards de gráficos */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.card.wide{grid-column:1/-1}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--fg2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chart{width:100%;min-height:60px} .chart svg{display:block;overflow:visible}
.chart text{font:11px var(--font);fill:var(--fg3)} .chart .em{fill:var(--fg);font-weight:700;font-size:12px}
.hb{display:flex;flex-direction:column;gap:11px}
.hb-r{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb-l{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}.hb-l i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.hb-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--soft);position:relative;border-radius:99px;overflow:hidden}
.hb-t i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.hb-v{font-weight:700;min-width:44px;text-align:right}.hb-v small{font-weight:500;color:var(--fg3);margin-left:4px}
.stk{display:flex;height:14px;gap:2px;margin:4px 0 10px;border-radius:99px;overflow:hidden}.stk i{display:block;height:100%;background:var(--c)}
.heat{display:grid;grid-template-columns:124px repeat(var(--n),minmax(0,1fr));gap:2px;align-items:center;font-size:11px}
.heat .h{color:var(--fg3);text-align:center;font-weight:600}
.heat .y{font-size:12.5px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:6px;min-width:0}.heat .y i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.heat .y span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:26px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--fg)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.hot{color:#fff}

/* matérias */
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.mat{border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}
.mat-h{display:block;width:100%;text-align:left;padding:16px;border-top:4px solid var(--c)}
.mat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mat-n{font-size:16px;font-weight:700;min-width:0}
.mat-st{display:flex;gap:22px;margin-top:12px}.mat-st b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}.mat-st span{font-size:12px;color:var(--fg2)}
.cv{height:8px;background:var(--soft);margin-top:14px;border-radius:99px;overflow:hidden}.cv i{display:block;height:100%;background:var(--c);border-radius:99px}
.mat-b{border-top:1px solid var(--line)}
.as{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.as:hover{background:var(--soft)} .as+.as{border-top:1px solid var(--line)}
.as .t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:550}
.as .w{font-size:12px;color:var(--fg3);font-weight:700;width:28px;flex:none}
.chev{display:inline-block;transition:transform .15s}.open .chev{transform:rotate(90deg)}

/* plano */
.plan{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.pr{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:14px;align-items:center;padding:13px 12px;border-radius:14px;cursor:pointer;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.pr:hover{background:var(--soft)} .pr.cur{background:var(--blue-t)}
.pr .w{font-weight:700;font-size:16px}.pr .d{font-size:13px;color:var(--fg2)}.pr .d small{display:block;color:var(--fg3);font-size:11.5px}
.pr .pg{min-width:0}.pr .pg .bar2{margin-bottom:5px}.pr .pg span{font-size:12px;color:var(--fg2)}
.pr .a{text-align:right;min-width:52px}

/* importação */
.imp-box{border:2px dashed var(--soft2);border-radius:20px;padding:26px;text-align:center}
.imp-box p{margin:6px auto 14px;max-width:56ch;color:var(--fg2);font-size:14px}
.file-btn{display:inline-block;padding:12px 22px;border-radius:99px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px}
.file-btn:focus-within{outline:3px solid var(--fg);outline-offset:2px}
.link{color:var(--blue);font-weight:600;text-decoration:underline;font-size:14px}
.msg{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--good-t);font-size:14px}
.msg.err{background:var(--bad-t)}
.ir{padding:12px 2px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 16px;align-items:center}
.ir.skip{opacity:.55}
.ir .a{min-width:0}.ir .a b{display:block;font-size:14px}.ir .a span{font-size:13px;color:var(--fg2)}
.ir .n{grid-column:1/-1;font-size:12.5px;color:var(--fg2)}
.ir .sels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
select,.in{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--soft2);border-radius:12px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
select:focus,.in:focus{outline:3px solid var(--blue);outline-offset:0}
.bar-act{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.bar-act .btn{width:auto;margin:0;padding:12px 22px}

/* ficha da meta */
.ov{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain;border-radius:24px 24px 0 0}
.sh-k{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.sh-t{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:0}
.sh-m{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.sh-p{font-size:14px;color:var(--fg2);margin:10px 0 0}
.box{margin-top:14px;background:var(--soft);border-radius:16px;padding:12px 16px}
.box b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:3px}
.box p{margin:0;font-size:14.5px;font-weight:600}
.box small{display:block;margin-top:4px;font-size:12px;color:var(--fg3)}
.tp{margin:4px 0 0;padding-left:18px;font-size:14px;font-weight:500}.tp li{margin:3px 0}
.gd{margin:12px 0 0;padding:0 0 0 20px;font-size:14px;color:var(--fg)}.gd li{margin:5px 0;padding-left:4px}

<script>
const D = __DATA__;
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dday=(a,b)=>Math.round((a-b)/864e5);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const fmtD=(a,b)=>{const x=pd(a),y=pd(b);return x.getMonth()===y.getMonth()?`${x.getDate()}–${y.getDate()} ${MES[y.getMonth()]}`:`${x.getDate()} ${MES[x.getMonth()]} – ${y.getDate()} ${MES[y.getMonth()]}`};
const fmtDay=s=>{const d=typeof s==="string"?pd(s):s;return d.getDate()+" "+MES[d.getMonth()]};
const pc=x=>x==null?"–":Math.round(x*100)+"%";
const rate=o=>{const n=o.c+o.e+o.b;return n?o.c/n:null};
const net=o=>{const n=o.c+o.e+o.b;return n?(o.c-o.e)/n:null};
const tot_=o=>o.c+o.e+o.b;
const num=x=>x.toLocaleString("pt-BR");
const f1=x=>x.toFixed(1).replace(".",",");

const MAT=D.mat, SUBJ=["REG","LIN","POR","ADM","CON","CP","TI","ASR","ING"], RV=D.rev;
const SHORT={REG:"Legislativo",LIN:"Linguística",POR:"Português",ADM:"Administrativo",CON:"Constitucional",CP:"Ciência Política",TI:"TI e Dados",ASR:"Fala e IA",ING:"Inglês"};
const OTHERN={SIM:"Simulado",DIS:"Discursiva",DOM:"Domingo",BUF:"Reforço",RG:"Todas as matérias"};
const TIPO={teoria_questoes:"Teoria + questões",rev_dyn:"Revisão",questoes:"Questões",simulado:"Simulado",discursiva:"Discursiva",domingo:"Domingo",ingles:"Inglês",caderno_erros:"Caderno de erros",lei_seca:"Lei seca",revisao:"Revisão",planejamento:"Planejamento",checklist:"Checklist",prova:"Prova"};
const GRP={simulado:"aval",discursiva:"aval",domingo:"dom"};
const GTIT={estudo:"Estudo e inglês",aval:"Simulado e discursiva",dom:"Domingo"};
const FASE={1:"Fase 1 · 1ª passada",2:"Fase 2 · reforço",3:"Fase 3 · reta final"};
const WK=D.sem, ALL=WK.flatMap((w,wi)=>w.m.map(m=>(m.wi=wi,m)));
const BY=Object.fromEntries(ALL.map(m=>[m.id,m]));
const SIMS=ALL.filter(m=>m.t==="simulado"), DISCS=ALL.filter(m=>m.t==="discursiva");
const EXAM=pd(D.prova), START=pd(WK[0].i);
const DEMO_TODAY="2026-11-12";
const rp=m=>m.rp||1;
const planItems=m=>m.i||(m.t==="simulado"?(+((/(\d+) itens/.exec(m.a)||[])[1])||(/completo/.test(m.a)?180:60)):0);
const hasItems=m=>!!m.i||m.t==="simulado";
const mcolor=m=>SUBJ.includes(m.k)?`var(--m-${m.k})`:"var(--fg3)";
const grp=m=>GRP[m.t]||"estudo";
const lastWk=WK.length-1;

/* revisões: 7, 15 e 30 dias por assunto + revisão geral todo domingo */
const RVTXT={
  7:{t:"Revisão de 7 dias",w:"Escreva de memória o que lembra do assunto, resolva cerca de 10 questões novas e refaça as que errou.",
     g:["Feche o material e escreva de memória tudo o que lembra deste assunto.","Confira com o seu resumo ou com a lei seca indicada acima e marque o que esqueceu.","Resolva cerca de 10 questões novas deste assunto.","Refaça as que errou e lance o resultado aqui."]},
  15:{t:"Revisão de 15 dias",w:"Responda de memória os pontos mais cobrados, resolva cerca de 10 questões novas e anote o que errou de novo.",
     g:["Sem olhar o material, liste os pontos mais cobrados deste assunto.","Releia só os trechos que você esqueceu, na lei seca ou no resumo.","Resolva cerca de 10 questões novas, misturando níveis.","Anote no caderno de erros o que errou de novo e lance o resultado aqui."]},
  30:{t:"Revisão de 30 dias",w:"Faça primeiro as questões e depois confira onde errou. É a revisão final deste assunto.",
     g:["Resolva cerca de 10 questões difíceis ou mistas deste assunto, sem consultar nada.","Confira onde errou e releia só esses trechos.","Lance o resultado aqui. Com esta revisão, o assunto completa o ciclo de 7, 15 e 30 dias."]}
};
const RGTXT={w:"Feche a semana: escreva de memória o esqueleto de cada assunto estudado, resolva questões só do que faltou e confira o desempenho e o caderno de erros.",
  g:["Para cada assunto da lista abaixo, escreva de memória os pontos principais, sem olhar o material.","Confira com os seus resumos e marque o que esqueceu.","Resolva de 5 a 10 questões novas só do que ficou faltando e lance o resultado aqui.","Veja no painel o desempenho e o caderno de erros da semana e ajuste a próxima semana."]};
const revCache={};
function revMeta(b,st){const id=b.id+"~R"+st;if(revCache[id])return revCache[id];const t=RVTXT[st];return revCache[id]={id,rv:true,base:b,step:st,k:b.k,a:b.a,e:b.e,wi:b.wi,i:RV.i,t:"rev_dyn",rp:1,w:t.w,g:t.g,ls:b.ls,tp:b.tp,ft:b.ft}}
function rgMeta(wi){return {id:WK[wi].id+"~RG",rg:true,k:"RG",a:`Revisão geral da semana ${wi+1}`,wi,i:RV.i,t:"rev_dyn",rp:1,w:RGTXT.w,g:RGTXT.g,tp:(WM[wi]||[]).filter(m=>m.t==="teoria_questoes").map(m=>m.a)}}
const getM=id=>{if(BY[id])return BY[id];if(id.endsWith("~RG")){const n=parseInt(id.slice(1),10)-1;return n>=0&&n<WK.length?rgMeta(n):null}const i=id.indexOf("~R");if(i<0)return null;const b=BY[id.slice(0,i)];return b?revMeta(b,+id.slice(i+2)):null};

/* ---------- estado ---------- */
let demo=false, real={}, DEMO={}, sel=0, tab="semana", onlyPend=false, openMat={};
let col=null, sync="local", demoChosen=null, A=null, RL=[], WM=[], IM={by:{},rows:[]};
let imp={name:"",rows:[],err:"",msg:"",date:""};
let CARDS={},REVD={};
const ak={view:"home",mat:"",mid:"",bar:"",tipo:"",modo:"hoje",queue:[],i:0,rev:false,pick:"",ses:{n:0,ok:0,er:0},paste:"",name:"",groups:[],cards:[],errs:[],err:"",msg:"",ask:"",copied:false};
const fb={on:false,pReady:false,cReady:false,bkDone:false,cunsub:null,runsub:null,ready:false,user:null,fs:null,auth:null,col:null,unsub:null,err:"",msg:"",busy:false,email:"",mode:"login",code:"",codeOk:false,bk:false,bkList:[],bkAsk:"",bkMsg:""};
const P=()=>demo?DEMO:real;
const today=()=>{if(demo)return pd(DEMO_TODAY);const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const weekOf=s=>{const t=pd(s);for(let i=0;i<WK.length;i++){if(t>=pd(WK[i].i)&&t<=pd(WK[i].f))return i}return t<START?0:lastWk};
const curWeek=()=>weekOf(ymd(today()));
const ew=m=>{const p=P()[m.id];return p&&p.mw!=null?p.mw:m.wi};
const rdone=m=>{const p=P()[m.id];return p?Math.min(p.r||0,rp(m)):0};
const isDone=m=>rdone(m)>=rp(m);
const ownItems=m=>{const p=P()[m.id];return p?{c:p.c||0,e:p.e||0,b:p.b||0}:{c:0,e:0,b:0}};
const itemsOf=m=>{const o=ownItems(m),x=IM.by[m.id];return x?{c:o.c+x.c,e:o.e+x.e,b:o.b+x.b}:o};

/* ---------- armazenamento ---------- */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function loadLocal(){try{real=JSON.parse(LS.get("painel-progresso")||"{}")||{}}catch(e){real={}}const d=LS.get("painel-demo");demoChosen=d===null?null:d==="1";try{CARDS=JSON.parse(LS.get("painel-cartoes")||"{}")||{}}catch(e){CARDS={}}try{REVD=JSON.parse(LS.get("painel-revd")||"{}")||{}}catch(e){REVD={}}}
function persistLocal(){LS.set("painel-progresso",JSON.stringify(real))}
function autoDemo(){demo=fb.on?false:(demoChosen===null?Object.keys(real).length===0:demoChosen)}
async function initDb(){
  try{
    const c=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!c)return;
    col=c.collection("progresso");sync="db";let first=true;
    col.onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});
      if(first&&snap.empty&&Object.keys(real).length){Object.entries(real).forEach(([id,v])=>col.doc(id).set(v).catch(()=>{}));}
      else real=m;
      if(first){first=false;persistLocal();autoDemo();sel=curWeek()}else{persistLocal();autoDemo()}
      render();
    },()=>{sync="local";col=null;render()});
    render();
  }catch(e){}
}
function save(id,doc){
  if(doc)real[id]=doc;else delete real[id];
  persistLocal();
  const c=fb.on?fb.col:col;
  if(c){(doc?c.doc(id).set(doc):c.doc(id).delete()).catch(()=>{sync="erro";render()})}
  autoDemo();render();
}

/* ---------- Firebase: login e banco de dados (só na versão hospedada) ---------- */
const fbReady=()=>{const c=window.FIREBASE_CONFIG;return !!(window.firebase&&c&&c.apiKey&&!/COLE|SUA_|YOUR_/i.test(c.apiKey))};
function initFirebase(){
  if(!fbReady())return false;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fb.auth=firebase.auth();fb.fs=firebase.firestore();
    try{fb.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    fb.on=true;sync="firebase";
    fb.auth.languageCode="pt-BR";
    try{fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{})}catch(e){}
    const q=new URLSearchParams(location.search);
    if(q.get("mode")==="resetPassword"&&q.get("oobCode")){
      fb.mode="setpass";fb.code=q.get("oobCode");
      fb.auth.verifyPasswordResetCode(fb.code).then(em=>{fb.email=em;fb.codeOk=true;render()}).catch(()=>{fb.mode="login";fb.code="";fb.err="Este link expirou ou já foi usado. Peça um novo link aqui embaixo.";cleanUrl();render()});
    }
    fb.auth.onAuthStateChanged(u=>{
      if(fb.unsub){fb.unsub();fb.unsub=null}
      if(fb.cunsub){fb.cunsub();fb.cunsub=null}
      if(fb.runsub){fb.runsub();fb.runsub=null}
      fb.user=u||null;fb.ready=true;
      if(u){
        fb.col=fb.fs.collection("usuarios").doc(u.uid).collection("progresso");
        let first=true;
        fb.unsub=fb.col.onSnapshot(snap=>{
          const m={};snap.forEach(d=>{m[d.id]=d.data()});
          if(first&&snap.empty&&Object.keys(real).length){Object.entries(real).forEach(([id,v])=>fb.col.doc(id).set(v).catch(()=>{}))}
          else real=m;
          if(first){first=false;sel=curWeek();fb.pReady=true;maybeBackup()}
          persistLocal();autoDemo();sync="firebase";render();
        },err=>{sync="erro";fb.err="Não consegui sincronizar: "+(err.code||err.message);render()});
        const ub=fb.fs.collection("usuarios").doc(u.uid);
        fb.ccol=ub.collection("cartoes");fb.rcol=ub.collection("revlog");
        let cf=true;
        fb.cunsub=fb.ccol.onSnapshot(sn=>{const m={};sn.forEach(d=>{m[d.id]=d.data()});CARDS=m;if(cf){cf=false;fb.cReady=true;maybeBackup()}render()},()=>{fb.cReady=true;maybeBackup()});
        fb.runsub=fb.rcol.onSnapshot(sn=>{const m={};sn.forEach(d=>{m[d.id]=d.data()});REVD=m;render()},()=>{});
      }else{fb.col=null;real={};CARDS={};REVD={};persistLocal()}
      render();
    });
    return true;
  }catch(e){fb.on=false;return false}
}
/* backup automático: um instantâneo por dia, guardado por 30 dias, restaurável na aba Questões */
const bkBase=()=>fb.fs.collection("usuarios").doc(fb.user.uid);
const maybeBackup=()=>{if(fb.pReady&&fb.cReady&&!fb.bkDone){fb.bkDone=true;autoBackup()}};
async function autoBackup(){
  if(!fb.on||!fb.user)return;
  try{
    const base=bkBase(),meta=base.collection("meta").doc("backups"),m=await meta.get();
    let dias=(m.exists&&m.data().dias)||[];fb.bkList=dias.slice();
    const day=ymd(new Date()),n=Object.keys(real).length,payload=JSON.stringify(real),cj=JSON.stringify(CARDS),nc=Object.keys(CARDS).length;
    if((n||nc)&&payload.length<900000&&!dias.includes(day)){
      const bd={dia:day,n,docs:payload};if(nc&&payload.length+cj.length<900000){bd.cartoes=cj;bd.nc=nc}
      await base.collection("backups").doc(day).set(bd);
      dias=dias.concat(day).sort();
      const keep=dias.slice(-30),drop=dias.slice(0,-30);
      await meta.set({dias:keep});
      drop.forEach(d=>base.collection("backups").doc(d).delete().catch(()=>{}));
      fb.bkList=keep;
    }
    render();
  }catch(e){}
}
async function restoreAuto(day){
  try{
    const base=bkBase(),snap=await base.collection("backups").doc(day).get();
    if(!snap.exists)throw new Error("x");

const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();

const ALIAS={REG:["processo legislativo","regimento","regimentos","regimento interno","regimento comum"],LIN:["linguistica"],POR:["portugues","lingua portuguesa"],ADM:["administrativo","administracao publica","direito administrativo"],CON:["constitucional","direito constitucional"],CP:["ciencia politica"],TI:["tecnologia da informacao","informatica","ti e dados","ti"],ASR:["reconhecimento de fala","transcricao","inteligencia artificial","asr","fala e ia"],ING:["ingles","lingua inglesa"]};
function subjectMatch(name){
  const n=norm(name);if(!n)return "";
  let best="",bl=0;
  for(const k of SUBJ){for(const a of ALIAS[k]){const hit=a.length<=3?n===a:(n.includes(a)||a.includes(n)&&n.length>3);if(hit&&a.length>bl){best=k;bl=a.length}}}
  if(best)return best;

  for(const k of SUBJ){const o=toks(MAT[k].n+" "+SHORT[k]).filter(w=>t.has(w)).length;if(o>sc){sc=o;best=k}}
  return best;
}
const candidates=k=>ALL.filter(m=>m.k===k&&(m.t==="teoria_questoes"||m.t==="ingles"));
function metaRank(k,text){
  const q=toks(text),nq=norm(text);
  return candidates(k).map(m=>{
    const hay=new Set(toks(m.a+" "+(m.tp||[]).join(" ")));
    const ov=q.length?q.filter(w=>hay.has(w)).length/q.length:0;
    const sub=nq&&norm(m.a).includes(nq)?1:0;

}

function agg(){

  const addQ=(wi,dt,c,e,b,k,g)=>{const w=a.wk[wi];w.c+=c;w.e+=e;w.b+=b;a.tot.c+=c;a.tot.e+=e;a.tot.b+=b;const q=c+e+b;if(dt&&q)a.day[dt]=(a.day[dt]||0)+q;addT(g,q);if(k&&SUBJ.includes(k)){const s=a.mat[k];s.c+=c;s.e+=e;s.b+=b;const h=a.heat[k][wi];h.c+=c;h.e+=e;h.b+=b}};
  for(const m of ALL){

    w.plan+=pi;w.n++;if(done)w.done++;
    a.tot.metas++;if(done)a.tot.done++;
    addQ(wi,pr&&pr.dt,it.c,it.e,it.b,m.k,m.t==="teoria_questoes"?"Teoria e questões":m.t==="ingles"?"Inglês":grp(m)==="aval"?"Simulados":grp(m)==="dom"?"Domingo":"Reforço e outras");
    if(SUBJ.includes(m.k)){const s=a.mat[m.k];s.plan+=pi;if(m.t==="teoria_questoes"){s.blocks++;if(done)s.done++}}
    if(m.t==="teoria_questoes"){a.content.n++;if(done)a.content.done++}
  }
  for(const id in p){
    const d=p[id];
    if(id.slice(0,4)==="imp-"){(d.rows||[]).forEach(r=>addQ(weekOf(r.dt),r.dt,r.c||0,r.e||0,r.b||0,r.k,"Importadas"));continue}

    const b=BY[id.slice(0,i)];if(!b)continue;

  return a;
}

const scCls=r=>r==null?"na":r>=.75?"hi":r>=.6?"mid":"lo";
function sparkLine(vals,color){
  const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);
  if(pts.length<2)return '<div style="font-size:12px;opacity:.85">Sem histórico ainda</div>';
  const lo=Math.min(...pts.map(p=>p[1]))-5,hi=Math.max(...pts.map(p=>p[1]))+5,n=vals.length-1;
  const X=i=>i/n*100,Y=v=>28-(v-lo)/(hi-lo||1)*26;
  const d=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<div class="spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${X(last[0])} 30 L${X(pts[0][0])} 30Z" fill="${color}" opacity=".18"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span class="pt" style="left:${X(last[0])}%;top:${Y(last[1])/30*100}%"></span></div>`;
}
const tagHtml=m=>SUBJ.includes(m.k)?`<span class="tag" style="--c:${mcolor(m)}"><i></i>${SHORT[m.k]}</span>`:`<span class="tag ring"><i></i>${esc(OTHERN[m.k]||"Meta")}</span>`;
const lsLine=m=>m.ls?`<div class="ls"><b>Lei seca</b><span>${esc(m.ls)}</span></div>`:"";
const npd=p=>p&&p.tl?f1((p.nc||0)-2*(p.ne||0)/p.tl):"–";

/* ---------- semana ---------- */
function weekStats(wi){
  const L=WM[wi];let done=0,part=0,pi=0,fr=0;
  L.forEach(m=>{pi+=planItems(m);const rd=rdone(m),r=rp(m);if(rd>=r)done++;else if(rd>0)part++;fr+=rd/r});
  const x=A.wk[wi];
  return {n:L.length,done,part,pi,fr:L.length?fr/L.length:0,q:x.c+x.e+x.b,c:x.c,e:x.e,b:x.b};
}
function rowHtml(m){
  const rd=rdone(m),r=rp(m),done=rd>=r,it=itemsOf(m),n=tot_(it),rt=rate(it),pr=P()[m.id];
  const bits=[m.i?"cerca de "+m.i+" itens":null,r>1?`${r} repetições`:null].filter(Boolean).join(" · ");
  const mv=m.wi!==ew(m)?`<span class="rb mv">adiada da semana ${m.wi+1}</span>`:"";
  const res=n?`<div class="res"><span class="sc ${scCls(rt)}">${pc(rt)}</span><small>${it.c}/${n}</small></div>`:(m.t==="discursiva"&&pr&&pr.tl?`<div class="res"><span class="sc na">${npd(pr)}</span></div>`:(r>1&&rd?`<div class="res">${rd}/${r}</div>`:""));
  return `<li class="row ${done?"done":rd?"part":""}" data-act="open" data-id="${m.id}" tabindex="0" role="button">
    <button class="chk" data-act="toggle" data-id="${m.id}" aria-label="${done?"Desmarcar":"Concluir"}: ${esc(m.a)}">${CHECK}</button>
    <div class="rt"><div class="t">${esc(m.a)}</div><div class="s">${tagHtml(m)}${bits?`<span>${bits}</span>`:""}${mv}</div>${lsLine(m)}</div>${res}</li>`;
}
const dueTxt=r=>r.late>0?`<span class="late">atrasada há ${r.late} ${r.late===1?"dia":"dias"}</span>`:r.late===0?`<span class="late" style="color:var(--blue)">para hoje</span>`:`em ${-r.late} ${-r.late===1?"dia":"dias"} (${fmtDay(r.due)})`;
function revRow(r){
  const it=r.doc?{c:r.doc.c||0,e:r.doc.e||0,b:r.doc.b||0}:null,n=it?tot_(it):0;
  const res=n?`<div class="res"><span class="sc ${scCls(rate(it))}">${pc(rate(it))}</span><small>${it.c}/${n}</small></div>`:"";
  if(r.rg){
    return `<li class="row ${r.done?"done":""}" data-act="open" data-id="${r.id}" tabindex="0" role="button">
    <button class="chk" data-act="toggle" data-id="${r.id}" aria-label="${r.done?"Desmarcar":"Concluir"} revisão geral da semana ${r.wi+1}">${CHECK}</button>
    <div class="rt"><div class="t">Revisão geral da semana ${r.wi+1}</div><div class="s"><span class="tag ring"><i></i>Todas as matérias</span><span class="rb">Revisão geral</span>${r.done?`<span>feita em ${fmtDay(r.doc.dt)}</span>`:`<span>${dueTxt(r).replace("atrasada","atrasada").replace("para hoje","para hoje (domingo)")}</span>`}</div></div>${res}</li>`;
  }
  const doneC=RL.filter(x=>!x.rg&&x.b.id===r.b.id&&x.done).length;
  const steps=`<span class="steps" aria-label="${doneC} de ${RV.iv.length} revisões feitas">${RV.iv.map((_,i)=>`<i class="${i<doneC?"d":""}"></i>`).join("")}</span>`;
  return `<li class="row ${r.done?"done":""}" data-act="open" data-id="${r.id}" tabindex="0" role="button">
    <button class="chk" data-act="toggle" data-id="${r.id}" aria-label="${r.done?"Desmarcar":"Concluir"} revisão: ${esc(r.b.a)}">${CHECK}</button>
    <div class="rt"><div class="t">${esc(r.b.a)}</div><div class="s">${tagHtml(r.b)}<span class="rb">${RVTXT[r.st].t}</span>${r.done?`<span>feita em ${fmtDay(r.doc.dt)}</span>`:`<span>${dueTxt(r)}</span>`}${steps}</div>${lsLine(r.b)}</div>${res}</li>`;
}
function homeHtml(){
  const w=WK[sel],ws=weekStats(sel),T=today(),cw=A.cw,L=WM[sel];
  const frac=ws.fr, isCur=sel===cw;
  const dayN=Math.max(1,Math.min(7,dday(T,pd(w.i))+1));
  const expect=isCur?dayN/7:(sel<cw?1:0);
  const nxt=L.filter(m=>!isDone(m))[0];
  const dots=L.map(m=>`<span class="dt ${isDone(m)?"d":rdone(m)?"p":""}" style="--c:${mcolor(m)}" data-tip="${esc(m.a)}"></span>`).join("");
  const movedOut=ALL.filter(m=>m.wi===sel&&ew(m)!==sel).length;
  const days=dday(EXAM,T), wkLeft=Math.ceil(days/7);
  const accT=rate(A.tot), accW=rate({c:ws.c,e:ws.e,b:ws.b});
  const accSeries=A.wk.map((x,i)=>i<=cw?rate(x):null);
  const lastDays=[];for(let i=6;i>=0;i--){lastDays.push(A.day[ymd(addDays(T,-i))]||0)}
  const maxDay=Math.max(10,...lastDays);
  const weak=SUBJ.map(k=>({k,r:rate(A.mat[k]),n:tot_(A.mat[k])})).filter(x=>x.n>=10&&x.r!=null).sort((a,b)=>a.r-b.r)[0];
  const lag=A.tot.done-A.planned;
  const nItems=tot_(A.tot);
  const timeF=Math.max(0,Math.min(1,dday(T,START)/Math.max(1,dday(EXAM,START))));
  const open=RL.filter(r=>!r.done), over=open.filter(r=>r.late>0), tod=open.filter(r=>r.late===0), nxt7=open.filter(r=>r.late<0&&r.late>=-7);
  const dueNow=over.length+tod.length, doneRv=RL.filter(r=>r.done).length;
  const grouped={estudo:[],aval:[],dom:[]};
  L.forEach(m=>{if(!onlyPend||!isDone(m))grouped[grp(m)].push(m)});
  const sect=k=>{const Lk=grouped[k],tot=L.filter(m=>grp(m)===k);if(!tot.length)return"";const dn=tot.filter(isDone).length;
    return `<div class="grp"><div class="grp-t"><span>${GTIT[k]}</span><span>${dn}/${tot.length}</span></div>${Lk.length?`<ul class="list">${Lk.map(rowHtml).join("")}</ul>`:`<div class="empty">Tudo concluído aqui.</div>`}</div>`};
  const rgS=sel<lastWk?`<div class="grp"><div class="grp-t"><span>Revisão geral da semana</span><span>${rgItem(sel).done?"1/1":"0/1"}</span></div><ul class="list">${revRow(rgItem(sel))}</ul></div>`:"";
  const pctW=Math.round(frac*100), pctOut=frac<.12, expP=Math.round(expect*100), diff=pctW-expP;
  const ms=[25,50,75,100].map(v=>`<span class="ms ${frac*100>=v-.001?"on":""} ${v===100?"last":""}" style="left:${v}%">${frac*100>=v-.001?"★":v+"%"}</span>`).join("");
  return `
  <section class="hero" aria-label="Progresso da semana">
    <div class="hero-head">
      <div class="wk"><button class="nav" data-act="wk" data-d="-1" aria-label="Semana anterior" ${sel===0?"disabled":""}>‹</button>
        <div><div class="wk-t">Semana ${sel+1}</div><div class="wk-d">${fmtD(w.i,w.f)}${w.fer?` · feriado ${esc(w.fer)}`:""}</div></div>
        <button class="nav" data-act="wk" data-d="1" aria-label="Próxima semana" ${sel===lastWk?"disabled":""}>›</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${!isCur?`<button class="pill blue" data-act="cur">Ir para hoje</button>`:`<span class="pill green">Semana atual</span>`}<span class="pill">${FASE[w.fase]||""}</span></div>
    </div>
    <div class="hero-main">
      <div class="big"><span class="bn">${ws.done}</span><small>de ${ws.n} metas concluídas</small></div>
      <div class="stats">
        <div class="st" style="--c:var(--green)"><span>Concluído</span><b>${pctW}%</b><small>das metas da semana</small></div>
        <div class="st" style="--c:var(--teal)"><span>Questões feitas</span><b>${num(ws.q)}</b><small>${ws.pi?`de cerca de ${num(ws.pi)} previstas`:"nesta semana"}</small></div>
        <div class="st" style="--c:var(--blue)"><span>Desempenho</span><b>${pc(accW)}</b><small>de acertos na semana</small></div>
      </div>
    </div>
    <div class="xp" role="progressbar" aria-valuenow="${pctW}" aria-valuemin="0" aria-valuemax="100" aria-label="Metas concluídas na semana">
      ${isCur&&expect<1?`<div class="xp-flag" style="left:${expect*100}%">esperado hoje</div>`:""}
      <div class="xp-track"><div class="xp-fill ${frac>=1?"done":""}" style="width:${Math.max(0,Math.min(100,frac*100))}%">${frac>0?`<span class="xp-pct ${pctOut?"out":""}">${pctW}%</span>`:""}</div>
        ${[25,50,75].map(v=>`<i class="xp-tick" style="left:${v}%"></i>`).join("")}</div>
      <div class="xp-ms">${ms}</div>
    </div>
    ${isCur&&expect<1&&!fb.on?`<p class="xp-cap">O traço "esperado hoje" mostra onde você estaria se concluísse o mesmo tanto de metas a cada dia: hoje é o dia ${dayN} de 7, então ${expP}%. Você está em ${pctW}%${diff>0?`, ${diff} pontos à frente`:diff<0?`, ${-diff} pontos atrás`:", exatamente no ritmo"}.</p>`:""}
    ${nxt?`<button class="next" data-act="open" data-id="${nxt.id}"><div class="grow"><div class="l">Próxima meta</div><div class="t">${esc(nxt.a)}</div>${nxt.ls?`<div class="muted" style="font-size:13px;margin-top:2px">Lei seca: ${esc(nxt.ls)}</div>`:""}</div></button>`:`<div class="next" style="cursor:default"><div class="grow"><div class="l">Semana</div><div class="t">Todas as metas concluídas.</div></div></div>`}
  </section>

  <section class="kpis" aria-label="Indicadores">
    <div class="kpi blue"><div class="lab">Desempenho</div><div class="num">${pc(accT)}</div>
      <div class="sub">${nItems?`${num(A.tot.c)} acertos em ${num(nItems)} questões`:"Registre suas questões"}</div>
      <div class="viz">${sparkLine(accSeries.map(v=>v==null?null:v*100),"#fff")}</div></div>
    <div class="kpi teal"><div class="lab">Questões feitas</div><div class="num">${num(nItems)}</div>
      <div class="sub">${num(ws.q)} na semana ${sel+1}</div>
      <div class="viz"><div class="sbars" aria-label="Questões por dia, últimos 7 dias">${lastDays.map(v=>`<span class="${v?"":"z"}" style="height:${v?Math.max(8,v/maxDay*100):10}%" data-tip="${v} questões"></span>`).join("")}</div></div></div>
    <div class="kpi purple"><div class="lab">Edital visto</div>
      <div class="num">${A.content.n?Math.round(A.content.done/A.content.n*100):0}<small>%</small></div>
      <div class="sub">${A.content.done} de ${A.content.n} assuntos · só estudo novo</div>
      <div class="viz"><div class="bar2"><i style="width:${A.content.n?A.content.done/A.content.n*100:0}%"></i></div></div></div>
    <div class="kpi orange"><div class="lab">Dias até a prova</div><div class="num">${Math.max(0,days)}</div>
      <div class="sub">${fmtDay(D.prova)} de ${EXAM.getFullYear()} · ${wkLeft} semanas</div>
      <div class="viz"><div class="bar2"><i style="width:${timeF*100}%"></i></div></div></div>
    <div class="kpi ${lag>=0?"green":"red"}"><div class="lab">Ritmo</div><div class="num">${lag>=0?(lag===0?"Em dia":"+"+lag):lag}<small>${lag===0?"":"metas"}</small></div>
      <div class="sub">${A.tot.done} concluídas · ${A.planned} previstas até hoje</div>
      <div class="viz"><div class="bar2"><i style="width:${A.planned?Math.min(100,A.tot.done/A.planned*100):0}%"></i></div></div></div>
    <div class="kpi indigo"><div class="lab">Caderno de erros</div><div class="num">${num(A.tot.e)}</div>
      <div class="sub">questões erradas no total · ${num(A.wk[sel].e)} na semana ${sel+1}</div>
      <div class="viz"><div class="bar2"><i style="width:${nItems?A.tot.e/nItems*100:0}%"></i></div></div></div>
    <button class="kpi ${over.length?"red":"slate"}" data-act="tab" data-v="revisoes"><div class="lab">Revisões</div><div class="num">${dueNow}<small>para hoje</small></div>
      <div class="sub">${over.length} atrasadas · ${nxt7.length} nos próximos 7 dias</div>
      <div class="viz"><div class="bar2"><i style="width:${RL.length?doneRv/RL.length*100:0}%"></i></div></div></button>
    <div class="kpi pink"><div class="lab">Ponto de atenção</div>
      <div class="num" style="font-size:24px;line-height:1.2">${weak?SHORT[weak.k]:"Sem dados"}</div>
      <div class="sub">${weak?`${pc(weak.r)} de acertos em ${num(weak.n)} questões`:"Aparece após 10 questões por matéria"}</div>
      <div class="viz">${weak?`<div class="bar2"><i style="width:${weak.r*100}%"></i></div>`:""}</div></div>
  </section>

  <section class="sec" aria-label="Panorama da semana">
    <div class="sec-h"><h2>Panorama da semana</h2><span class="muted" style="font-size:13px">Um quadrado por meta: cheio é concluída, metade é em andamento</span></div>
    <div class="dots">${dots}</div>
    ${movedOut?`<p class="muted" style="font-size:13px;margin:10px 0 0">${movedOut} ${movedOut===1?"meta foi adiada":"metas foram adiadas"} para outra semana.</p>`:""}
    ${w.obs?`<div class="banner">${esc(w.obs)}</div>`:""}

  <section class="sec" aria-label="Revisões de hoje">

  </section>

}

/* ---------- revisões ---------- */
function revHtml(){
  const open=RL.filter(r=>!r.done).sort((a,b)=>a.due-b.due);
  const over=open.filter(r=>r.late>0), tod=open.filter(r=>r.late===0), nxt7=open.filter(r=>r.late<0&&r.late>=-7), later=open.filter(r=>r.late<-7);

}

/* ---------- simulados ---------- */

  const dn=rows.filter(x=>x.d&&x.n);

  const best=dn.length?Math.max(...dn.map(x=>rate(x.it))):null;
  const ddn=DISCS.filter(m=>{const p=P()[m.id];return p&&p.tl});
  return `
  <section class="sec" style="margin-top:20px"><h2>Simulados</h2>

      <div class="kpi purple"><div class="lab">Nota líquida média</div><div class="num">${pc(net(tot))}</div><div class="sub">certos menos errados, sobre o total de itens</div></div>
      <div class="kpi orange"><div class="lab">Melhor simulado</div><div class="num">${pc(best)}</div><div class="sub">${dn.length?"maior acerto até agora":"Registre o primeiro"}</div></div>
    </div>
  </section>
  <section class="sec"><div class="card"><div class="card-h"><div><h3>Evolução dos simulados</h3><p>Acerto e nota líquida, em % dos itens</p></div><div class="legend"><span style="--c:var(--blue)"><i></i>Acerto</span><span style="--c:var(--purple)"><i></i>Nota líquida</span></div></div><div class="chart" data-kind="sims"></div></div></section>
  <section class="sec"><div class="sec-h"><h2>Todos os simulados</h2><span class="muted" style="font-size:13px">Toque para ver como montar e registrar</span></div>
    <ul class="list" style="border-top:2px solid var(--fg)">${rows.map(x=>{const m=x.m,r=rate(x.it),l=net(x.it);return `<li class="row ${x.d?"done":""}" data-act="open" data-id="${m.id}" tabindex="0" role="button"><button class="chk" data-act="toggle" data-id="${m.id}" aria-label="${x.d?"Desmarcar":"Concluir"}: ${esc(m.a)}">${CHECK}</button><div class="rt"><div class="t">${esc(m.a)}</div><div class="s"><span>Semana ${m.wi+1} · ${fmtD(WK[m.wi].i,WK[m.wi].f)}</span></div></div>${x.n?`<div class="res"><span class="sc ${scCls(r)}">${pc(r)}</span><small>líquida ${pc(l)}</small></div>`:""}</li>`}).join("")}</ul>

/* leitura do baralho (texto colado ou planilha) */
function mkCard(mat,ass,bar,tipoRaw,f,v,x,ref){
  const t0=String(tipoRaw||"").toUpperCase().replace(/[^A-Z]/g,"");
  const t=t0==="P"||t0==="PERGUNTA"?"P":t0==="L"||t0==="LACUNA"?"L":(t0==="CE"||t0==="C"||t0==="VF"||t0==="CERTOERRADO")?"CE":"";
  if(!t)return {err:`${ref}: tipo "${String(tipoRaw||"").slice(0,12)}" não reconhecido. Use P, L ou CE.`};
  f=String(f||"").trim();v=String(v||"").trim();x=String(x||"").trim();
  if(!f)return {err:`${ref}: falta o texto do cartão.`};
  if(t==="P"&&!v)return {err:`${ref}: falta a resposta.`};
  if(t==="L"&&!/\{\{[^}]+\}\}/.test(f))return {err:`${ref}: a lacuna precisa estar entre {{ e }}.`};
  if(t==="CE"){const a=norm(v).charAt(0);if(a==="c")v="C";else if(a==="e")v="E";else return {err:`${ref}: a resposta de Certo ou Errado deve ser C ou E.`}}
  return {card:{mat,ass,bar,t,f,v,x}};
}
function parseDeckText(text){
  const cards=[],errs=[];let mat="",ass="",bar="";
  String(text).split(/\r?\n/).forEach((raw,i)=>{
    const ln=raw.trim();if(!ln||/^```/.test(ln))return;
    const m=/^#\s*(mat[eé]ria|assunto|baralho)\s*:\s*(.*)$/i.exec(ln);
    if(m){const k=norm(m[1]);if(k.indexOf("mat")===0)mat=m[2].trim();else if(k==="assunto")ass=m[2].trim();else bar=m[2].trim();return}
    if(ln.charAt(0)==="#")return;
    const p=ln.split("|").map(z=>z.trim());
    const r=mkCard(mat,ass,bar,p[0],p[1],p[2],p[3],"Linha "+(i+1));
    if(r.err)errs.push(r.err);else cards.push(r.card);
  });
  return {cards,errs};
}
const AKH={mat:["materia","disciplina"],ass:["assunto","topico","tema"],bar:["baralho","deck"],t:["tipo"],f:["frente","pergunta","front"],v:["verso","resposta","back"],x:["explicacao","fonte","extra","comentario"]};
function parseDeckSheet(aoa){
  let hi=-1,cm={};
  for(let r=0;r<Math.min(aoa.length,10)&&hi<0;r++){const m={};aoa[r].forEach((h,ci)=>{const n=norm(h);for(const k in AKH){if(m[k]==null&&AKH[k].includes(n))m[k]=ci}});if(m.f!=null&&m.t!=null){hi=r;cm=m}}
  if(hi<0)return {cards:[],errs:["Não encontrei os cabeçalhos. A planilha precisa ter as colunas Tipo e Frente (e, se quiser, Matéria, Assunto, Baralho, Verso e Explicação)."]};
  const cards=[],errs=[];
  for(let r=hi+1;r<aoa.length;r++){const row=aoa[r],g=k=>cm[k]!=null?row[cm[k]]:"";if(!String(g("f")).trim()&&!String(g("t")).trim())continue;
    const x=mkCard(String(g("mat")||"").trim(),String(g("ass")||"").trim(),String(g("bar")||"").trim(),g("t"),g("f"),g("v"),g("x"),"Linha "+(r+1));
    if(x.err)errs.push(x.err);else cards.push(x.card)}
  return {cards,errs};
}
function akPrepare(res,name){
  ak.errs=res.errs.slice(0,12);ak.err="";ak.msg="";ak.name=name;
  const gm={},groups=[];
  res.cards.forEach(c=>{const key=norm(c.mat)+"|"+norm(c.ass)+"|"+norm(c.bar);let g=gm[key];if(!g){const k=subjectMatch(c.mat),rk=k?metaRank(k,c.ass):[];g=gm[key]={mat:c.mat,ass:c.ass,bar:c.bar,k,mid:rk[0]&&rk[0].score>=.4?rk[0].m.id:"",n:0};groups.push(g)}g.n++;c.g=groups.indexOf(g)});
  ak.groups=groups;ak.cards=res.cards;
  if(!res.cards.length&&!ak.errs.length)ak.err="Não encontrei nenhum cartão no texto.";
}
function akReadText(){const ta=$("#ak-paste");ak.paste=ta?ta.value:ak.paste;akPrepare(parseDeckText(ak.paste),"texto colado");render()}
function akReadFile(file){
  const isCsv=/\.(csv|txt|tsv)$/i.test(file.name),rd=new FileReader();
  rd.onload=ev=>{
    try{
      if(/\.(txt)$/i.test(file.name)){akPrepare(parseDeckText(String(ev.target.result)),file.name)}
      else{
        if(!window.XLSX)throw new Error("Não consegui carregar o leitor de planilhas. Recarregue a página.");
        const wb=isCsv?XLSX.read(String(ev.target.result).replace(/^﻿/,""),{type:"string"}):XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
        akPrepare(parseDeckSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""})),file.name);
      }
    }catch(er){ak.groups=[];ak.cards=[];ak.errs=[];ak.err=er.message||"Não consegui ler o arquivo."}
    render();
  };
  if(isCsv||/\.txt$/i.test(file.name))rd.readAsText(file,"UTF-8");else rd.readAsArrayBuffer(file);
}
function akImport(){
  const list=[],seen=new Set();let skipped=0,dup=0;
  ak.cards.forEach(c=>{
    const g=ak.groups[c.g];if(!g||!g.k){skipped++;return}
    const id=cardId(g.k,c.f);if(CARDS[id]||seen.has(id)){dup++;return}seen.add(id);
    const nm=g.bar||g.ass||SHORT[g.k];
    list.push([id,{k:g.k,mid:g.mid||"",as:g.ass||"",b:nm,t:c.t,f:c.f,v:c.v,x:c.x,cr:T0(),reps:0,ivl:0,ez:2.5,lap:0,ok:0,er:0,due:"",ult:"",last:0}]);
  });
  if(list.length)cardsWrite(list);
  ak.msg=`Importei ${list.length} ${list.length===1?"cartão":"cartões"}.${dup?` ${dup} já existiam e foram ignorados.`:""}${skipped?` ${skipped} ficaram de fora por falta de matéria.`:""}`;
  ak.groups=[];ak.cards=[];ak.errs=[];ak.paste="";ak.err="";render();
}

/* repetição espaçada (tipo Anki): Errei, Difícil, Bom, Fácil */
function srsApply(c,g){
  const T=today(),maxI=Math.max(1,dday(EXAM,T)-1);
  if(g===1){c.lap=(c.lap||0)+1;c.er=(c.er||0)+1;c.ez=Math.max(1.3,(c.ez||2.5)-.2);c.ivl=0;c.reps=Math.max(c.reps||0,1);c.due=ymd(T)}
  else{
    c.ok=(c.ok||0)+1;
    if(!c.ivl){c.ivl=g===4?4:1}
    else if(g===2){c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*1.2));c.ez=Math.max(1.3,c.ez-.15)}
    else if(g===3){c.ivl=c.reps<=1?Math.max(3,c.ivl+1):Math.max(c.ivl+1,Math.round(c.ivl*c.ez))}
    else{c.ivl=Math.max(c.ivl+1,Math.round(c.ivl*c.ez*1.3));c.ez=c.ez+.15}
    c.ivl=Math.min(c.ivl,maxI);c.reps=(c.reps||0)+1;c.due=ymd(addDays(T,c.ivl));
  }
  c.ult=ymd(T);c.last=g;return c;
}
const srsPreview=(c,g)=>g===1?"hoje":ivTxt(srsApply({...c},g).ivl);

function akPool(){return Object.entries(CARDS).map(([id,c])=>({id,...c})).filter(c=>(!ak.mat||c.k===ak.mat)&&(!ak.mid||c.mid===ak.mid)&&(!ak.bar||c.b===ak.bar)&&(!ak.tipo||c.t===ak.tipo))}
function akBuild(m){
  const T=T0(),p=akPool();
  if(m==="hoje"){const v=p.filter(c=>c.ult&&c.due<=T),nv=Math.max(0,AKNOV()-((REVD[T]||{}).nv||0));return [...shuf(v),...shuf(p.filter(c=>!c.ult)).slice(0,nv)]}
  if(m==="erros")return p.filter(c=>c.ult&&(c.lap>0||c.last===1)).sort((a,b)=>b.lap-a.lap).slice(0,40);
  if(m==="acertos")return shuf(p.filter(c=>c.ult&&c.last>=3)).slice(0,30);
  if(m==="dificeis")return p.filter(c=>c.ult&&(c.ez<2.2||c.lap>=2)).sort((a,b)=>a.ez-b.ez).slice(0,40);
  if(m==="novos")return shuf(p.filter(c=>!c.ult)).slice(0,AKNOV());
  if(m==="aleatorio")return shuf(p).slice(0,25);
  return shuf(p).slice(0,100);
}
function akStart(){
  const q=akBuild(ak.modo);
  if(!q.length){ak.err="Nenhum cartão encontrado com esses filtros. Troque o modo ou os filtros.";render();return}
  ak.err="";ak.msg="";ak.queue=q.map(c=>c.id);ak.i=0;ak.rev=false;ak.pick="";ak.ses={n:0,ok:0,er:0};ak.view="session";render();window.scrollTo(0,0);
}
function akAnswer(g){
  const id=ak.queue[ak.i];if(!CARDS[id])return;
  const c={...CARDS[id]},isNew=!c.ult;
  srsApply(c,g);cardsWrite([[id,c]]);
  const T=T0(),r=REVD[T]?JSON.parse(JSON.stringify(REVD[T])):{n:0,ok:0,er:0,nv:0,k:{}};
  r.n++;if(g>1)r.ok++;else r.er++;if(isNew)r.nv=(r.nv||0)+1;
  r.k=r.k||{};const kx=r.k[c.k]||[0,0];kx[0]++;if(g>1)kx[1]++;r.k[c.k]=kx;revdWrite(T,r);
  ak.ses.n++;if(g>1)ak.ses.ok++;else ak.ses.er++;
  if(g===1)ak.queue.splice(Math.min(ak.queue.length,ak.i+4),0,id);
  ak.i++;ak.rev=false;ak.pick="";render();window.scrollTo(0,0);
}
const lacF=t=>esc(t).replace(/\{\{(?:c\d+::)?([^}]*?)(?:::[^}]*)?\}\}/g,'<span class="blank">[…]</span>');
const lacV=t=>esc(t).replace(/\{\{(?:c\d+::)?([^}]*?)(?:::[^}]*)?\}\}/g,'<mark>$1</mark>');

function akStats(){
  const T=T0(),o={n:0,due:0,nov:0,ok:0,er:0,dueDay:Array(14).fill(0),est:{novo:0,apr:0,jov:0,mad:0},byK:{},byA:{},byB:{}};
  Object.entries(CARDS).forEach(([id,c])=>{
    o.n++;const isNew=!c.ult;
    const kk=o.byK[c.k]||(o.byK[c.k]={n:0,ok:0,er:0,lap:0});kk.n++;kk.ok+=c.ok||0;kk.er+=c.er||0;kk.lap+=c.lap||0;
    const ak_=c.mid||("t:"+norm(c.as||c.b||""));const aa=o.byA[ak_]||(o.byA[ak_]={mid:c.mid,k:c.k,nome:c.mid&&BY[c.mid]?BY[c.mid].a:(c.as||c.b||"Sem assunto"),n:0,ok:0,er:0,lap:0});aa.n++;aa.ok+=c.ok||0;aa.er+=c.er||0;aa.lap+=c.lap||0;
    const bb=o.byB[c.b]||(o.byB[c.b]={n:0,due:0,k:c.k});bb.n++;
    o.ok+=c.ok||0;o.er+=c.er||0;
    if(isNew){o.nov++;o.est.novo++;return}
    if(c.due<=T){o.due++;bb.due++}
    const dd=Math.max(0,dday(pd(c.due),pd(T)));if(dd<14)o.dueDay[dd]++;
    if(c.ivl>=21)o.est.mad++;else if(c.ivl>=7)o.est.jov++;else o.est.apr++;
  });
  return o;
}
let AKS=null;
function akSession(){
  const id=ak.queue[ak.i],tot=ak.queue.length;

  weak.sort((a,b)=>a.r-b.r);
  const W=weak.slice(0,6);
  const cards=SUBJ.map(k=>{
    const s=A.mat[k],r=rate(s),nn=tot_(s),open=!!openMat[k];

/* ---------- gráficos SVG ---------- */
const NS=(w,h,aria)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}">`;
function cols(el,bars,o){
  const w=el.clientWidth||320,h=o.h||190,pl=38,pr=4,pt=10,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=bars.length,st=iw/n,bw=Math.min(26,st*.64);
  const mx=o.max,Y=v=>pt+ih-ih*Math.min(v,mx)/mx;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  const rr=(x,y,w_,h_)=>{const r=Math.min(5,w_/2,h_);return `M${x},${y+h_}V${y+r}Q${x},${y} ${x+r},${y}H${x+w_-r}Q${x+w_},${y} ${x+w_},${y+r}V${y+h_}Z`};
  bars.forEach((b,i)=>{
    const x=pl+st*i+(st-bw)/2;
    if(b.g!=null&&b.g>0)s+=`<path d="${rr(x,Y(b.g),bw,ih-(Y(b.g)-pt))}" fill="var(--soft2)"/>`;
    if(b.v>0)s+=`<path d="${rr(x,Y(b.v),bw,ih-(Y(b.v)-pt))}" fill="${b.c||"var(--blue)"}"/>`;
    s+=`<text x="${x+bw/2}" y="${h-7}" text-anchor="middle" ${b.hi?'class="em"':""}>${b.l}</text>`;
    s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(b.t)}"/>`;
  });
  s+=`<line x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--soft2)" stroke-width="1"/></svg>`;
  el.innerHTML=s;
}
function lines(el,labels,series,o){
  const w=el.clientWidth||320,h=o.h||190,pl=38,pr=14,pt=14,pb=24,iw=w-pl-pr,ih=h-pt-pb,n=labels.length,st=iw/n;
  const X=i=>pl+st*(i+.5),Y=v=>pt+ih-ih*Math.max(0,Math.min(v,o.max))/o.max;
  let s=NS(w,h,o.aria);
  o.ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pl-7}" y="${Y(t)+4}" text-anchor="end">${o.tf?o.tf(t):t}</text>`});
  labels.forEach((l,i)=>{s+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle" ${o.hi===i?'class="em"':""}>${l}</text>`});
  series.forEach(se=>{
    let d="",open=false,last=null,first=null;
    se.vals.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);open=true;last=i;if(first==null)first=i});
    if(!d)return;
    if(se.fill&&last!=null)s+=`<path d="${d} L${X(last)} ${pt+ih} L${X(first)} ${pt+ih}Z" fill="${se.color}" opacity=".12"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.5}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 5"':""}/>`;
    if(se.dots)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${se.color}" stroke="var(--bg)" stroke-width="2"/>`});
    if(last!=null&&se.end){s+=`<circle cx="${X(last)}" cy="${Y(se.vals[last])}" r="5.5" fill="${se.color}" stroke="var(--bg)" stroke-width="2.5"/><text class="em" x="${Math.min(X(last),w-pr-12)}" y="${Y(se.vals[last])-12}" text-anchor="middle">${se.end(se.vals[last])}</text>`}
  });
  labels.forEach((l,i)=>{s+=`<rect x="${pl+st*i}" y="${pt}" width="${st}" height="${ih}" fill="transparent" data-tip="${esc(o.tip(i))}"/>`});
  s+="</svg>";el.innerHTML=s;
}
function drawCharts(){
  document.querySelectorAll(".chart").forEach(el=>{
    const k=el.dataset.kind,cw=A.cw,T=today();
    if(k==="weekQ"){
      const bars=WK.map((w,i)=>{const x=A.wk[i],q=x.c+x.e+x.b;return {l:i+1,v:i<=cw?q:0,g:x.plan,hi:i===sel,t:`Semana ${i+1}: ${q} feitas, ${x.plan} previstas`}});
      const m=Math.max(100,Math.ceil(Math.max(...bars.map(b=>Math.max(b.v,b.g)))/100)*100);
      cols(el,bars,{max:m,ticks:[0,m/2,m],aria:"Questões por semana"});
    }else if(k==="cumQ"){
      let p=0,r=0;const plan=[],real=[];
      WK.forEach((w,i)=>{p+=A.wk[i].plan;plan.push(p);r+=A.wk[i].c+A.wk[i].e+A.wk[i].b;real.push(i<=cw?r:null)});
      const mx=Math.max(500,Math.ceil(Math.max(p,r)/500)*500);
      lines(el,WK.map((w,i)=>i+1),[{vals:plan,color:"var(--fg3)",dash:true,w:2},{vals:real,color:"var(--blue)",fill:true,end:v=>num(v)}],{max:mx,ticks:[0,mx/2,mx],hi:sel,aria:"Questões acumuladas contra o previsto",tip:i=>`Até a semana ${i+1}: previstas ${num(plan[i])}${real[i]!=null?` · feitas ${num(real[i])}`:""}`});
    }else if(k==="accWeek"){
      const v=WK.map((w,i)=>{const r=rate(A.wk[i]);return r==null?null:r*100});
      lines(el,WK.map((w,i)=>i+1),[{vals:v,color:"var(--blue)",fill:true,dots:true,end:x=>Math.round(x)+"%"}],{max:100,ticks:[0,25,50,75,100],tf:t=>t+"%",hi:sel,aria:"Desempenho por semana",tip:i=>{const x=A.wk[i],n=x.c+x.e+x.b;return n?`Semana ${i+1}: ${pc(rate(x))} em ${n} questões`:`Semana ${i+1}: sem questões`}});
    }else if(k==="dayQ"){
      const bars=[];for(let i=13;i>=0;i--){const d=addDays(T,-i),key=ymd(d),v=A.day[key]||0;bars.push({l:d.getDate(),v,hi:i===0,t:`${fmtDay(key)}: ${v} questões`})}
      const m=Math.max(20,Math.ceil(Math.max(...bars.map(b=>b.v))/20)*20);
      cols(el,bars,{max:m,ticks:[0,m/2,m],aria:"Questões por dia"});
    }else if(k==="akDue"&&AKS){
      const bars=AKS.dueDay.map((v,i)=>{const d=addDays(T,i);return {l:d.getDate(),v,hi:i===0,t:`${fmtDay(d)}: ${v} cartões`}});
      const m=Math.max(10,Math.ceil(Math.max(...bars.map(b=>b.v))/10)*10);
      cols(el,bars,{max:m,ticks:[0,m/2,m],aria:"Cartões a vencer"});
    }else if(k==="akDay"){
      const bars=[];for(let i=13;i>=0;i--){const d=addDays(T,-i),key=ymd(d),v=(REVD[key]||{}).n||0;bars.push({l:d.getDate(),v,hi:i===0,t:`${fmtDay(key)}: ${v} respostas`})}
      const m=Math.max(10,Math.ceil(Math.max(...bars.map(b=>b.v))/10)*10);
      cols(el,bars,{max:m,ticks:[0,m/2,m],aria:"Respostas por dia"});
    }else if(k==="sims"){
      const acc=SIMS.map(m=>{const it=itemsOf(m),r=isDone(m)?rate(it):null;return r==null?null:r*100});
      const nl=SIMS.map(m=>{const it=itemsOf(m),r=isDone(m)?net(it):null;return r==null?null:r*100});
      lines(el,SIMS.map((m,i)=>i+1),[{vals:acc,color:"var(--blue)",dots:true,end:x=>Math.round(x)+"%"},{vals:nl,color:"var(--purple)",dots:true}],{max:100,ticks:[0,25,50,75,100],tf:t=>t+"%",aria:"Evolução dos simulados",tip:i=>{const it=itemsOf(SIMS[i]);return isDone(SIMS[i])?`Simulado ${i+1}: acerto ${pc(rate(it))}, líquida ${pc(net(it))}`:`Simulado ${i+1}: pendente`}});
    }
  });
}

function liveUpd(){
  const a=$("#lv-a");
  if(a){const n=draft.c+draft.e+draft.b;a.textContent=n?Math.round(draft.c/n*100)+"%":"–";$("#lv-l").textContent=n?Math.round((draft.c-draft.e)/n*100)+"%":"–";$("#lv-n").textContent=n}
  const d=$("#lv-d");if(d)d.textContent=draft.tl?f1((draft.nc||0)-2*(draft.ne||0)/draft.tl):"–";
}
function closeSheet(){sheetId=null;$("#sheet").innerHTML=""}
function empty_(d){return !(d.r||0)&&!d.c&&!d.e&&!d.b&&d.nc==null&&d.ne==null&&d.tl==null&&d.mw==null}
function sheetSave(){
  const m=getM(sheetId);if(!m)return;
  const old=P()[sheetId]||{};
  const r=rp(m),done=r===1?($("#f-done").getAttribute("aria-checked")==="true"?1:0):Math.min(r,draft.r);
  const doc={r:done};
  if(tot_(draft)){doc.c=draft.c;doc.e=draft.e;doc.b=draft.b}
  if(draft.nc!=null)doc.nc=draft.nc;if(draft.ne!=null)doc.ne=draft.ne;if(draft.tl!=null)doc.tl=draft.tl;
  if(old.mw!=null)doc.mw=old.mw;
  if(done||tot_(draft)||draft.nc!=null||draft.tl!=null)doc.dt=draft.dt||ymd(new Date());
  if(empty_(doc)){save(sheetId,null)}else save(sheetId,doc);
  closeSheet();
}
function toggle(id){
  if(demo)return openSheet(id);
  const m=getM(id),p=real[id];if(!m)return;
  if(isDone(m)){const d={...p,r:0};if(empty_(d)){save(id,null)}else{save(id,d)}return}
  save(id,{...(p||{}),r:rp(m),dt:(p&&p.dt)||ymd(new Date())});
}
function moveTo(id,wi){
  const m=getM(id);if(!m||demo)return;
  const d={...(real[id]||{})};d.r=d.r||0;
  if(wi===m.wi)delete d.mw;else d.mw=wi;
  if(empty_(d))save(id,null);else save(id,d);
  closeSheet();
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-s]");
  if(s&&sheetId){const k=s.dataset.s,d=+s.dataset.d,inp=$("#f-"+k);let v=(draft[k]||0)+d;v=Math.max(0,v);if(k==="r")v=Math.min(rp(getM(sheetId)),v);draft[k]=v;inp.value=v;liveUpd();return}
  const sw=e.target.closest("#f-done");
  if(sw&&!sw.disabled){sw.setAttribute("aria-checked",sw.getAttribute("aria-checked")==="true"?"false":"true");return}
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const a=t.dataset.act;
  if(a==="close"){if(e.target===t)closeSheet();return}
  if(a==="toggle"){e.stopPropagation();toggle(t.dataset.id);return}
  if(a==="open"){openSheet(t.dataset.id);return}
  if(a==="tab"){tab=t.dataset.v;render();window.scrollTo(0,0);return}
  if(a==="wk"){sel=Math.max(0,Math.min(lastWk,sel+ +t.dataset.d));render();return}
  if(a==="cur"){sel=curWeek();render();return}
  if(a==="only"){onlyPend=!onlyPend;render();return}
  if(a==="plan"){sel=+t.dataset.i;tab="semana";render();window.scrollTo(0,0);return}
  if(a==="mat"){const k=t.dataset.k;openMat[k]=!openMat[k];render();return}
  if(a==="demo"){demo=!demo;demoChosen=demo;LS.set("painel-demo",demo?"1":"0");if(demo&&!Object.keys(DEMO).length)DEMO=genDemo();sel=curWeek();render();return}
  if(a==="save"){sheetSave();return}
  if(a==="clear"){save(sheetId,null);closeSheet();return}
  if(a==="move"){moveTo(sheetId,+t.dataset.w);return}
  if(a==="movesel"){moveTo(sheetId,+$("#f-mw").value);return}
  if(a==="template"){downloadTemplate();return}
  if(a==="cancelimp"){imp.rows=[];imp.err="";render();return}
  if(a==="doimport"){doImport();return}
  if(a==="undoimp"){save(t.dataset.id,null);return}
  if(a==="login"){doLogin();return}
  if(a==="reset"){doReset();return}
  if(a==="setpass"){doSetPass();return}
  if(a==="ak-modo"){ak.modo=t.dataset.m;ak.err="";render();return}
  if(a==="ak-start"){akStart();return}
  if(a==="ak-quit"){ak.view="home";render();window.scrollTo(0,0);return}
  if(a==="ak-show"){ak.rev=true;render();return}
  if(a==="ak-pick"){ak.pick=t.dataset.v;ak.rev=true;render();return}
  if(a==="ak-grade"){akAnswer(+t.dataset.g);return}
  if(a==="ak-read"){akReadText();return}
  if(a==="ak-import"){akImport();return}
  if(a==="ak-cancel"){ak.groups=[];ak.cards=[];ak.errs=[];ak.err="";ak.paste="";render();return}
  if(a==="ak-copy"){akCopy();return}
  if(a==="ak-deck"){ak.bar=t.dataset.b;ak.mat="";ak.mid="";ak.tipo="";ak.modo="hoje";akStart();return}
  if(a==="ak-weak"){const m=BY[t.dataset.mid];ak.mid=t.dataset.mid;ak.mat=m?m.k:"";ak.bar="";ak.tipo="";ak.modo="tudo";akStart();return}
  if(a==="ak-delask"){ak.ask=t.dataset.b;render();return}
  if(a==="ak-delno"){ak.ask="";render();return}
  if(a==="ak-delok"){const b=t.dataset.b;cardsWrite(Object.entries(CARDS).filter(([id,c])=>c.b===b).map(([id])=>[id,null]));ak.ask="";if(ak.bar===b)ak.bar="";ak.msg=`Excluí o baralho "${b}".`;render();return}
  if(a==="bkask"){fb.bkAsk=t.dataset.d;fb.bkMsg="";render();return}
  if(a==="bkno"){fb.bkAsk="";render();return}
  if(a==="bkgo"){restoreAuto(t.dataset.d);return}
  if(a==="backup"){exportBackup();return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="ak-paste"){ak.paste=e.target.value;return}
  const i=e.target.closest("[data-f]");if(!i)return;
  const k=i.dataset.f,v=i.value.replace(",",".");
  if(k==="nc")draft.nc=v===""?null:Math.max(0,parseFloat(v)||0);
  else if(k==="ne"||k==="tl")draft[k]=v===""?null:Math.max(0,parseInt(v,10)||0);
  else draft[k]=i.value===""?0:Math.max(0,parseInt(i.value,10)||0);
  liveUpd();
});
document.addEventListener("change",e=>{
  const akf=e.target.closest("#ak-file");
  if(akf&&akf.files&&akf.files[0]){ak.msg="";akReadFile(akf.files[0]);return}
  const aks=e.target.closest("[data-ak]");
  if(aks){const k=aks.dataset.ak;
    if(k==="nov"){LS.set("painel-novos",aks.value);render();return}
    ak[k]=aks.value;if(k==="mat")ak.mid="";ak.err="";render();return}
  const akg=e.target.closest("[data-akg]");
  if(akg){const g=ak.groups[+akg.dataset.i];if(g){if(akg.dataset.akg==="k"){g.k=akg.value;const rk=g.k?metaRank(g.k,g.ass):[];g.mid=rk[0]&&rk[0].score>=.4?rk[0].m.id:""}else g.mid=akg.value;render()}return}
  const bk=e.target.closest("#bk-file");
  if(bk&&bk.files&&bk.files[0]){restoreBackup(bk.files[0]);return}
  const f=e.target.closest("#imp-file");
  if(f&&f.files&&f.files[0]){imp.err="";imp.msg="";readFile(f.files[0]);return}
  const sl=e.target.closest("[data-imp]");
  if(sl){const r=imp.rows[+sl.dataset.i];if(!r)return;
    if(sl.dataset.imp==="k"){r.k=sl.value;const rk=r.k?metaRank(r.k,r.ass):[];r.mid=rk[0]&&rk[0].score>=.4?rk[0].m.id:""}
    else r.mid=sl.value;
    render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id&&e.target.id.indexOf("lg-")===0){e.preventDefault();if(e.target.id.indexOf("lg-new")===0)doSetPass();else doLogin();return}
  if(e.key==="Escape"&&sheetId)closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("row")){e.preventDefault();openSheet(e.target.dataset.id)}
});
const tip=$("#tip");let tipT=null;
function showTip(t,x,y){tip.textContent=t.dataset.tip;if(!t.dataset.tip){return}tip.classList.add("on");const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";tip.style.top=Math.max(8,y-h-14)+"px"}
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType==="mouse")showTip(t,e.clientX,e.clientY);else if(e.pointerType==="mouse")tip.classList.remove("on")});
document.addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t&&e.pointerType!=="mouse"){showTip(t,e.clientX,e.clientY);clearTimeout(tipT);tipT=setTimeout(()=>tip.classList.remove("on"),2200)}});
let rz=null;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>A&&drawCharts(),120)});
addEventListener("orientationchange",()=>setTimeout(()=>A&&drawCharts(),250));

loadLocal();autoDemo();
sel=curWeek();
render();
if(!initFirebase())initDb();
})();
