<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPA Anbima</title>
<meta name="theme-color" content="#0f6b46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=4">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<style>
:root{
  --bg:#f3f8f5;--card:#ffffff;--ink:#11291f;--ink2:#46604f;--ink3:#7b9284;--line:#dbe8e0;
  --g9:#0b3b29;--g8:#0f5a3c;--g7:#0f6b46;--g6:#17885a;--g5:#2ea36f;--g4:#5fbf8f;--g3:#a3dcbd;--g2:#d3eedf;--g1:#ebf7f0;
  --warn:#b7791f;--warn-bg:#fdf3e1;--bad:#b4472f;--bad-bg:#fbebe6;
  --r:14px;--sh:0 1px 2px rgba(15,60,40,.06),0 4px 16px rgba(15,60,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:17px;font-weight:650;color:var(--g9)}
h3{font-size:15px;font-weight:650}
.muted{color:var(--ink3)}.small{font-size:13px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--g7);color:#fff;font-size:14px;letter-spacing:.5px}
.logo h1{font-size:20px;color:var(--g9)}
.logo span{display:block;font-size:12.5px;color:var(--ink3);font-weight:500}
.top .sp{flex:1}
.sync{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--g5);display:inline-block}
.sync.err i{background:var(--bad)}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--g7);color:#fff;font-weight:600;font-size:14px;transition:background .15s}
.btn:hover{background:var(--g8)}
.btn:disabled{opacity:.5;cursor:default}
.btn.alt{background:var(--g1);color:var(--g8)}.btn.alt:hover{background:var(--g2)}
.btn.ghost{background:transparent;color:var(--g7);padding:6px 8px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}
.hero{display:grid;grid-template-columns:1.1fr 2fr;gap:14px;margin-bottom:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.count{background:linear-gradient(150deg,var(--g7),var(--g9));color:#fff;border:0}
.count .lb{font-size:12.5px;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.count .big{font-size:44px;font-weight:750;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.count .sub{font-size:14px;opacity:.9}
.count .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.count input[type=date]{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 8px;color-scheme:dark}
.count .tip{margin-top:10px;font-size:13px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .lb{font-size:12.5px;color:var(--ink3);font-weight:500}
.kpi .v{font-size:26px;font-weight:720;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--g9)}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.meter{height:8px;border-radius:6px;background:var(--g1);margin-top:8px;position:relative;overflow:visible}
.meter>b{display:block;height:100%;border-radius:6px;background:var(--g5)}
.meter>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--g9);border-radius:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h .sp{flex:1}
.blk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0}
.blk .nm{font-weight:600;font-size:14px}
.blk .nm small{font-weight:500;color:var(--ink3);margin-left:6px}
.blk .pc{font-weight:700;font-variant-numeric:tabular-nums}
.blk .bar{grid-column:1/-1}
.ok{color:var(--g6)}.mid{color:var(--warn)}.low{color:var(--bad)}
.bar{height:8px;border-radius:6px;background:var(--g1);position:relative}
.bar>b{display:block;height:100%;border-radius:6px}
.bar>i{position:absolute;left:70%;top:-3px;bottom:-3px;width:2px;background:var(--g9);opacity:.55}
.b-ok{background:var(--g5)}.b-mid{background:#e0a440}.b-low{background:#d0705a}.b-na{background:var(--g2)}
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--ink3);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.focus{display:grid;gap:8px}
.fc{border-radius:12px;padding:10px 12px;background:var(--g1);border:1px solid var(--g2)}
.fc.low{background:var(--bad-bg);border-color:#f2d3ca}.fc.mid{background:var(--warn-bg);border-color:#f3e0bb}
.fc b{display:block;font-size:14px;color:var(--ink)}
.fc span{font-size:13px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:right}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11.5px;font-weight:650;border-radius:20px;padding:2px 8px;background:var(--g1);color:var(--g8);white-space:nowrap}
.tag.b1{background:#e3f4ea}.tag.b2{background:#d4eee0}.tag.b3{background:#c6e8d6}.tag.b4{background:#eef6e3;color:#4b6b1f}
.minibar{width:70px;height:6px;border-radius:4px;background:var(--g1);display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.minibar b{display:block;height:100%}
.tbl-wrap{overflow-x:auto}
@media(max-width:600px){.col-b{display:none}.minibar{width:36px;margin-right:5px}td,th{padding:7px 4px}details.sv summary{flex-wrap:wrap}.wrap{padding:12px 12px 56px}.card{padding:14px}}
.seg{display:inline-flex;background:var(--g1);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--ink2);font-weight:600}
.seg button.on{background:#fff;color:var(--g8);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tblocos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:980px){.tblocos{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.tblocos{grid-template-columns:1fr}}
.tb{position:relative;overflow:hidden;border-radius:16px;padding:16px;color:#fff;border:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:178px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.tb:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,60,40,.18)}
.tb.b1{background:linear-gradient(135deg,#0b4f35,#17885a)}.tb.b2{background:linear-gradient(135deg,#0f5a3c,#2ea36f)}
.tb.b3{background:linear-gradient(135deg,#145c52,#2b9a86)}.tb.b4{background:linear-gradient(135deg,#2c6236,#5fa35a)}
.tb::after{content:attr(data-n);position:absolute;right:-6px;bottom:-30px;font-size:120px;font-weight:800;opacity:.10;line-height:1}
.tb .k{font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85;font-weight:650}
.tb .nm{font-size:17px;font-weight:720;line-height:1.25}
.tb .ct{font-size:13px;opacity:.9}
.tb .pb{height:6px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:auto}
.tb .pb b{display:block;height:100%;background:#fff;border-radius:4px}
.tb .ft{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px}
.tb .go{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-weight:650;white-space:nowrap}
.choice button .pr{display:block;font-size:12px;color:var(--ink3);margin-top:2px}
.choice .row{display:flex;gap:6px;align-items:stretch}.choice .row button:first-child{flex:1}
.choice .row .rz{flex:none;font-size:12.5px;color:var(--ink2);text-align:center;padding:8px 10px}
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sim{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:118px}
.sim .t{font-weight:650;font-size:14.5px}
.sim .st{font-size:12.5px;color:var(--ink3)}
.sim .sc{font-size:22px;font-weight:720;font-variant-numeric:tabular-nums}
.sim .sp{flex:1}
.sim.done{background:var(--g1);border-color:var(--g2)}
.sim.prog{border-color:var(--g4)}
.sim .act{display:flex;gap:6px;flex-wrap:wrap}
.redo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.redo .v{font-size:30px;font-weight:750;color:var(--g8);font-variant-numeric:tabular-nums}
.saved{display:grid;gap:8px}
details.sv{border:1px solid var(--line);border-radius:12px;background:#fff}
details.sv summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
details.sv summary::-webkit-details-marker{display:none}
details.sv summary .q{flex:1;font-size:14px}
details.sv[open] summary{border-bottom:1px solid var(--line)}
details.sv .body{padding:12px;font-size:14px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.in:focus{outline:2px solid var(--g3);border-color:var(--g4)}
textarea.in{min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.msg{border-radius:10px;padding:9px 12px;font-size:14px;background:var(--g1);color:var(--g8);margin:8px 0}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.foot{margin-top:24px;text-align:center;font-size:12.5px;color:var(--ink3)}
.foot a{color:var(--g7)}
/* login */
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.login label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
/* sessão (tela cheia) */
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .bar-top{position:sticky;top:0;background:rgba(243,248,245,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:2}
.ov .bar-top .in2{max-width:820px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:6px}
.ov .bar-top .ttl{font-weight:650;font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .bar-top .btn.sm{padding-left:8px;padding-right:8px}
.ov .bar-top .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:var(--g1);color:var(--g8);border-radius:8px;padding:4px 10px}
.timer.warn{background:var(--warn-bg);color:var(--warn)}
.prog{height:4px;background:var(--g1)}
.prog b{display:block;height:100%;background:var(--g5);transition:width .2s}
.qwrap{max-width:820px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.case{background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--g8);font-weight:600;margin-bottom:10px}
.ctx{font-size:16px;line-height:1.6}
.enun{font-size:16px;font-weight:650;margin:14px 0 12px}
.qz{font-size:var(--qfs,16px)}
.qz .ctx,.qz .enun{font-size:inherit}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;color:var(--ink);font-size:inherit;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--g4);background:#fbfefc}
.opt .L{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--g1);color:var(--g8);font-weight:700;font-size:13.5px}
.opt.sel{border-color:var(--g6);background:var(--g1)}
.opt.sel .L{background:var(--g6);color:#fff}
.opt.right{border-color:var(--g5);background:#eaf7ef}
.opt.right .L{background:var(--g5);color:#fff}
.opt.wrong{border-color:#e3a594;background:var(--bad-bg)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{font-size:13.5px;color:var(--ink2);margin-top:4px}
.gab{margin-top:14px;border-radius:12px;padding:14px;background:#fff;border:1px solid var(--line)}
.gab h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gab .res{font-weight:700}
.gab p{margin:6px 0}
.dica{margin-top:10px;background:var(--g1);border-left:3px solid var(--g5);border-radius:8px;padding:8px 10px;font-size:14px}
.nav{margin-top:16px}
.nav .in2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .sp{flex:1}
.star{border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink3);padding:2px 6px}
.star.on{color:#d39b1c}
.res-hero{text-align:center;padding:22px 16px}
.res-hero .sc{font-size:52px;font-weight:780;line-height:1;color:var(--g8);font-variant-numeric:tabular-nums}
.res-hero .ap{display:inline-block;margin-top:10px;border-radius:20px;padding:4px 12px;font-weight:650;font-size:14px}
.ap.yes{background:var(--g2);color:var(--g8)}.ap.no{background:var(--bad-bg);color:var(--bad)}
.rv{display:grid;gap:10px;margin-top:14px}
.rv .item{border:1px solid var(--line);border-radius:12px;background:#fff}
.rv .item summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center}
.rv .item summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--g5)}.dot.no{background:var(--bad)}.dot.na{background:#c9d6ce}
.rv .item .body{padding:0 12px 12px}
.pal{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.pal button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink2)}
.pal button.a{background:var(--g2);border-color:var(--g3);color:var(--g8)}
.pal button.cur{outline:2px solid var(--g6)}
.pal button.ok{background:#dff3e7;color:var(--g8)}.pal button.no{background:var(--bad-bg);color:var(--bad);border-color:#f0cfc5}
.modal{position:fixed;inset:0;background:rgba(10,40,25,.35);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:440px;width:100%}
.modal p{margin:8px 0 14px;color:var(--ink2)}
.modal .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.choice{display:grid;gap:8px;margin:10px 0 14px}
.choice button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.choice button:hover{border-color:var(--g4)}
.choice button b{display:block;color:var(--g8)}
.choice button span{font-size:13px;color:var(--ink2)}

/* ===== ambiente de prova (simulação da tela do exame) ===== */
.cbt{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#e9edf1;color:#1d2731;--cb:#24425f;--cb2:#33597d;--cl:#cfd8e1;font-size:15px}
.cbt-h{background:var(--cb);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:10px;min-height:44px}
.cbt-h .t1{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbt-h .t2{font-size:11.5px;opacity:.75;white-space:nowrap}
.cbt-h .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.cbt-h .qn{font-weight:650;font-size:14px;white-space:nowrap;background:rgba(255,255,255,.12);border-radius:6px;padding:3px 9px}
.cbt-h .tm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.cbt-h .tm small{font-size:10.5px;opacity:.75}
.cbt-h .tm b{font-variant-numeric:tabular-nums;font-size:17px;letter-spacing:.3px}
.cbt-h .tm.warn b{color:#ffd27a}
.cbt-tb{background:#f7f9fb;border-bottom:1px solid var(--cl);display:flex;gap:4px;padding:5px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cbt-tb::-webkit-scrollbar{display:none}
.cbt-tb button{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--cl);background:#fff;color:#24425f;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600}
.cbt-tb button:hover{background:#eef3f8}
.cbt-tb button.on{background:var(--cb);border-color:var(--cb);color:#fff}
.cbt-tb button svg{width:16px;height:16px;flex:none}
.cbt-tb .sp{flex:1;min-width:6px}
.cbt-m{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cbt-q{max-width:860px;margin:0 auto;padding:16px 16px 24px;font-size:var(--qfs,16px)}
.cbt-m.split{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.cbt-m.split>div{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.cbt-m.split .cbt-case{border-right:1px solid var(--cl);background:#fbfcfd}
.cbt-m.split .cbt-q{max-width:none;margin:0}
.cbt-case .in3{padding:16px;font-size:var(--qfs,16px);line-height:1.6}
.cbt-lb{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#5b6d7e;margin-bottom:8px}
.cbt-cs{display:inline-block;background:#e3ebf3;color:#24425f;border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:650;margin-bottom:10px}
.cbt-q .ctx{font-size:inherit;line-height:1.6}
.cbt-q .enun{font-size:inherit;font-weight:650;margin:12px 0}
.cbt-alts{display:grid;gap:8px}
.cbt-alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--cl);border-radius:6px;padding:11px 12px;font-size:inherit;color:inherit;line-height:1.5}
.cbt-alt:hover:not(:disabled){border-color:#8aa3bb;background:#f8fbfe}
.cbt-alt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #7c8fa2;margin-top:2px;display:grid;place-items:center;background:#fff}
.cbt-alt .lt{flex:none;font-weight:700;min-width:18px}
.cbt-alt.sel{border-color:var(--cb2);background:#eef4fa;box-shadow:inset 0 0 0 1px var(--cb2)}
.cbt-alt.sel .rd{border-color:var(--cb2)}

 ["1.1.1","Órgãos normativos (CMN, CNSP, CNPC)"],["1.1.2","Supervisores (BC, CVM, SUSEP, PREVIC)"],["1.1.3","Instituições e participantes do SFN"],

 ["3.1.6","Imposto de renda da pessoa física"],["3.1.3.3","Crédito e gestão de dívidas (pessoa física)"],["3.1.3","Orçamento e reserva de emergência"],["3.1.4","Balanço patrimonial pessoal"],["3.1.5","Planejamento financeiro e aposentadoria"],["3.1.1","Ciclo de vida do investidor"],["3.1.2","Ciclo de vida do investidor"],["3.1","Finanças pessoais"],["3.2","Orientação financeira ao cliente"],["3.3","Perfil do investidor e adequação"],
 ["3.4.1","Código de ética Anbima"],["3.4.2","Suitability e código de distribuição"],["3.4.3","Atendimento e conflito de interesses"],["3.4.4","Riscos da atividade profissional"],
 ["3.4.5","PLD/FT e conheça seu cliente"],["3.4.6","LGPD, sigilo e comunicação ao COAF"],["3.4.7","Crimes e ilícitos de mercado"],["3.4","Conduta profissional"],
 ["4.1","ESG e investimento sustentável"],["4.2","ESG e investimento sustentável"],["4.3","ESG e investimento sustentável"],["4.4","DeFi, blockchain e tokenização"],
 ["4.5","Open finance, investment e insurance"],["4.6","Inteligência artificial"],["4.7","Fintechs e meios de pagamento"],
 ["1","Sistema financeiro e economia"],["2","Produtos do mercado financeiro"],["3","Relacionamento com o cliente"],["4","Inovação e mercado"]
].sort((a,b)=>b[0].length-a[0].length);
const assunto=pd=>{const p=String(pd||"");for(const [k,n] of ASSUNTOS){if(p===k||p.startsWith(k+"."))return n}return "Outros"};
const bloco=pd=>{const b=parseInt(String(pd||"").split(".")[0],10);return BLOCOS[b]?b:0};
const L="ABCD";

/* ==================== utilidades ==================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const txt=s=>esc(s).replace(/\n/g,"<br>");
const pct=(a,n)=>n?Math.round(100*a/n):null;
const cls=p=>p==null?"na":p>=70?"ok":p>=60?"mid":"low";
const ymd=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
const hoje=()=>ymd(new Date());
const fmtData=s=>{if(!s)return "";const [y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,z=n=>String(n).padStart(2,"0");return h?`${h}:${z(m)}:${z(x)}`:`${z(m)}:${z(x)}`};
const fmtDur=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return h?`${h}h${String(m).padStart(2,"0")}`:`${m} min`};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ==================== estado ==================== */
/* E = {prova:"AAAA-MM-DD", sims:{S01:{modo,ini,fim,t,r:{"1":"B"},vis:{"1":1},atual,fin}}, ref:{"S01-05":[{d,ok}]}, salvos:{"S01-05":{em}}, fs} */
let E=LS.get("cpa-estado",null)||{prova:"",sims:{},ref:{},salvos:{}};
E.sims=E.sims||{};E.ref=E.ref||{};E.salvos=E.salvos||{};E.tr=E.tr||{};E.trs=E.trs||{};
let IDX=[];          /* simulados oficiais (index.json) */
let TIDX=[];         /* banco de treino por bloco (treino/index.json) */
let EXTRA={};        /* simulados anexados: id -> objeto completo */
const FULL={};       /* cache de simulados completos */
let UI={filtroAss:"atencao",msg:"",err:"",anexo:false,busca:"",ses:null,modal:null,fs:LS.get("cpa-fs",16)};
const fb={on:false,user:null,ready:false,doc:null,col:null,status:"local",err:"",msg:"",email:"",busy:false};

const fbOk=()=>{const c=window.FIREBASE_CONFIG;return !!(window.firebase&&c&&c.apiKey&&!/COLE|SUA_|YOUR_/i.test(c.apiKey))};
let saveT=null;
function salvar(){
  E.atualizado=Date.now();
  LS.set("cpa-estado",E);
  if(!fb.on||!fb.user)return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{saveT=null;fb.doc.set(JSON.parse(JSON.stringify(E))).then(()=>{fb.status="firebase";paintSync()}).catch(()=>{fb.status="erro";paintSync()})},600);
}
function salvarJa(){
  if(!saveT&&!UI.ses)return; /* nada pendente: não sobrescreve o que outra aba gravou */
  LS.set("cpa-estado",E);
  if(!fb.on||!fb.user||!fb.doc||!saveT)return;
  clearTimeout(saveT);saveT=null;
  fb.doc.set(JSON.parse(JSON.stringify(E))).then(()=>{fb.status="firebase";paintSync()}).catch(()=>{fb.status="erro";paintSync()});
}
/* reabre o simulado que ficou aberto, na questão em que você parou */
let retomou=false;
function retomar(){
  if(retomou||UI.ses||!IDX.length)return;
  if(fb.on&&!fb.carregou)return;
  retomou=true;
  const id=E.aberto;
  if(id&&String(id).startsWith("treino:")){const m=String(id).slice(7).match(/^B(\d)-(novas|sims|todas)$/);if(m&&E.trs[m[0]])abrirBloco(m[1],m[2],false);return}
  const st=id&&E.sims[id];
  if(st&&!st.fin&&(simInfo(id)))abrirSim(id,null,true);
}
function initFirebase(){
  if(!fbOk())return false;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    fb.auth=firebase.auth();fb.fs=firebase.firestore();fb.auth.languageCode="pt-BR";
    try{fb.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
    try{fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{})}catch(e){}
    fb.on=true;
    fb.auth.onAuthStateChanged(u=>{
      if(fb.unsub){fb.unsub();fb.unsub=null}if(fb.unsub2){fb.unsub2();fb.unsub2=null}
      fb.user=u||null;fb.ready=true;
      if(u){
        const base=fb.fs.collection("usuarios").doc(u.uid);
        fb.doc=base.collection("cpa").doc("estado");fb.col=base.collection("cpa_simulados");
        let first=true;
        fb.unsub=fb.doc.onSnapshot(s=>{
          if(s.metadata.hasPendingWrites)return;
          const d=s.exists?s.data():null;
          if(!d){if(first&&(Object.keys(E.sims).length||E.prova||Object.keys(E.salvos).length))salvar()}
          else if(E.atualizado&&d.atualizado&&E.atualizado>d.atualizado){salvar()} /* este aparelho tem a versão mais nova */
          else{E=Object.assign({prova:"",sims:{},ref:{},salvos:{},tr:{},trs:{}},d);LS.set("cpa-estado",E)}
          first=false;fb.status="firebase";fb.carregou=true;render();retomar();
        },e=>{fb.status="erro";fb.err="Não consegui sincronizar: "+(e.code||e.message);render()});
        fb.unsub2=fb.col.onSnapshot(sn=>{const m={};sn.forEach(d=>{try{m[d.id]=JSON.parse(d.data().json)}catch(e){}});EXTRA=m;render()},()=>{});
      }
      render();
    });
    return true;
  }catch(e){fb.on=false;return false}
}
const authMsg=er=>{const c=er&&er.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return "E-mail ou senha incorretos.";
  if(c==="auth/too-many-requests")return "Muitas tentativas. Aguarde alguns minutos e tente de novo.";
  if(c==="auth/network-request-failed")return "Sem conexão. Tente de novo.";
  return "Não consegui entrar. Tente de novo."};
async function doLogin(){
  const e=$("#lg-email"),p=$("#lg-pass");fb.email=e.value.trim();
  if(!fb.email||!p.value){fb.err="Digite o e-mail e a senha.";render();return}
  fb.busy=true;fb.err="";render();
  try{await fb.auth.signInWithEmailAndPassword(fb.email,p.value)}catch(er){fb.err=authMsg(er)}
  fb.busy=false;render();
}
async function doReset(){
  const e=$("#lg-email");fb.email=e?e.value.trim():fb.email;
  if(!fb.email){fb.err="Digite o seu e-mail para receber o link.";render();return}
  try{await fb.auth.sendPasswordResetEmail(fb.email);fb.err="";fb.msg="Enviei um e-mail com o link para criar a senha. Se não aparecer, olhe o spam."}catch(er){fb.err=authMsg(er)}
  render();
}

/* ==================== simulados ==================== */
const listaSims=()=>{
  const ofi=IDX.map(s=>({id:s.id,titulo:s.titulo,descricao:s.descricao,n:s.n,k:s.k,pd:s.pd,arquivo:s.arquivo,extra:false}));
  const ext=Object.values(EXTRA).sort((a,b)=>String(a.id).localeCompare(String(b.id))).map(s=>({id:s.id,titulo:s.titulo,descricao:s.descricao||"",n:s.q.length,k:s.q.map(q=>q.certa).join(""),pd:s.q.map(q=>q.pd),extra:true}));
  return ofi.concat(ext);
};
const simInfo=id=>listaSims().find(s=>s.id===id)||(t=>t?{...t,titulo:`Treino do bloco ${t.b}`}:null)(TIDX.find(s=>s.id===id));
async function carregarSim(id){
  if(FULL[id])return FULL[id];
  if(EXTRA[id]){FULL[id]=EXTRA[id];return FULL[id]}
  const i=IDX.find(s=>s.id===id)||TIDX.find(s=>s.id===id);if(!i)throw new Error("Simulado não encontrado");
  const r=await fetch(i.arquivo+"?v="+(i.criado||""),{cache:"no-cache"});if(!r.ok)throw new Error("Falha ao baixar o simulado");
  FULL[id]=await r.json();return FULL[id];
}
const qid=(sid,n)=>`${sid}-${String(n).padStart(2,"0")}`;
const parseQid=t=>{const m=String(t).match(/^(.+)-(\d+)$/);return m?{sid:m[1],n:+m[2]}:null};

/* ==================== estatísticas ==================== */
function stats(){
  const sims=listaSims(),S={feitos:0,emAndamento:0,resp:0,acertos:0,blocos:{},ass:{},hist:[],pend:[],recup:0,tempo:0,tempoQ:0};
  for(const b in BLOCOS)S.blocos[b]={a:0,n:0};
  for(const s of sims){
    const st=E.sims[s.id];if(!st||!st.r)continue;
    if(st.fin)S.feitos++;else if(Object.keys(st.r).length)S.emAndamento++;
    let a=0,n=0;
    for(let i=1;i<=s.n;i++){
      const r=st.r[i];const pd=s.pd[i-1],b=bloco(pd),as=assunto(pd),k=s.k[i-1];
      if(!r&&!st.fin)continue;
      const ok=r===k;n++;if(ok)a++;
      if(b){S.blocos[b].n++;if(ok)S.blocos[b].a++}
      const x=S.ass[as]||(S.ass[as]={a:0,n:0,b});x.n++;if(ok)x.a++;
      const id=qid(s.id,i),rf=E.ref[id],last=rf&&rf.length?rf[rf.length-1].ok:ok;
      if(!ok){if(last)S.recup++;else S.pend.push(id)}
    }
    S.resp+=n;S.acertos+=a;
    if(st.t){S.tempo+=st.t;S.tempoQ+=n}
    if(st.fin)S.hist.push({id:s.id,titulo:s.titulo,a,n:s.n,fim:st.fim||0,modo:st.modo});
  }
  S.hist.sort((x,y)=>x.fim-y.fim);
  /* treino por bloco: conta nos assuntos e nas erradas (revelada conta como não sabida) */
  S.treino=0;const jaPend=new Set(S.pend);
  for(const id in E.tr){const t=E.tr[id];if(!t||!t.pd)continue;S.treino++;
    const as=assunto(t.pd),x=S.ass[as]||(S.ass[as]={a:0,n:0,b:bloco(t.pd)});x.n++;if(t.ok)x.a++;
    if(!t.ok){const rf=E.ref[id],last=rf&&rf.length?rf[rf.length-1].ok:false;if(last)S.recup++;else if(!jaPend.has(id)){S.pend.push(id);jaPend.add(id)}}}
  /* nota estimada: acerto de cada bloco aplicado ao peso do bloco na prova */
  let est=0,cob=0;for(const b in BLOCOS){const x=S.blocos[b];if(x.n){est+=x.a/x.n*BLOCOS[b].p*TOTAL_Q;cob+=BLOCOS[b].p}}
  S.estimada=cob>=.999?Math.round(est):null;
  return S;
}

function focoHtml(S){

/* ==================== treino por bloco ==================== */
const DIFN={"Fácil":0,"Médio":1,"Difícil":2};
const pdCmp=(a,b)=>{const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
function treinoConta(b){
  const t=TIDX.find(x=>x.b===b),novas=t?t.n:0;
  let sims=0;for(const s of IDX)for(const pd of s.pd||[])if(bloco(pd)===b)sims++;
  let feitas=0,ok=0,vistas=0;for(const id in E.tr){const r=E.tr[id];if(!r||bloco(r.pd)!==b)continue;feitas++;if(r.ok)ok++;if(r.v)vistas++}
  return {novas,sims,feitas,ok,vistas};
}
function treinoHtml(){
  if(!TIDX.length&&!IDX.length)return "";
  return `<div class="card" style="margin-bottom:14px"><div class="sec-h"><h2>Treinar por bloco</h2><div class="sp"></div><span class="muted small">sem tempo · com botão "Ver resposta"</span></div>

    return `<button class="tb b${b}" data-a="treino" data-b="${b}" data-n="${b}"><span class="k">Bloco ${b}</span><span class="nm">${esc(x.n)}</span>
    <span class="ct">${c.novas} questões novas · ${c.sims} dos simulados</span>
    <span class="pb"><b style="width:${pc}%"></b></span>
    <span class="ft"><span>${c.feitas?`${c.feitas} feitas · ${Math.round(100*c.ok/c.feitas)}% de acerto`:"ainda não começou"}</span><span class="go">${c.feitas?"Continuar":"Começar"}</span></span></button>`}).join("")}</div></div>`;
}
const tKey=(b,f)=>`B${b}-${f}`;
async function abrirBloco(b,fonte,recomecar){
  b=+b;const key=tKey(b,fonte);
  try{
    const ids=[];

async function abrirSim(id,modo,continuar){
  try{
    const s=await carregarSim(id);
    let st=E.sims[id];
    if(!continuar||!st){st=E.sims[id]={modo,ini:Date.now(),r:{},vis:{},t:0,atual:1,fin:false}}
    UI.ses={tipo:"sim",sid:id,titulo:s.titulo,modo:st.modo,itens:s.q.map((x,i)=>({id:qid(id,i+1),x,n:i+1})),i:Math.min((st.atual||1),s.q.length)-1,fim:!!st.fin,t0:Date.now(),rev:!!st.fin};
    if(st.modo==="prova"&&!st.ciente&&(st.t>0||Object.keys(st.r).length))st.ciente=true; /* simulados começados antes da tela inicial */
    if(st.fin){UI.ses.i=0;if(E.aberto===id)delete E.aberto}else E.aberto=id;

}
async function abrirRefazer(filtro){
  const S=stats();let ids=S.pend.slice();
  const sims=[...new Set(ids.map(i=>parseQid(i).sid))];
  try{await Promise.all(sims.map(carregarSim))}catch(e){UI.err="Não consegui carregar as questões.";render();return}
  let itens=ids.map(id=>{const t=parseQid(id);return {id,x:FULL[t.sid].q[t.n-1],n:t.n,sid:t.sid}});
  if(filtro&&filtro.b)itens=itens.filter(it=>bloco(it.x.pd)===+filtro.b);
  if(filtro&&filtro.ass)itens=itens.filter(it=>assunto(it.x.pd)===filtro.ass);
  for(let i=itens.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[itens[i],itens[j]]=[itens[j],itens[i]]}
  itens=itens.slice(0,20);
  if(!itens.length)return;
  UI.ses={tipo:"ref",titulo:"Refazendo erradas",modo:"estudo",itens,i:0,resp:{},fim:false,t0:Date.now()};
  UI.modal=null;render();window.scrollTo(0,0);
}

function toolToggle(k){TOOLS.open[k]=!TOOLS.open[k];if(TOOLS.open[k]&&innerWidth<=640)for(const o in TOOLS.open)if(o!==k)TOOLS.open[o]=false}
function toolsFechar(){for(const k in TOOLS.open)TOOLS.open[k]=false;toolsSync()}
function toolsSync(){
  const box=$("#tools");if(!box)return;

  box.hidden=!on;

function toolCriar(k){
  const d=TOOLDEF[k],w=document.createElement("div");
  w.className="tw "+d.c;w.tabIndex=-1;
  const x=Math.max(8,Math.min(d.x,innerWidth-360)),y=Math.max(8,Math.min(d.y,innerHeight-300));

  w.innerHTML=`<div class="tw-h"><span>${d.t}</span><button data-tw="fechar" aria-label="Fechar">×</button></div><div class="tw-b">${toolCorpo(k)}</div>`;

  w.addEventListener("pointerdown",()=>{document.querySelectorAll("#tools .tw").forEach(o=>o.style.zIndex=1);w.style.zIndex=2});

function arrastar(w,h){
  let sx,sy,ox,oy,on=false;
  h.addEventListener("pointerdown",e=>{if(e.target.closest("button")||innerWidth<=640)return;on=true;sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;h.setPointerCapture(e.pointerId)});

function toolCorpo(k){
  if(k==="calc")return `<div class="dsp"><small data-c="exp"></small><b data-c="v">0</b></div><div class="ks">${[
    ["MC","m"],["MR","m"],["M+","m"],["M−","m"],
    ["%","o"],["√","o"],["x²","o"],["xʸ","o"],
    ["C","o"],["CE","o"],["⌫","o"],["÷","o"],
    ["7"],["8"],["9"],["×","o"],["4"],["5"],["6"],["−","o"],["1"],["2"],["3"],["+","o"],
    ["±"],["0"],[","],["=","e"]].map(([v,c])=>`<button class="${c||""}" data-k="${v}">${v}</button>`).join("")}</div>`;

/* calculadora */
const CA={d:"0",acc:null,op:null,novo:true,mem:0};
const cFmt=n=>{if(!isFinite(n))return "Erro";const r=Math.round(n*1e10)/1e10;return r.toLocaleString("pt-BR",{maximumFractionDigits:10})};
const cVal=()=>{const v=parseFloat(CA.d.replace(/\./g,"").replace(",","."));return isNaN(v)?0:v};
function cSet(n){CA.d=cFmt(n);CA.novo=true}
function cConta(){const a=CA.acc,b=cVal();let r=b;
  if(CA.op==="+")r=a+b;else if(CA.op==="−")r=a-b;else if(CA.op==="×")r=a*b;else if(CA.op==="÷")r=b===0?NaN:a/b;else if(CA.op==="xʸ")r=Math.pow(a,b);
  cSet(r);CA.acc=r}
function cTecla(k){
  if(/^[0-9]$/.test(k)){if(CA.novo||CA.d==="0"){CA.d=k;CA.novo=false}else if(CA.d.replace(/\D/g,"").length<15)CA.d+=k}
  else if(k===","){if(CA.novo){CA.d="0,";CA.novo=false}else if(!CA.d.includes(","))CA.d+=","}
  else if(["+","−","×","÷","xʸ"].includes(k)){if(CA.op&&!CA.novo)cConta();else CA.acc=cVal();CA.op=k;CA.novo=true}
  else if(k==="="){if(CA.op){cConta();CA.op=null;CA.acc=null}CA.novo=true}
  else if(k==="C"){CA.d="0";CA.acc=null;CA.op=null;CA.novo=true}
  else if(k==="CE"){CA.d="0";CA.novo=true}
  else if(k==="⌫"){if(!CA.novo){CA.d=CA.d.slice(0,-1)||"0";if(CA.d==="-")CA.d="0"}}
  else if(k==="±"){const v=-cVal();CA.d=cFmt(v);}
  else if(k==="%"){const v=cVal();cSet(CA.op&&(CA.op==="+"||CA.op==="−")&&CA.acc!=null?CA.acc*v/100:v/100)}
  else if(k==="√")cSet(Math.sqrt(cVal()));
  else if(k==="x²"){const v=cVal();cSet(v*v)}
  else if(k==="MC")CA.mem=0;else if(k==="MR")cSet(CA.mem);else if(k==="M+"){CA.mem+=cVal();CA.novo=true}else if(k==="M−"){CA.mem-=cVal();CA.novo=true}
  calcPintar();
}
function calcPintar(){const w=TOOLS.el.calc;if(!w)return;w.querySelector('[data-c="v"]').textContent=CA.d;
  w.querySelector('[data-c="exp"]').textContent=(CA.op&&CA.acc!=null?cFmt(CA.acc)+" "+(CA.op==="xʸ"?"^":CA.op):"")+(CA.mem?"   M":"")}
function calcIniciar(w){
  w.querySelector(".ks").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b){cTecla(b.dataset.k);w.focus()}});
  w.addEventListener("keydown",e=>{const m={"+":"+","-":"−","*":"×","/":"÷","^":"xʸ","Enter":"=","=":"=","Backspace":"⌫","Escape":"C","Delete":"CE",",":",",".":",","%":"%"};
    const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();e.stopPropagation();cTecla(k)}});
  calcPintar();
}

const RA={modo:"caneta",sid:null};
function rascIniciar(w){
  const cv=w.querySelector("canvas");let on=false,lx,ly;
  w.querySelector(".rbar").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;
    if(b.dataset.r==="limpar"){const c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height);rascSalvar();return}
    RA.modo=b.dataset.r;w.querySelectorAll("[data-r]").forEach(o=>o.classList.toggle("on",o.dataset.r===RA.modo))});
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener("pointerdown",e=>{on=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId);e.preventDefault()});
  cv.addEventListener("pointermove",e=>{if(!on)return;const [x,y]=pt(e),c=cv.getContext("2d"),k=cv.width/cv.getBoundingClientRect().width;
    c.lineCap="round";c.lineJoin="round";
    if(RA.modo==="borracha"){c.globalCompositeOperation="destination-out";c.lineWidth=22*k}else{c.globalCompositeOperation="source-over";c.strokeStyle="#1d2731";c.lineWidth=2.2*k}
    c.beginPath();c.moveTo(lx,ly);c.lineTo(x,y);c.stroke();lx=x;ly=y});
  const fim=()=>{if(on){on=false;rascSalvar()}};cv.addEventListener("pointerup",fim);cv.addEventListener("pointercancel",fim);
}
function rascSalvar(){const w=TOOLS.el.rasc;if(!w||!RA.sid)return;try{localStorage.setItem("cpa-rasc-"+RA.sid,w.querySelector("canvas").toDataURL("image/png"))}catch(e){}}
function rascCarregar(){
  const w=TOOLS.el.rasc;if(!w)return;const cv=w.querySelector("canvas"),sid=UI.ses&&UI.ses.sid||"ref";
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);
  if(RA.sid===sid&&cv.width===W&&cv.height===H)return;
  RA.sid=sid;cv.width=W;cv.height=H;
  let src=null;try{src=localStorage.getItem("cpa-rasc-"+sid)}catch(e){}
  if(src){const im=new Image();im.onload=()=>cv.getContext("2d").drawImage(im,0,0,W,H);im.src=src}
}

/* ==================== anexar simulado ==================== */
function validarSim(o){
  if(!o||!Array.isArray(o.q)||!o.q.length)throw new Error("O JSON precisa ter a lista \"q\" com as questões.");
  o.q.forEach((x,i)=>{
    const n=i+1;
    if(!x.contexto&&!x.enunciado)throw new Error(`Questão ${n}: falta contexto ou enunciado.`);
    if(!Array.isArray(x.alt)||x.alt.length!==4)throw new Error(`Questão ${n}: precisa de 4 alternativas em "alt".`);
    if(!L.includes(x.certa))throw new Error(`Questão ${n}: "certa" deve ser A, B, C ou D.`);
    if(!x.pd||!bloco(x.pd))throw new Error(`Questão ${n}: "pd" precisa ser um código do programa detalhado (ex.: 2.1.3).`);
    if(!x.gabarito)throw new Error(`Questão ${n}: falta o gabarito comentado.`);
    x.contexto=x.contexto||"";x.enunciado=x.enunciado||"";x.porque=x.porque||{};
  });
  return o;
}
async function anexar(texto){
  UI.err="";UI.msg="";
  try{
    const o=validarSim(JSON.parse(texto));
    const usados=new Set(listaSims().map(s=>s.id));let k=1;while(usados.has("X"+String(k).padStart(2,"0")))k++;
    o.id="X"+String(k).padStart(2,"0");o.titulo=o.titulo||`Simulado extra ${k}`;
    EXTRA[o.id]=o;
    if(fb.on&&fb.user){const j=JSON.stringify(o);if(j.length>900000)throw new Error("O simulado é grande demais (máximo de cerca de 900 KB).");await fb.col.doc(o.id).set({json:j,em:Date.now()})}
    else LS.set("cpa-extra",EXTRA);
    UI.anexo=false;UI.msg=`${o.titulo} anexado com ${o.q.length} questões.`;
  }catch(e){UI.err="Não consegui anexar: "+(e instanceof SyntaxError?"o texto não é um JSON válido.":e.message)}
  render();
}

    case "treino-zera-ok":{const [b,f]=String(id).split("|");abrirBloco(b,f,true);return}

    case "ant":if(UI.ses.i>0){UI.ses.i--;marcarPos();render();topoQ()}return;

  if(L.includes(k)&&k.length===1){responder(k)}
  else if(e.key==="ArrowRight"||e.key==="Enter"){const b=document.querySelector('[data-a="prox"]:not([disabled]),[data-a="fim"]');if(b)b.click()}
  else if(e.key==="ArrowLeft"&&s.modo==="estudo"){const b=document.querySelector('[data-a="ant"]');if(b)b.click()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("lg-"))doLogin()});
window.addEventListener("beforeunload",()=>{if(UI.ses&&UI.ses.tipo==="sim")LS.set("cpa-estado",E)});
window.addEventListener("pagehide",salvarJa);
document.addEventListener("visibilitychange",()=>{if(document.hidden)salvarJa()});

  if(!initFirebase()){EXTRA=LS.get("cpa-extra",{})}
  render();
  try{const r=await fetch("simulados/index.json",{cache:"no-cache"});IDX=await r.json()}catch(e){UI.err="Não consegui carregar a lista de simulados. Verifique a conexão e recarregue."}
  try{const r=await fetch("treino/index.json",{cache:"no-cache"});if(r.ok)TIDX=await r.json()}catch(e){}
  render();retomar();
})();
</script>
